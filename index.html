  /* a) debajo de un título suelto, un renglón de solo textos (≥3) y luego filas con números = títulos que no conozco → no adivino */

function classify(sh){
  const has=k=>sh.cols.some(c=>c.raw===k),nm=nz(sh.name);

function autoMap(sh,kind){

async function leer(file){
  const name=file&&file.name||'archivo',ext=(name.split('.').pop()||'').toLowerCase();
  let buf;try{buf=await file.arrayBuffer()}catch(e){return {ok:false,msg:'No pude abrir ese archivo.'}}
  const u8=new Uint8Array(buf,0,Math.min(8,buf.byteLength));
  if(!buf.byteLength)return {ok:false,msg:'Ese archivo está vacío.'};
  if(u8[0]===0xD0&&u8[1]===0xCF)return {ok:false,msg:'Ese archivo es de un Excel muy antiguo (.xls). Ábrelo en Excel y guárdalo como «Libro de Excel (.xlsx)» o como CSV; luego súbelo aquí.'};
  let wb;
  try{
    if(u8[0]===0x50&&u8[1]===0x4B){
      if(!window.CuadreXLSX)return {ok:false,msg:'El lector de Excel no está disponible.'};
      wb=await CuadreXLSX.read({arrayBuffer:()=>Promise.resolve(buf),name});
      if(!wb.sheets.length)return {ok:false,msg:'No encontré hojas en ese archivo.'};
    }else{
      if(ext==='json'||(u8[0]===0x7B))return {ok:false,msg:'Eso parece una copia de seguridad. Para recuperarla usa «Restaurar una copia de seguridad».',backup:true};
      let txt;try{txt=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){txt=new TextDecoder('windows-1252').decode(buf)}
      wb={sheets:[{name:name.replace(/\.[^.]+$/,'')||'Datos',hidden:false,rows:parseCSV(txt),merges:[]}]};
    }
  }catch(e){console.error('Cuadre: importar',e);return {ok:false,msg:'No pude leer ese archivo. Si es de LibreOffice, Numbers o Google Sheets, guárdalo como Excel (.xlsx) o CSV y vuelve a subirlo.'}}
  if(wb.sheets.some(s=>String(((s.rows||[])[0]||[])[0]||'').indexOf('CUADRE-RESPALDO v1')===0))
    return {ok:false,msg:'Ese Excel es una copia de seguridad de Cuadre. Para recuperarla usa «Restaurar una copia de seguridad».',backup:true};
  return {ok:true,wb,name}}

  const mkEnt=(r,src)=>{const E={nom:r.nom||r.cod||r.barras||'Producto',cod:r.cod||'',barras:r.barras||'',cat:r.cat||'',marca:r.marca||'',u:r.u||'',pv:r.pv==null?null:r.pv,costo:r.costo==null?null:r.costo,min:r.min||0,ideal:r.ideal||0,stock:r.stock==null?null:r.stock,src,movs:[],out:[],id:null};
    if(E.barras)fe.b.set(E.barras.toLowerCase(),E);if(E.cod)fe.c.set(E.cod.toLowerCase(),E);const k=nkey(E.nom);if(k&&!fe.n.has(k))fe.n.set(k,E);
    W.ent.push(E);return E};
  const defDec=(C.state.numStyle==='en')?'.':',',defOrder=(C.state.pais==='US'||C.state.numStyle==='en'&&C.state.pais!=='GB'&&C.state.pais!=='AU'&&C.state.pais!=='NZ'&&C.state.pais!=='IE'&&C.state.pais!=='IN'&&C.state.pais!=='ZA')?'mdy':'dmy';

/* Las medidas reales (mm) vienen de PLAN.etiquetas (core.js): rollo = una etiqueta por página del tamaño exacto; hoja = etiquetas adhesivas estándar. */
const PT=0.3528;                                                   // 1 punto = 0,3528 mm
/* una etiqueta dentro del rectángulo x,y,w,h (mm): nombre, precio, código y el texto del código */
function drawLabel(d,st,it,x,y,w,h,o){
  const pad=Math.min(2.2,w*.05),ink=[20,24,33],F=st.ctx.fmt,money=F.moneyPdf||F.money,big=h>=38,
    nfs=big?9:h>=29?7.5:6.5,pfs=big?14:h>=29?10.5:9,tfs=big?7:6;
  let yy=y+pad;

  {const all=lines(d,it.nom||'',w-pad*2),mx=o.pv&&it.pv!=null?2:3,L=all.slice(0,mx);
   if(all.length>mx){let t=L[mx-1]+'…';while(t.length>2&&d.getTextWidth(t)>w-pad*2)t=t.slice(0,-2)+'…';L[mx-1]=t}      // nombre largo: se corta con «…»
   L.forEach(l=>{yy+=nfs*PT*.92;d.text(l,x+w/2,yy,{align:'center'});yy+=nfs*PT*.22})}
  if(o.pv&&it.pv!=null){d.setFontSize(pfs);yy+=pfs*PT*.92;d.text(S(money(it.pv)),x+w/2,yy,{align:'center'});yy+=pfs*PT*.18}
  const code=String(it.barras||it.cod||'').trim()||String(it.nom||''),txtH=tfs*PT*1.1,top=yy+.8,avail=Math.max(5,y+h-pad-txtH-.6-top);

    drawBars(d,x+pad,top,w-pad*2,bh,mods,ink,isE?4:6);used=bh;
  }else{
    const sz=Math.max(8,Math.min(avail,w-pad*2));drawQR(d,x+(w-sz)/2,top,sz,code,ink);used=sz;
  }
  d.setFont('helvetica','normal');d.setFontSize(tfs);tc(d,[70,78,92]);

}

function prodList(){

      <p>Ingresa la cuenta de Google <b>con la que se compró la versión para PC en Google Play</b> (la misma de tu teléfono Android).</p>${off}
      <div class="pcgb">${gb('pc-otra','Usar otra cuenta de Google')}${u?`<a class="btn big ghost" href="${esc(u)}" target="_blank" rel="noopener">${ic('share',19)}Contactar al proveedor</a>`:''}</div>`;
  }else if(est==='sin'){

    body=`<p>La cuenta <b>${esc(K.email)}</b> no tiene la versión para PC.</p>

      <div class="pcgb">${gb('pc-otra','Usar otra cuenta de Google')}

/* ---------- plan: dos tarjetas lado a lado (Gratis | Pro) ---------- */
function planTopHTML(){
  const P=C.PLAN,pro=C.isPro(),tr=C.trial(),st=C.state,L=C.licInfo(),pm=C.billing.precio('mes'),pa=C.billing.precio('anio'),ah=C.ahorroPct(),play=C.billing.enPlay();
  const trialOn=pro&&!L&&!st.devPlan&&tr.active,paid=pro&&!trialOn;
  const li=a=>a.map(t=>`<li>${ic('check',14,'',2.8)}<span>${esc(t)}</span></li>`).join('');
  const why=st.devPlan?'Modo de pruebas activado.':L?(L.incl?'Incluido con tu versión para PC hasta el '+C.fechaDoc(L.until)+'. Para seguir con Pro, elige Anual o Mensual.':L.via==='play'?'Suscripción de Google Play activa. Se renueva sola.':L.until?'Activo hasta el '+C.fechaCorta(L.until)+'.':'Activado en tu cuenta. Sin vencimiento.'):'Todo desbloqueado.';
  const freeFoot=!pro?`<div class="plxcur on">${ic('check',15,'',2.8)}Tu plan actual</div>`:`<div class="plxcur">${trialOn?'Después de la prueba':'Incluido en tu Pro'}</div>`;
  let proFoot;
  if(paid)proFoot=`<div class="plxcur on pro">${ic('check',15,'',2.8)}Tu plan actual</div><p class="plxfine">${esc(why)}</p>${L&&L.via==='play'?`<button type="button" class="plxmg" data-a="play-manage">Administrar o cancelar mi suscripción</button>`:''}${L&&L.incl?`<div class="plxcta"><button type="button" class="plxb" data-a="buy">${ic('crown',17)}Seguir con Pro</button></div>`:''}`;
  else if(trialOn)proFoot=`<div class="plxst">${ic('clock2',14,'',2.4)}Prueba: ${tr.daysLeft===1?'queda 1 día':'quedan '+tr.daysLeft+' días'}</div><div class="plxcta"><button type="button" class="plxb" data-a="buy">${ic('crown',17)}Hazte Pro</button></div><p class="plxfine">Si no lo compras, vuelves al plan Gratis y no pierdes nada.</p>`;
  else proFoot=`<div class="plxcta"><button type="button" class="plxb" data-a="buy">${ic('crown',17)}Hazte Pro</button>${tr.used?'':`<button type="button" class="plxo" data-a="trypro">o probar ${P.trialDays} días gratis</button>`}</div><p class="plxfine">Cancelas cuando quieras. Tu información no se borra.</p>`;
  const trust=[['shield','Pago seguro',play?'Google Play':'Directo con el vendedor'],['refresh','Cancelas cuando quieras','Sin compromiso'],tr.used?['lockc','Tus datos son tuyos','No se borran al terminar']:['gift',P.trialDays+' días gratis','Sin tarjeta']];
  return `<section class="plx" id="plan">
    ${tr.expired&&!pro?`<p class="plxnote">Tu prueba de Pro terminó. Sigues con el plan Gratis y no perdiste nada.</p>`:''}
    <div class="plxg">
      <div class="plxc free"><div class="plxh"><span class="plxic">${ic('shield',20)}</span><div><b>Plan Gratis</b><i>Ideal para empezar</i></div></div>
        <div class="plxpr"><b>${esc(C.money0(0))}</b><span>Para siempre</span></div>
        <ul class="plxl">${li(P.listaGratis())}</ul>${freeFoot}</div>
      <div class="plxc pro"><span class="plxpop">Más popular</span><div class="plxh"><span class="plxic g">${ic('crown',20)}</span><div><b>Plan Pro</b><i>Más funciones para tu negocio</i></div></div>
        <div class="plxin"><div class="plxpr"><b>${esc(pa)}</b><span>al año</span></div><p class="plxmes">o ${esc(pm)} al mes</p>${ah?`<p class="plxsv">Ahorras ${ah}&nbsp;% con el plan anual</p>`:''}
          <ul class="plxl">${li(P.listaPro())}</ul>${proFoot}</div></div>
    </div>
    <ul class="plxt">${trust.map(t=>`<li><span class="plxti">${ic(t[0],19)}</span><b>${esc(t[1])}</b><i>${esc(t[2])}</i></li>`).join('')}</ul>
    ${pro||tr.used?'':`<button type="button" class="pban" data-a="trypro">${ic('gift',22)}<span><b>Prueba Pro gratis por ${P.trialDays} días</b><i>Descubre todas las funciones sin compromiso.</i></span>${ic('chev',17,'',2.4)}</button>`}
    <div class="faq"><h4>Preguntas frecuentes</h4><details><summary>¿Qué pasa cuando termina la prueba?</summary><p>Vuelves al plan Gratis. No pierdes productos, ventas ni cotizaciones: lo de Pro queda bloqueado hasta que lo actives.</p></details>
      <details><summary>¿Cómo pago y activo Pro?</summary><p>${play?'Tocas «Hazte Pro», eliges Anual o Mensual y pagas con Google Play. Se activa solo, para tu cuenta de Google, y también funciona en tus otros dispositivos.':'Tocas «Hazte Pro», eliges Anual o Mensual y le escribes al vendedor para pagar. Él te envía un código y lo pegas en «Ya tengo mi código». Se activa para tu cuenta de Google y funciona en tus otros dispositivos.'}</p></details>
      <details><summary>¿Qué pasa si cancelo?</summary><p>Sigues con Pro hasta que termine el período que ya pagaste. Después vuelves al plan Gratis y no pierdes productos, ventas ni cotizaciones.</p></details>
      <details><summary>¿Y si llego al límite de ${P.maxProductos} productos?</summary><p>Sigues usando todo lo que ya tienes. Para agregar más productos hace falta Pro.</p></details></div></section>`;
}

    ]],
    ['La app',[
      ['notif','Notificaciones','bell',N&&N.on&&C.notif.perm()==='granted'?'Activadas':'Avisos de stock bajo y resumen diario'],
      ['sonido','Sonido y vibración','volume',snd+(st.vibra===false?'':' · con vibración')],
      ['seg','Seguridad','shield',st.pin?'Clave activada'+(C.bio.on()?' · con huella':''):'Sin clave']

      ['rep','Reportes y exportar','excel','Historial, qué comprar, Excel y PDF'],
      ['pc','Cuadre en tu computadora','monitor',PCI?'Versión para PC activa'+(PCI.proActivo&&PCI.proUntil?' · Pro hasta el '+C.fechaDoc(PCI.proUntil):''):C.hasPC()&&C.state.devPlan==='pc'?'Modo de pruebas':desk?'Estás en la computadora':'Versión para PC '+C.billing.precio('pc')+' · incluye '+pcMesTxt()+' de Pro',PCI?'ok':'aparte'],

}

/* aviso de precio: rojo si pierdes, ámbar si la ganancia queda bajo tu mínimo (regla única: C.precioEstado) */
function pwarnHTML(costo,pv,act){
  const e=C.precioEstado(costo,pv);if(!e)return '';
  if(!C.gv())return e.k==='perdida'?`<div class="pw red" role="alert">${ic('alert',18,'',2.3)}<span><b>Vendes por debajo del costo</b><i>Revisa el precio de venta.</i></span></div>`:`<div class="pw amb" role="status">${ic('alert',18,'',2.3)}<span><b>Ganancia baja</b><i>Está bajo tu mínimo. Revisa el precio de venta.</i></span></div>`;
  const fix=act?`<button type="button" class="pwb" data-a="${act}">Usar ${esc(C.money(e.sug))}</button>`:'';
  if(e.k==='perdida')return `<div class="pw red" role="alert">${ic('alert',18,'',2.3)}<span><b>Pierdes ${esc(C.money(e.por))} por unidad</b><i>Lo vendes a ${esc(C.money(pv))} y te cuesta ${esc(C.money(costo))}.</i></span>${fix}</div>`;
  return `<div class="pw amb" role="status">${ic('alert',18,'',2.3)}<span><b>Ganancia baja: ${Math.round(e.m)} %</b><i>Tu mínimo es ${Math.round(e.min)} %. Con ${esc(C.money(e.sug))} ganas ${Math.round(e.min)} %.</i></span>${fix}</div>`}
const ganTxt=(p,costo,pv)=>{if(!C.gv())return '';costo=costo==null?p.costo:costo;pv=pv==null?p.pv:pv;return costo>0&&pv>=costo?`Ganas ${C.money(pv-costo)} por cada ${esc(C.uLabel(p.u))} vendido.`:costo>0&&pv>0?'':'Escribe el costo y el % de ganancia, o el precio directamente.'};

function prodSheet(s,i){
  const p=C.prod(s.id);if(!p)return '';
  if(!pd||pd.id!==p.id)pdInit(p);
  const K=C.kardex(p.id).slice(0,8),pro=C.isPro();
  const kr=K.length?K.map(r=>`<div class="ktr"><span>${esc(r.fecha)}</span><span class="tp ${r.tipo.toLowerCase()}">${esc(r.tipo)}</span><span class="in ${r.ent?'':'z'}">${r.ent?'+'+num(r.ent):'-'}</span><span class="out ${r.sal?'':'z'}">${r.sal?'-'+num(r.sal):'-'}</span><b>${num(r.saldo)}</b></div>`).join(''):`<p class="fine l">Todavía no hay movimientos.</p>`;
  const codeTxt=p.barras||p.cod,qr=C.qrSVG(p.cod,{size:80}),bar=C.barSVG(codeTxt,{w:150,h:54});
  const arch=p.activo===false;
  const fotoP=arch?'':`<div class="fto"><span class="ftp">${thumb(p,68)}</span><div class="ftb"><b>Foto</b><div class="ftr"><button type="button" class="btn ghost sm" data-a="ppfoto" data-id="${p.id}" data-v="cam">${ic('cam',16)}${p.img?'Cambiar':'Tomar foto'}</button><button type="button" class="btn ghost sm" data-a="ppfoto" data-id="${p.id}" data-v="gal">${ic('image',16)}Galería</button><button type="button" class="btn ghost sm" data-a="fa-open" data-t="prod" data-id="${p.id}">${ic('spark',16)}Buscar foto${C.isPro()?'':PRO}</button>${p.img?`<button type="button" class="btn txt dng" data-a="ppfoto" data-id="${p.id}" data-v="del">Quitar</button>`:''}</div></div></div>`;
  const body=`${fotoP}<section class="pst"><div><span class="lbl">En bodega</span><b class="stn">${num(p.stock)} <small>${UL(p.u)}</small></b></div><div data-r="pbadge">${arch?'<span class="badge">Archivado</span>':statusBadge(p)}</div></section>
    ${arch?`<button type="button" class="btn big" data-a="parch" data-id="${p.id}">Volver a mostrar este producto</button>`:`<div class="act3"><button type="button" class="btn sm" data-a="pv-sell" data-id="${p.id}">${ic('cart',17)}Vender</button><button type="button" class="btn ghost sm" data-a="pv-in" data-id="${p.id}">${ic('entrada',17)}Ingreso</button><button type="button" class="btn ghost sm" data-a="pv-out" data-id="${p.id}">${ic('salida',17)}Salida</button></div>`}
    ${arch?'':`<section class="blk"><h4>Aviso de mínimo</h4><div class="minr"><div class="stp"><button type="button" data-a="minstep" data-d="-1" aria-label="Bajar el mínimo">${ic('minus',18,'',2.4)}</button><input type="text" inputmode="decimal" data-n="1" data-f="pmin" aria-label="Mínimo" value="${esc(pd.min)}"><button type="button" data-a="minstep" data-d="1" aria-label="Subir el mínimo">${ic('plus',18,'',2.4)}</button></div><span class="minu">${UL(p.u)}</span></div>
      <p class="fine l" data-r="minn">${minTxt(p,pnum(pd.min))}</p></section>
    <section class="blk"><h4>Precio</h4>${C.gv()?`<div class="row3">
      <label class="fl"><span>Costo</span>${inw('$','pcosto',pd.costo)}</label>
      <label class="fl"><span>% ganancia</span>${inw('','ppct',pd.pct,'%')}</label>
      <label class="fl"><span>Precio venta</span>${inw('$','ppv',pd.pv)}</label></div>`:`<label class="fl"><span>Precio venta</span>${inw('$','ppv',pd.pv)}</label>${gvBlock('El costo y la ganancia de este producto están protegidos.')}`}
      <p class="fine l" data-r="gan">${ganTxt(p,pnum(pd.costo),pnum(pd.pv))}</p><div data-r="pwarn">${pwarnHTML(pnum(pd.costo),pnum(pd.pv),'pfix')}</div>
      <p class="fine l" data-r="pdn">${pdDirty(p)?'Tienes cambios sin guardar. Toca «Guardar cambios» para aplicarlos.':'Cambia el costo, la ganancia o el precio y toca «Guardar cambios».'}</p></section>`}
    <section class="blk"><h4>Datos</h4><dl class="dtl"><div><dt>Código</dt><dd>${esc(p.cod)}</dd></div>${p.barras?`<div><dt>Código de barras</dt><dd>${esc(p.barras)}</dd></div>`:''}${p.marca?`<div><dt>Marca</dt><dd>${esc(p.marca)}</dd></div>`:''}<div><dt>Categoría</dt><dd>${esc(p.cat)}</dd></div><div><dt>Costo por ${UL(p.u)}</dt><dd>${gk(C.money(p.costo))}</dd></div></dl>
      ${arch?'':`<div class="two"><button type="button" class="btn ghost sm" data-a="pedit" data-id="${p.id}">${ic('edit',16)}Editar datos</button><button type="button" class="btn ghost sm" data-a="pajuste" data-id="${p.id}">${ic('refresh',16)}Corregir stock</button></div>`}</section>
    <section class="blk"><h4>Códigos</h4><div class="codes"><div class="cqr">${qr}<span>${esc(p.cod)}</span></div><div class="cbar">${bar}<span>${esc(codeTxt)}</span></div></div>
      <button type="button" class="btn ghost sm" data-a="etiq" data-id="${p.id}">${ic('print',17)}Imprimir etiquetas${pro?'':PRO}</button></section>
    <section class="blk"><h4>Kardex</h4><div class="kt"><div class="ktr kth"><span>Fecha</span><span>Tipo</span><span>Entra</span><span>Sale</span><span>Saldo</span></div>${kr}</div>
      <div class="act3"><button type="button" class="btn ghost sm" data-a="kpdf" data-id="${p.id}">${ic('doc',17)}PDF</button><button type="button" class="btn ghost sm" data-a="kexcel" data-id="${p.id}">${ic('excel',17)}Excel${pro?'':PRO}</button><button type="button" class="btn ghost sm" data-a="kshare" data-id="${p.id}">${ic('share',17)}Texto</button></div>
      ${C.movs(9,{pid:p.id}).length>8?`<button type="button" class="btn txt" data-a="khist" data-id="${p.id}">Ver todos los movimientos${ic('chev',14,'',2.4)}</button>`:''}</section>
    ${arch?'':`<button type="button" class="btn txt dng" data-a="parch" data-id="${p.id}" data-off="1">${ic('trash',16)}Archivar producto (no se borra su historial)</button>`}`;
  return frame(s,i,p.nom,`${esc(p.cod)}${p.marca?' · '+esc(p.marca):''}${p.cat?' · '+esc(p.cat):''}`,body,arch?'':pdSaveBtn(p),'tall');
}
/* se cierra la ficha con cambios sin guardar: se pregunta */
function pdirtySheet(s,i){
  const p=C.prod(s.id);if(!p)return '';
  return frame(s,i,'¿Guardar los cambios?','',`<p class="fine">Cambiaste el costo, el precio o el mínimo de «${esc(p.nom)}» y todavía no los guardaste.</p>`,
    `<button type="button" class="btn big" data-a="pd-save">Guardar cambios</button><button type="button" class="btn big ghost" data-a="pd-discard">Descartar</button><button type="button" class="btn txt" data-a="pd-keep">Seguir editando</button>`,'pros');
}

/* ---- agregar / editar producto ---- */
/* categorías: las tuyas primero y, aparte, las sugeridas para tu negocio (se tocan para usarlas) */
/* menú de tres puntos de cada fila de Productos */
function pmenuSheet(s,i){
  const p=C.prod(s.id);if(!p)return '';
  const row=(w,ico,t,d,cls)=>`<button type="button" class="mr ${cls||''}" data-a="pm-go" data-do="${w}" data-id="${p.id}"><span class="mri">${ic(ico,19)}</span><span class="mrt"><b>${t}</b>${d?`<i>${d}</i>`:''}</span>${ic('chev',17)}</button>`;
  const body=p.activo===false?`${row('open','box','Ver el producto','Historial y kardex')}${row('unarch','refresh','Volver a mostrarlo','Vuelve a la lista de Productos')}`
    :`<div class="pmh">${thumb(p,52)}<span><b>${esc(p.nom)}</b><i>${esc(p.cod)} · ${num(p.stock)} ${UL(p.u)} en bodega</i></span></div>
    ${row('sell','cart','Vender','Registra una venta de este producto')}${row('in','entrada','Ingreso','Suma stock: llegó mercadería')}${row('out','salida','Salida sin cobrar','Merma, regalo o consumo')}
    ${row('open','box','Ver el producto','Historial, kardex y códigos')}${row('edit','edit','Editar datos y foto','Nombre, precio, mínimo…')}${row('adj','refresh','Corregir stock','Cuando el conteo no coincide')}${row('arch','trash','Archivar','No se borra su historial','dng')}`;
  return frame(s,i,'Acciones','',body,'','pros');
}
function catChips(used,sug,cur){
  const c=(v,k)=>`<button type="button" class="cc ${norm1(v)===norm1(cur)?'on':''}" data-a="apcatpick" data-v="${esc(v)}">${esc(v)}</button>`;
  return (used.length?`<span class="ccl">Tus categorías</span>${used.map(c).join('')}`:'')+(sug.length?`<span class="ccl">${used.length?'Sugeridas para tu negocio':'Sugeridas para tu negocio · toca una para usarla'}</span>${sug.slice(0,8).map(c).join('')}`:'');
}
const norm1=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
function addSheet(s,i){
  const used=C.cats(),sug=C.catsSug(),A_=ap,ed=A_.id!=null,regIn=A_.ctx==='reg-ingreso',us=C.unidades();
  const foto=`<div class="fto"><span class="ftp">${thumb({nom:A_.nom||'Producto',img:A_.img},68)}</span><div class="ftb"><b>Foto del producto</b><i>Sale en la lista de productos y en tus movimientos.</i>
    <div class="ftr"><button type="button" class="btn ghost sm" data-a="apfoto" data-v="cam">${ic('cam',16)}Tomar foto</button><button type="button" class="btn ghost sm" data-a="apfoto" data-v="gal">${ic('image',16)}Galería</button><button type="button" class="btn ghost sm" data-a="fa-open" data-t="add">${ic('spark',16)}Buscar foto${C.isPro()?'':PRO}</button>${A_.img?`<button type="button" class="btn txt dng" data-a="apfoto" data-v="del">Quitar</button>`:''}</div></div></div>`;
  const body=`${foto}<label class="fl"><span>Nombre del producto</span><input class="fld" type="text" autocomplete="off" maxlength="80" placeholder="${esc(C.ej('nom'))}" data-f="apn" value="${esc(A_.nom)}"></label>
    <p class="err" data-r="aperr" hidden></p>
    <label class="fl"><span>Marca (opcional)</span><input class="fld" type="text" autocomplete="off" maxlength="40" placeholder="${esc(C.ej('marca'))}" data-f="apm" value="${esc(A_.marca)}"></label>
    <label class="fl"><span>Categoría (opcional)</span><input class="fld" type="text" autocomplete="off" maxlength="30" placeholder="${esc(C.ej('cat'))}" data-f="apcat" value="${esc(A_.cat||'')}"></label>
    ${used.length||sug.length?`<div class="cch" data-r="apcch">${catChips(used,sug,A_.cat)}</div>`:''}
    <label class="fl"><span>Unidad</span><select class="fld" data-f="apu">${us.map(u=>`<option value="${esc(u)}"${A_.u===u?' selected':''}>${esc(C.uName(u))}</option>`).join('')}<option value="__n"${A_.u==='__n'?' selected':''}>Otra unidad…</option></select></label>
    <label class="fl" data-r="apun"${A_.u==='__n'?'':' hidden'}><span>Nombre de la unidad (ej. metro, plancha)</span><input class="fld" type="text" maxlength="14" data-f="apun" value="${esc(A_.un||'')}"></label>
    <label class="fl"><span>Código de barras o QR (opcional)</span><div class="inpb"><input class="fld" type="text" autocomplete="off" placeholder="Escríbelo o escanéalo" data-f="apb" value="${esc(A_.barras)}"><button type="button" class="btn ghost sm" data-a="apscan">${ic('scan',17)}Escanear</button></div></label>
    ${C.gv()?`<div class="row3"><label class="fl"><span>Costo</span>${inw('$','apcosto',A_.costo)}</label><label class="fl"><span>% ganancia</span>${inw('','appct',A_.pct,'%')}</label><label class="fl"><span>Precio venta</span>${inw('$','appv',A_.pv)}</label></div>`
      :`<label class="fl"><span>Precio venta</span>${inw('$','appv',A_.pv)}</label>${gvBlock('El costo y la ganancia están protegidos.')}`}
    <div data-r="apwarn">${pwarnHTML(pnum(A_.costo),pnum(A_.pv),'afix')}</div>
    <div class="row3"><label class="fl"><span>Mínimo</span>${inw('','apmin',A_.min)}</label><label class="fl"><span>Ideal</span>${inw('','apideal',A_.ideal)}</label>${ed||regIn?'<span></span>':`<label class="fl"><span>Stock inicial</span>${inw('','apstock',A_.stock)}</label>`}</div>
    <p class="fine l">Te avisamos cuando el stock baje al mínimo. El ideal es lo que quieres tener bien surtido: sirve para calcular cuánto comprar.${regIn?' La cantidad que ingresas la pones en el ingreso.':''}</p>`;
  return frame(s,i,ed?'Editar producto':'Producto nuevo','',body,`<button type="button" class="btn big" data-a="apsave">${ed?'Guardar cambios':'Guardar producto'}</button>`,'tall');
}
function ajusteSheet(s,i){
  const p=C.prod(s.id);if(!p)return '';
  const body=`<p class="fine">Usa esto cuando el conteo real no coincide con la app (por ejemplo, después de contar la bodega). Queda registrado como «Ajuste» en el historial.</p>
    <div class="pst" style="margin-top:12px"><div><span class="lbl">La app dice</span><b class="stn">${num(p.stock)} <small>${UL(p.u)}</small></b></div></div>
    <label class="fl" style="margin-top:12px"><span>Cantidad real que hay (${UL(p.u)})</span>${inw('','ajq',inp(p.stock))}</label>
    <label class="fl"><span>Motivo (opcional)</span><input class="fld" type="text" maxlength="60" placeholder="Ej. Conteo físico" data-f="ajn" value="${esc(s.nota||'')}"></label>`;
  return frame(s,i,'Corregir stock',esc(p.nom),body,`<button type="button" class="btn big" data-a="ajsave" data-id="${p.id}">Guardar corrección</button>`,'pros');
}

/* ---- registrar venta / ingreso / salida ---- */
const TIPOS={venta:['Venta','Registrar venta','Descuenta del stock y suma a tus ventas.'],ingreso:['Ingreso','Registrar ingreso','Suma unidades al stock: compra, producción o devolución.'],salida:['Salida sin cobrar','Registrar salida','Descuenta del stock sin cobrar: consumo, merma, regalo o uso interno.']};
function regLineRes(l){
  const p=C.prod(l.pid);if(!p)return '';
  const ing=reg.tipo==='ingreso',after=Math.round((ing?p.stock+l.q:p.stock-l.q)*1000)/1000,u=UL(p.u);
  if(!ing&&l.q>p.stock)return `<span class="red">${ic('alert',14,'',2.3)}Solo hay ${num(p.stock)} ${u}</span>`;
  if(!ing){const e=C.precioEstado(p.costo,l.pv);
    if(e&&e.k==='perdida')return `<span class="red">${ic('alert',14,'',2.3)}${C.gv()?'Pierdes '+esc(C.money(e.por))+' por '+UL(p.u)+' (te cuesta '+esc(C.money(p.costo))+')':'Estás vendiendo por debajo del costo'}${C.bloqueaPerdida()?'. Sube el precio para vender':''}</span>`;
    if(e&&reg.tipo==='venta')return `<span class="amb">${ic('alert',14,'',2.3)}${C.gv()?'Ganancia baja: '+Math.round(e.m)+' % (tu mínimo es '+Math.round(e.min)+' %)':'Ganancia baja: está bajo tu mínimo'}</span>`}
  if(ing&&l.costo>0&&p.costo>0&&l.costo>p.costo+1e-9){const e=C.precioEstado(l.costo,p.pv);
    if(e)return `<span class="amb">${ic('alert',14,'',2.3)}${C.gv()?'El costo sube de '+esc(C.money(p.costo))+' a '+esc(C.money(l.costo))+': '+(e.k==='perdida'?'venderías con pérdida':'tu ganancia bajaría a '+Math.round(e.m)+' %'):'El costo sube: '+(e.k==='perdida'?'venderías con pérdida':'tu ganancia bajaría')}</span>`}
  if(!ing&&p.min>0&&after<=p.min)return `<span class="amb">${ic('alert',14,'',2.3)}Quedarían ${num(after)}: bajo el mínimo (${num(p.min)})</span>`;
  return `<span>Hay ${num(p.stock)} ${u}. Quedarían ${num(after)}.</span>`;
}
function regCan(){
  if(!reg.lines.length)return false;
  return reg.lines.every(l=>{const p=C.prod(l.pid);return l.q>0&&p&&(reg.tipo==='ingreso'||l.q<=p.stock)&&!(reg.tipo==='venta'&&C.bloqueaPerdida()&&C.precioEstado(p.costo,l.pv)?.k==='perdida')});
}
const regBtnTxt=()=>reg.tipo==='salida'&&C.modOn('entregas')&&(reg.quien||'').trim()?'Registrar y pedir la firma':TIPOS[reg.tipo][1];
function regTotal(){return reg.lines.reduce((a,l)=>a+l.q*l.pv,0)}
function regFootInfo(){
  if(reg.tipo==='venta')return `<span>Total</span><b data-r="rtot">${C.money(regTotal())}</b>`;
  const n=reg.lines.length;return `<span>${TIPOS[reg.tipo][0]}</span><b data-r="rtot" class="sm">${n} ${n===1?'producto':'productos'}</b>`;
}
function pickItems(q,exclude){
  const base=q.trim()?C.search(q):(C.top('mes','mas',8).map(x=>x.p).concat(C.prods().slice().sort((a,b)=>C.cmp(a.nom,b.nom))));
  const seen=new Set();return base.filter(p=>{if(seen.has(p.id))return false;seen.add(p.id);return !exclude||!exclude.includes(p.id)}).slice(0,q.trim()?30:8);
}
function pickListHTML(q,exclude,act,counts,newAct){
  const it=pickItems(q,exclude),qq=q.trim();
  /* «Producto nuevo»: un botón de verdad, del lado derecho (sin texto: junto al título de la lista) o, al buscar, uno ancho «Crear “…”» */
  const nuevo=!newAct?'':qq?`<button type="button" class="pkbtn wide" data-a="${newAct}" data-q="${esc(qq)}">${ic('plus',17,'',2.6)}<span>Crear «${esc(qq.slice(0,28))}» como producto nuevo</span></button>`
    :`<button type="button" class="pkbtn" data-a="${newAct}" data-q="">${ic('plus',16,'',2.8)}<span>Producto nuevo</span></button>`;
  if(!it.length)return `<p class="fine l pkn">${C.prods().length?'No encontré ese producto.':'Todavía no tienes productos.'}</p>${nuevo?`<div class="pkh solo">${nuevo}</div>`:''}`;
  const cab=qq?`${nuevo?`<div class="pkh solo">${nuevo}</div>`:''}<p class="pkt">Resultados</p>`:`<div class="pkh"><p class="pkt">Los que más vendes</p>${nuevo}</div>`;
  return `${cab}${it.map(p=>{const low=C.bajo(p),n=counts&&counts[p.id];
    return `<button type="button" class="pki" data-a="${act}" data-id="${p.id}"><span class="pkm"><b>${esc(p.nom)}</b><i class="${low?'lowt':''}">${low?'Por acabarse · ':''}${p.marca?esc(p.marca)+' · ':''}${num(p.stock)} ${UL(p.u)} en bodega</i></span>${n?`<em class="cnt">${ic('check',13,'',2.6)}${num(n)}</em>`:''}<b class="pkp">${C.money(p.pv)}</b></button>`}).join('')}`;
}
function regLineH(l,i){
  const p=C.prod(l.pid);if(!p)return '';
  return `<div class="rl"><div class="rlh"><b>${esc(p.nom)}</b><button type="button" class="ib sm" data-a="rdel" data-i="${i}" aria-label="Quitar ${esc(p.nom)}">${ic('x',17,'',2.2)}</button></div>
    <div class="rlg"><div class="fl"><span>Cantidad (${UL(p.u)})</span><div class="stp"><button type="button" data-a="rstep" data-i="${i}" data-d="-1" aria-label="Menos">${ic('minus',18,'',2.4)}</button><input type="text" inputmode="decimal" data-n="1" data-f="lq" data-i="${i}" aria-label="Cantidad" value="${inp(l.q)}"><button type="button" data-a="rstep" data-i="${i}" data-d="1" aria-label="Más">${ic('plus',18,'',2.4)}</button></div></div>
      ${reg.tipo==='venta'?`<label class="fl"><span>Precio</span>${inw('$','lpv',inpm(l.pv),'',' data-i="'+i+'"')}</label>`:''}
      ${reg.tipo==='ingreso'?`<label class="fl"><span>Costo de compra</span>${inw('$','lcosto',l.costo!=null?inpm(l.costo):(C.gv()&&p.costo?inpm(p.costo):''),'',' data-i="'+i+'" placeholder="'+esc(C.gv()?C.money(0):'Costo protegido')+'"')}</label>`:''}</div>
    <p class="rln" data-r="lres" data-i="${i}">${regLineRes(l)}</p></div>`;
}
function regSheet(s,i){

  else if(!C.gv()){gan=gvBlock('Los costos y la ganancia de '+(K==='hoy'?(et?'ese día':'hoy'):K==='semana'?'la semana':K==='mes'?'el mes':'el año')+' están protegidos.')}
  else{

      ${R.salidasCosto>0?`<div><dt>Salió sin cobrar (a costo) <em>${num(R.salidasUds)} ${R.salidasUds===1?'unidad':'unidades'}: mermas, regalos, consumo</em></dt><dd class="m">−${cur(R.salidasCosto)}</dd></div>`:''}</dl>
      <div class="rsn ${neg?'neg':''}"><span>${neg?'Pérdida neta':'Ganancia neta'}</span><b>${cur(Math.abs(R.neta))}</b>${R.margen!=null&&!neg?`<i>De cada ${C.money0(100)} que vendes te quedan ${C.money0(R.neta/R.ventas*100)}</i>`:''}</div>
      ${R.sinCosto?`<p class="rsw">${ic('alert',16,'',2.4)}<span>${R.sinCosto} ${R.sinCosto===1?'venta no tiene':'ventas no tienen'} el costo puesto, y por eso la ganancia puede verse mayor de lo real. Pon el costo en esos productos (Productos → el producto → Costo).</span></p>`:''}
      ${R.top&&R.top.gan>0?`<p class="rst">${ic('trendup',16,'',2.2)}<span>Lo que más te dejó: <b>${esc(R.top.nom)}</b> (${cur(R.top.gan)})</span></p>`:''}`;
  }
  const body=`${nav}${head}${kp}${gan}<p class="fine l">La ganancia neta es lo vendido menos lo que te costó la mercadería que salió, vendida o sin cobrar. No incluye gastos como arriendo, sueldos o luz.</p>`;
  return frame(s,i,C.periodoCorto(K)==='Hoy'&&!et?'Hoy':nom,K==='hoy'&&!et?esc(cap1(C.fechaLarga())):'',body,`<button type="button" class="btn big ghost" data-a="rs-hist">${ic('clock',18)}Ver los movimientos</button>`,'pros');

/* ---- Valor a costo del inventario ---- */
function valorSheet(s,i){
  const P=C.prods(),V=C.valorBodega(),VV=C.valorVenta(),G=VV-V,por=new Map();
  P.forEach(p=>{const v=Math.max(0,p.stock)*(p.costo||0);if(v>0)por.set(C.catNom(p),(por.get(C.catNom(p))||0)+v)});
  const rows=[...por].sort((a,b)=>b[1]-a[1]).slice(0,6),mx=rows.length?rows[0][1]:1;
  if(!C.gv())return frame(s,i,'Valor del inventario',P.length+' '+(P.length===1?'producto':'productos'),gvBlock('El valor de tu bodega a costo está protegido.'),`<button type="button" class="btn big ghost" data-a="close">Cerrar</button>`,'pros');
  const body=`<div class="rsh"><span class="lbl">Tu bodega vale, a lo que te costó</span><b class="rsv">${hidden()?HID:moneyBig(V)}</b></div>
    <dl class="rsd"><div><dt>Si vendes todo a tus precios</dt><dd>${mk(C.money(VV))}</dd></div><div class="sub"><dt>Ganancia posible <em>precio de venta − costo</em></dt><dd>${mk(C.money(G))}</dd></div></dl>
    ${rows.length?`<h4 class="vlh">Dónde está tu dinero</h4><ul class="vlist">${rows.map(([n,v])=>`<li><span>${esc(n)}</span><i><u style="width:${Math.max(3,Math.round(v/mx*100))}%"></u></i><b>${mk(esc(C.money0(v)))}</b></li>`).join('')}</ul>`:`<p class="rse">Aún no hay productos con costo y existencias.</p>`}
    <p class="fine l">Cuenta solo lo que hay en existencia, a su costo. Los productos sin costo puesto no suman.</p>`;
  return frame(s,i,'Valor del inventario',P.length+' '+(P.length===1?'producto':'productos'),body,`<button type="button" class="btn big ghost" data-a="rep-inv">${ic('doc',18)}Inventario valorizado (PDF)</button>`,'pros');
}

/* ---- activar Pro o la versión para PC con un código de activación atado a la cuenta de Google ---- */
const pcMesTxt=()=>{const m=C.PLAN.pcMesesPro||1;return m===1?'1 mes':m+' meses'};
function licBlockHTML(plan,s){

    const proLine=pc?(L.proActivo?`<p class="fine">${ic('crown',14)} Incluye Pro ${L.proUntil?'hasta el <b>'+esc(C.fechaDoc(L.proUntil))+'</b>':'sin límite'}, en tu teléfono y en tu PC.</p>`
      :`<p class="fine">El mes de Pro que trae la versión para PC ya terminó. La PC sigue siendo tuya. Para volver a Pro, compra el plan mensual o anual <b>en la app de tu teléfono Android</b>: con el mismo correo, tu PC también pasa a Pro.</p>${C.isPro()?'':`<button type="button" class="btn sm" data-a="buy">${ic('crown',17)}Ver los planes Pro</button>`}`):'';
    return `<div class="lcok">${ic('check',22,'',2.5)}<div><b>${quien}</b><i>${det}</i></div></div>${proLine}
    <p class="fine">${pc?'En tu computadora entra con <b>este mismo correo</b> y tu plan aparece solo. Con otro correo no se activa.':'Funciona también en tus otros dispositivos: entra con la misma cuenta de Google.'}</p>
    ${pc?'':L.via==='play'?`<button type="button" class="btn txt" data-a="play-manage">Administrar o cancelar mi suscripción</button>`:L.incl?'':`<button type="button" class="btn txt dng" data-a="lic-clear" data-w="pro">Quitar el código de este dispositivo</button>`}
    ${pc&&L.via!=='play'?`<button type="button" class="btn txt dng" data-a="lic-clear" data-w="pc">Quitar el código de este dispositivo</button>`:''}`;

/* Pasos para activar con un código del vendedor. Cada paso dice para qué sirve.
   conPedido=false: se omite «Compra» (en Hazte Pro ese paso es el botón grande de abajo) */
function licStepsHTML(plan,s,conPedido){
  const K=C.cloud.info(),P=C.PLAN,pc=plan==='pc',pn=pc?'':(s&&s.plan==='mes'?' (plan Mensual '+C.billing.precio('mes')+')':' (plan Anual '+C.billing.precio('anio')+')');
  const u=C.contactoURL(pc?'Hola, quiero la versión para PC de Cuadre ('+C.billing.precio('pc')+', pago único, incluye '+pcMesTxt()+' de Pro)'+(K.connected&&K.email?'. Mi correo de Google es '+K.email:'')+'.':'Hola, quiero Cuadre Pro'+pn+(K.connected&&K.email?'. Mi cuenta de Google es '+K.email:'')+'.');
  const who=(P.contacto&&P.contacto.quien)||'el vendedor',aWho=/^el /i.test(who)?'al '+who.slice(3):'a '+who;
  let n=0;const num_=()=>++n;
  const g=`<li class="${K.connected?'done':''}"><span class="lsn">${K.connected?ic('check',15,'',3):num_()}</span><div><b>Entra con tu cuenta de Google</b>${K.connected?`<i>${esc(K.email||'Conectada')}</i>`:`<i>Así tu ${pc?'plan':'Pro'} queda guardado en tu cuenta y lo recuperas si cambias de teléfono o de computadora.</i><button type="button" class="btn sm gbtn" data-a="cloud-on"${C.online()&&K.configured?'':' disabled'}>${GLOGO}<span>Entrar con Google</span></button>`}</div></li>`;
  if(K.connected)num_();
  const ask=conPedido?`<li><span class="lsn">${num_()}</span><div><b>Compra con ${esc(who)}</b>${u?`<i>Le escribes y le pagas. Ya va escrito tu pedido y tu cuenta de Google; él te manda tu código de activación.</i><a class="btn sm ghost" href="${esc(u)}" target="_blank" rel="noopener">${ic('share',16)}Escribir ${esc(aWho)}</a>`:`<i>Pídelo a quien te entregó la app: dile tu correo de Google${K.connected&&K.email?' ('+esc(K.email)+')':''}. Te dará tu código de activación.</i>`}</div></li>`:'';
  const code=`<li><span class="lsn">${num_()}</span><div><b>Pega el código de activación que te mandó</b><i>Con eso se activa ${pc?'la versión para PC':'Pro'} en tu cuenta.</i><label class="fl" style="margin:6px 0 0"><input class="fld mono" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CUADRE-${pc?'PC':'PRO'}-…" data-f="liccode" value="${esc(s&&s.code||'')}"></label>
      <p class="lerr" data-r="licmsg" ${s&&s.msg?'':'hidden'}>${esc(s&&s.msg||'')}</p>
      <button type="button" class="btn sm" data-a="lic-go" ${K.connected?'':'disabled'}>${s&&s.busy?'Comprobando…':'Activar'}</button></div></li>`;
  return `<ol class="lst">${g}${ask}${code}</ol>`;
}

/* =====================================================================
   Módulos Pro: entregas con firma · préstamos y alquileres · firma del negocio
   ===================================================================== */
let pn=null;                      // formulario «nuevo préstamo»
const pre={tab:'afuera'};         // pestaña de la lista de préstamos
const sig={pts:[],cur:null,draw:null};   // trazos de la firma (coordenadas 0..1 dentro del cuadro)
const dayStr=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const parseDay=v=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||'');return m?new Date(+m[1],+m[2]-1,+m[3]).getTime():0};
const SIGR=2.4;                   // proporción ancho/alto del cuadro de firma

/* ---------- firma en pantalla ---------- */
function sigReset(){sig.pts=[];sig.cur=null;sig.draw=null}
function sigInit(){
  const c=$('[data-r="sigc"]',mainEl);if(!c)return;
  const dpr=Math.min(2,window.devicePixelRatio||1),r=c.getBoundingClientRect();
  c.width=Math.max(10,Math.round(r.width*dpr));c.height=Math.max(10,Math.round(r.height*dpr));
  const g=c.getContext('2d');g.lineCap='round';g.lineJoin='round';g.strokeStyle='#0f172a';g.lineWidth=2.6*dpr;
  const draw=()=>{
    g.clearRect(0,0,c.width,c.height);
    sig.pts.forEach(st=>{g.beginPath();st.forEach((p,k)=>{const x=p[0]*c.width,y=p[1]*c.height;if(k)g.lineTo(x,y);else g.moveTo(x,y)});if(st.length===1)g.lineTo(st[0][0]*c.width+.1,st[0][1]*c.height);g.stroke()});
    const h=$('[data-r="sigh"]',mainEl);if(h)h.hidden=sig.pts.length>0;
  };
  sig.draw=draw;draw();
  const pos=e=>{const b=c.getBoundingClientRect();return [Math.min(1,Math.max(0,(e.clientX-b.left)/b.width)),Math.min(1,Math.max(0,(e.clientY-b.top)/b.height))]};
  c.onpointerdown=e=>{e.preventDefault();try{c.setPointerCapture(e.pointerId)}catch(x){}sig.cur=[pos(e)];sig.pts.push(sig.cur);draw();const er=$('[data-r="sigerr"]',mainEl);if(er)er.hidden=true};
  c.onpointermove=e=>{if(!sig.cur)return;e.preventDefault();sig.cur.push(pos(e));draw()};
  const end=()=>{sig.cur=null};c.onpointerup=end;c.onpointercancel=end;c.onpointerleave=end;
}
/* devuelve {src,w,h} (PNG con fondo transparente, recortado a la firma) o null si no hay una firma real */
function sigExport(){
  if(!sig.pts.length)return null;
  let len=0,x0=1,y0=1,x1=0,y1=0;
  sig.pts.forEach(st=>st.forEach((p,i)=>{if(i)len+=Math.hypot((p[0]-st[i-1][0])*SIGR,p[1]-st[i-1][1]);x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])}));
  if(len<.35)return null;
  const W=720,H=Math.round(W/SIGR),cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const g=cv.getContext('2d');g.lineCap='round';g.lineJoin='round';g.strokeStyle='#0f172a';g.lineWidth=5;
  sig.pts.forEach(st=>{g.beginPath();st.forEach((p,k)=>{if(k)g.lineTo(p[0]*W,p[1]*H);else g.moveTo(p[0]*W,p[1]*H)});if(st.length===1)g.lineTo(st[0][0]*W+.1,st[0][1]*H);g.stroke()});
  const pad=12,sx=Math.max(0,Math.floor(x0*W-pad)),sy=Math.max(0,Math.floor(y0*H-pad)),sw=Math.min(W-sx,Math.ceil((x1-x0)*W+pad*2)),sh=Math.min(H-sy,Math.ceil((y1-y0)*H+pad*2));
  const o=document.createElement('canvas');o.width=Math.max(8,sw);o.height=Math.max(8,sh);o.getContext('2d').drawImage(cv,sx,sy,sw,sh,0,0,o.width,o.height);
  return {src:o.toDataURL('image/png'),w:o.width,h:o.height};
}
function afterMods(){
  const s=sheets[sheets.length-1];
  if(s&&s.k==='firma')sigInit();
}

/* foto de una firma o sello → PNG transparente y recortado (quita el papel y deja solo la tinta). null si no se ve nada */
function firmaLimpia(file){return new Promise(res=>{
  if(!file||!/^image\//.test(file.type))return res(null);
  const url=URL.createObjectURL(file),im=new Image();im.onerror=()=>{URL.revokeObjectURL(url);res(null)};
  im.onload=()=>{try{
    URL.revokeObjectURL(url);const m=Math.min(1,1400/Math.max(im.width,im.height)),w=Math.max(8,Math.round(im.width*m)),h=Math.max(8,Math.round(im.height*m));
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;const g=cv.getContext('2d',{willReadFrequently:true});g.drawImage(im,0,0,w,h);
    const d=g.getImageData(0,0,w,h),a=d.data,n=w*h,lum=new Uint8Array(n),hist=new Uint32Array(256);
    for(let i=0;i<n;i++){const k=i*4,l=a[k+3]<128?255:Math.round((a[k]*299+a[k+1]*587+a[k+2]*114)/1000);lum[i]=l;hist[l]++}
    let acc=0,bg=255;for(let v=0;v<256;v++){acc+=hist[v];if(acc>=n*.85){bg=v;break}}   /* el papel = lo más claro que ocupa la mayor parte de la foto */
    bg=Math.max(bg,110);
    let x0=w,y0=h,x1=-1,y1=-1,cnt=0;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      const i=y*w+x,k=i*4,rel=lum[i]/bg,al=rel>=.86?0:rel<=.55?255:Math.round((.86-rel)/.31*255);
      if(al>0){a[k]=a[k]*.7;a[k+1]=a[k+1]*.7;a[k+2]=a[k+2]*.7}
      a[k+3]=al;if(al>90){cnt++;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
    }
    if(cnt<Math.max(60,n*.0006)){res(null);return}
    g.putImageData(d,0,0);
    const pad=Math.round(Math.max(w,h)*.012)+4,sx=Math.max(0,x0-pad),sy=Math.max(0,y0-pad),sw=Math.min(w-sx,x1-x0+1+pad*2),sh=Math.min(h-sy,y1-y0+1+pad*2);
    const k2=Math.min(1,800/Math.max(sw,sh)),ow=Math.max(8,Math.round(sw*k2)),oh=Math.max(8,Math.round(sh*k2)),o=document.createElement('canvas');o.width=ow;o.height=oh;
    o.getContext('2d').drawImage(cv,sx,sy,sw,sh,0,0,ow,oh);
    res({src:o.toDataURL('image/png'),w:ow,h:oh});
  }catch(e){res(null)}};
  im.src=url})}

/* =====================================================================
   Importar desde Excel / CSV  (el motor está en core_import.js → C.imp)
   Fases: elegir → leyendo → resumen (se puede corregir) → aplicando → listo
   ===================================================================== */
let im=null,pendImp=false;
const IMK={productos:'Productos',movimientos:'Movimientos',cotizaciones:'Cotizaciones',omitir:'No importar'};
const imTipos=[['venta','Ventas (salen y se cobran)'],['ingreso','Ingresos / compras (entran)'],['salida','Salidas (sin cobrar)']];
function imReplan(){try{im.W=C.imp.plan(im.M)}catch(e){console.error('Cuadre: importar',e);im.W=null;im.msg='Algo salió mal al revisar el archivo.'}}
function imStat(n,l,cls){return `<div class="ims ${cls||''}"><b>${num(n)}</b><i>${l}</i></div>`}
/* el texto del motor está en plural; con 1 se pasa a singular */
function imSing(t){return t.replace(/^productos:/,'producto:').replace(/^productos (tuvieron|quedaron|no entran)/,(m,v)=>'producto '+({tuvieron:'tuvo',quedaron:'quedó','no entran':'no entra'})[v])
  .replace(/^productos con cantidad negativa quedaron/,'producto con cantidad negativa quedó').replace(/^filas (repetidas|sin)/,(m,v)=>'fila '+(v==='sin'?'sin':'repetida')).replace(/^movimientos (sin|con|de)/,'movimiento $1')
  .replace(/: se saltaron\./,': se saltó.').replace(/ se importó una sola vez/,' se importó una sola vez').replace(/ no se cargaron /,' no se cargó ')}
function imAviso(a){
  const t=/^[A-ZÁÉÍÓÚ]/.test(a.txt)?a.txt:num(a.n)+' '+(a.n===1?imSing(a.txt):a.txt);
  return `<div class="pw ${a.lvl==='info'?'inf':'amb'}" role="status">${ic(a.lvl==='info'?'info':'alert',18,'',2.3)}<span><i>${esc(t)}</i></span></div>`}
function imSheetCard(sh){
  const o=!!im.open[sh.i],mapd=sh.kind!=='omitir',F=C.imp.FIELDS[sh.kind]||[];
  const nF=Math.max(0,sh.rows.length-(sh.hdr+1)-(sh.hdr<0?-1:0));
  const chips=!mapd?`<p class="fine">Esta hoja no se importa.</p>`
    :`<div class="imc">${F.map(([k,l])=>{const c=sh.map[k];if(c==null)return '';return `<span class="imchip"><b>${esc(l)}</b>${esc(C.imp.colName(sh,c).replace(/^Columna /,''))}</span>`}).join('')}${sh.top&&sh.top.nom?`<span class="imchip"><b>Producto</b>${esc(sh.top.nom)}</span>`:''}</div>`;
  const falta=mapd&&((sh.kind==='productos'&&sh.map.nom==null&&sh.map.cod==null&&sh.map.barras==null)||(sh.kind==='movimientos'&&sh.map.nom==null&&sh.map.cod==null&&sh.map.barras==null&&!(sh.top&&sh.top.nom))||(sh.kind==='movimientos'&&sh.map.q==null&&sh.map.qin==null&&sh.map.qout==null))
    ?`<div class="pw red" role="alert">${ic('alert',18,'',2.3)}<span><b>Falta una columna importante</b><i>${sh.kind==='productos'?'No encontré el nombre o el código del producto.':'No encontré qué producto o qué cantidad es cada movimiento.'} Elígela en «Cambiar columnas».</i></span></div>`:'';
  const noTipo=mapd&&sh.kind==='movimientos'&&sh.map.tipo==null&&sh.map.qin==null&&sh.map.qout==null;
  const tipoSel=noTipo?`<label class="fl"><span>Cada fila de esta hoja es…</span><select class="fld" data-f="imtipo" data-i="${sh.i}">${imTipos.map(([v,l])=>`<option value="${v}"${sh.tipoDef===v?' selected':''}>${l}</option>`).join('')}</select></label>`:'';
  const cols=sh.cols.filter(c=>c.n>0||c.label);
  const maps=o&&mapd?`<div class="imm">${F.map(([k,l])=>`<label class="fl"><span>${esc(l)}</span><select class="fld" data-f="immap" data-i="${sh.i}" data-k="${k}"><option value="">— no usar —</option>${cols.map(c=>`<option value="${c.c}"${sh.map[k]===c.c?' selected':''}>${esc(C.imp.colName(sh,c.c))}${c.sample&&c.sample[0]?' · '+esc(c.sample[0]):''}</option>`).join('')}</select></label>`).join('')}</div>`:'';
  return `<section class="imsh${mapd?'':' off'}"><div class="imsh-h"><div class="imsh-t"><b>${esc(sh.name)}</b><i>${num(Math.max(0,sh.rows.length-sh.hdr-1))} filas${sh.hidden?' · oculta':''}</i></div>
    <select class="fld imk" data-f="imkind" data-i="${sh.i}" aria-label="Qué es la hoja ${esc(sh.name)}">${C.imp.KINDS.map(([v,l])=>`<option value="${v}"${sh.kind===v?' selected':''}>${esc(l)}</option>`).join('')}</select></div>
    ${chips}${falta}${tipoSel}${mapd?`<button type="button" class="btn txt sm" data-a="im-toggle" data-i="${sh.i}">${o?'Listo, cerrar':'Cambiar columnas'}</button>`:''}${maps}</section>`}

    else{

        ${C.hayEjemplos()?`<div class="pw inf" role="status">${ic('info',18,'',2.3)}<span>Tienes productos de ejemplo cargados. Quítalos antes (Más → «Quitar productos de ejemplo») para que no se mezclen con los tuyos.</span></div>`:''}

        ${W.avisos.map(imAviso).join('')}
        ${pl?`<button type="button" class="btn sm ghost" data-a="im-pro">${ic('star',16)}Ver Pro: productos sin límite</button>`:''}
        <h4 class="imh4">Hojas de tu archivo</h4>${F.map(imSheetCard).join('')}
        ${(C.prods().length&&W.exist)||hasP&&hasM?`<h4 class="imh4">Opciones</h4>`:''}

      foot=`<button type="button" class="btn big" data-a="im-go"${nada?' disabled':''}>${nada?'Nada para importar':'Importar '+(W.nProd?num(W.nProd)+(W.nProd===1?' producto':' productos'):'')+(W.nProd&&(W.nMov||W.nCot)?' y ':'')+(!W.nProd&&W.nUpd?'las actualizaciones':'')+(W.nMov?num(W.nMov)+(W.nMov===1?' movimiento':' movimientos'):'')+(!W.nMov&&W.nCot?num(W.nCot)+(W.nCot===1?' cotización':' cotizaciones'):'')}</button><button type="button" class="btn big ghost" data-a="im-pick">Elegir otro archivo</button>`}}
  else if(m.ph==='listo'){

      ${W&&W.avisos.length?`<h4 class="imh4">Para revisar</h4>${W.avisos.map(imAviso).join('')}`:''}

/* =====================================================================
   G. Escáner real (cámara). Vive en su propia capa para que la imagen de
   la cámara no se reinicie cuando la pantalla de fondo se vuelve a dibujar.
   ===================================================================== */
let sc=null;
const SCAN_OK=()=>!!window.CuadreScan;
function openScan(mode){
  closeScan(true);
  sc={purpose:'main',mode:mode||'salida',cont:C.isPro(),res:null,locked:false,busy:false,log:[],typed:'',nn:'',np:'',nq:'1',err:'',st:'iniciando',msg:'',handle:null,canTorch:false,torch:false,gen:0};
  buildScan();startCamera();
}
/* escanear solo para llenar un campo: al leer, se cierra y devuelve el código */
function openScanPick(cb,title){
  closeScan(true);
  sc={purpose:'pick',cb,title:title||'Escanear código',mode:'pick',cont:false,res:null,locked:false,busy:false,log:[],typed:'',st:'iniciando',msg:'',handle:null,canTorch:false,torch:false,gen:0};
  buildScan();startCamera();
}
function closeScan(silent){
  if(!sc){scanEl.innerHTML='';return}
  sc.gen++;try{sc.handle&&sc.handle.stop()}catch(e){}
  sc=null;scanEl.innerHTML='';
  if(!silent)render();
}
function scanHint(){
  if(!sc)return '';
  if(sc.purpose==='pick')return 'Apunta al código de barras o QR del producto';
  return 'Apunta al código de barras, QR o Data Matrix: lo reconozco solo';
}
function buildScan(){
  const pro=C.isPro(),S=sc,pick=S.purpose==='pick';
  scanEl.innerHTML=`<div class="pov scn in ${S.res?'has':''}" role="dialog" aria-modal="true" aria-label="Escáner" style="z-index:120">
    <header class="stop"><button type="button" class="ib" data-a="scanclose" aria-label="Cerrar escáner">${ic('x',22)}</button><h2>${pick?esc(S.title):'Escanear'}</h2>
      <button type="button" class="ib tbtn" data-a="torch" aria-label="Linterna" hidden>${ic('flash',22)}</button>
      ${pick?'':`<button type="button" class="cont ${S.cont?'on':''}" data-a="scont" role="switch" aria-checked="${S.cont}"><span>Continuo</span>${pro?'':PRO}<u></u></button>`}</header>
    ${pick?'':`<div class="smode" data-r="smode">${seg([['ingreso','Ingreso'],['salida','Salida (vender)']],S.mode,'smode','dark')}</div>`}
    <div class="vf" data-r="vf"><video playsinline muted autoplay></video><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i><span class="ln"></span>
      <div class="vfs" data-r="vfs"><span class="spin"></span><b>Abriendo la cámara…</b><i>Si el teléfono te pregunta, toca «Permitir».</i></div>
      <span class="vfc" data-r="vfc" hidden></span></div>
    <p class="vfh" data-r="vfh">${esc(scanHint())}</p>
    <div class="sres scroll" data-r="sres" data-sk="scres"></div>
    <footer class="sbar"><button type="button" class="btn big" data-a="scanagain" data-r="sagain" hidden>${ic('refresh',20)}Escanear otro</button>
      <div class="tcode"><input type="text" autocomplete="off" autocapitalize="characters" placeholder="Escribir código" aria-label="Escribir código" data-f="scode"><button type="button" data-a="typeread">Leer</button></div>
      <div class="sx"><button type="button" class="lk2" data-a="sphoto">${ic('image',16)}Leer desde una foto</button><span>Un lector Bluetooth también sirve</span></div></footer></div>`;
  patchScan();
}
function patchScan(){
  if(!sc)return;const S=sc,pov=scanEl.firstElementChild;if(!pov)return;
  pov.classList.toggle('has',!!S.res);
  const vf=$('[data-r="vf"]',scanEl);vf.classList.toggle('busy',!!S.busy);vf.classList.toggle('hold',!!S.locked);vf.classList.toggle('off',S.st==='error');
  const vs=$('[data-r="vfs"]',scanEl);
  if(S.st==='iniciando'){vs.hidden=false;vs.innerHTML='<span class="spin"></span><b>Abriendo la cámara…</b><i>Si el teléfono te pregunta, toca «Permitir».</i>'}
  else if(S.st==='error'){vs.hidden=false;vs.innerHTML=`${ic('cam',30)}<b>No pude usar la cámara</b><i>${esc(S.msg)}</i>`}
  else vs.hidden=true;
  const fc=$('[data-r="vfc"]',scanEl);if(S.res&&S.res.fmt){fc.hidden=false;fc.innerHTML=ic('check',14,'',2.6)+esc(S.res.fmt)}else fc.hidden=true;
  const tb=$('.tbtn',scanEl);if(tb){tb.hidden=!S.canTorch;tb.classList.toggle('on',!!S.torch)}
  const cb=$('.cont',scanEl);if(cb){cb.classList.toggle('on',!!S.cont);cb.setAttribute('aria-checked',String(!!S.cont))}
  const sm=$('[data-r="smode"]',scanEl);if(sm)sm.innerHTML=seg([['ingreso','Ingreso'],['salida','Salida (vender)']],S.mode,'smode','dark');
  const ag=$('[data-r="sagain"]',scanEl);ag.hidden=!S.locked;
  const tc=$('.tcode',scanEl);tc.hidden=!!S.locked;
  const hint=$('[data-r="vfh"]',scanEl);if(hint)hint.textContent=S.st==='error'?'Puedes escribir el código o leerlo desde una foto.':scanHint();
  $('[data-r="sres"]',scanEl).innerHTML=resultHTML()+logHTML();
}
async function startCamera(){
  const S=sc;if(!S)return;const gen=S.gen;
  if(!SCAN_OK()){S.st='error';S.msg='El lector de códigos no se cargó. Cierra y abre la app de nuevo.';patchScan();return}
  const video=$('video',scanEl);
  try{
    const h=await CuadreScan.start(video,{onCode:(code,info)=>onScanCode(code,info),onState:st=>{}});
    if(!sc||sc.gen!==gen){h.stop();return}
    S.handle=h;S.st='activo';S.canTorch=!!h.canTorch;patchScan();
  }catch(e){
    if(!sc||sc.gen!==gen)return;
    S.st='error';S.msg=(e&&e.message)||'No se pudo abrir la cámara.';patchScan();
  }
}
function onScanCode(code,info){
  if(!sc||sc.busy||sc.locked)return;
  const fmt=info&&info.label?info.label:C.codeFmt(code);
  if(sc.purpose==='pick'){const cb=sc.cb;closeScan(true);render();toast('Leído: '+fmt+' · '+code);try{cb&&cb(code,info)}catch(e){console.error(e)}return}
  doRead(code,fmt);
}
function doRead(code,fmt){
  if(!sc)return;const S=sc;
  const r=C.scanApply(code,S.mode,1);r.fmt=fmt||C.codeFmt(code);
  S.res=r;S.err='';
  if(r.status==='ok'){C.sfx('scan');C.buzz(25)}
  if(r.status==='ok')S.log.unshift({pid:r.p.id,nom:r.p.nom,u:r.p.u,mode:r.mode,q:r.q,antes:r.antes,despues:r.despues,low:r.low,cero:r.cero});
  if(r.status==='ok'&&(r.low||r.cero))C.notif&&C.notif.low([{p:r.p,despues:r.despues}]);
  /* continuo (Pro): sigue leyendo; si no, se detiene para mostrar el resultado */
  if(!S.cont||r.status!=='ok'){S.locked=true;try{S.handle&&S.handle.pause()}catch(e){}}
  patchScan();
}
function scanAgain(){
  if(!sc)return;sc.res=null;sc.locked=false;sc.err='';try{sc.handle&&sc.handle.resume()}catch(e){}patchScan();
}
function resultHTML(){
  const S=sc,r=S.res;
  if(!r)return `<div class="rhint">${ic('scan',17)}<span>${S.purpose==='pick'?'Cuando lea el código, lo uso para llenar el campo.':S.mode==='ingreso'?'Cada lectura suma 1 unidad al stock del producto.':'Cada lectura vende 1 unidad y la descuenta del stock.'}</span></div>`;
  const fmt=`<span class="fmt">${ic('barcode',13)}<em>${esc(r.fmt||'')}</em></span>`;
  if(r.status==='ok'){
    const alert=(r.low||r.cero)?`<div class="rbn" role="alert">${ic('alert',24,'',2.1)}<div><b>${r.cero?'Se agotó':'Por acabarse'}</b><span>${r.p.min>0?`Quedan ${num(r.despues)}, mínimo ${num(r.p.min)}`:'Ya no queda stock'}</span></div></div>`:'';
    return `<div class="rc ${r.low||r.cero?'bad':'good'}">${alert}<div class="rct"><span class="rci">${ic(r.mode==='ingreso'?'entrada':'cart',20)}</span><div class="rcm"><b>${esc(r.p.nom)}</b><i>${esc(r.p.cod)}${r.p.marca?' · '+esc(r.p.marca):''}</i></div><span class="rcq">${r.mode==='ingreso'?'+':'-'}${num(r.q)}</span></div>
      <div class="rcs"><span>Stock</span><b>${num(r.antes)}</b>${ic('chev',14,'',2.4)}<b class="${r.low||r.cero?'red':''}">${num(r.despues)} ${UL(r.p.u)}</b></div>
      <div class="rca">${fmt}<button type="button" class="lnk" data-a="sprod" data-id="${r.p.id}">Ver producto${ic('chev',14,'',2.4)}</button></div></div>`;
  }
  if(r.status==='nuevo')return `<div class="rc new"><div class="rct"><span class="rci n">${ic('plus',20,'',2.4)}</span><div class="rcm"><b>Código nuevo</b><i>${esc(r.code)}</i></div></div>
    <p class="rnt">Este código todavía no es un producto. Créalo y registramos su primer ingreso.</p>
    <div class="rnf"><label class="fl"><span>Nombre</span><input class="fld" type="text" maxlength="80" autocomplete="off" placeholder="Nombre del producto" data-f="snn" value="${esc(S.nn)}"></label>
      <div class="row2" style="margin-top:0"><label class="fl"><span>Precio de venta</span>${inw('$','snp',S.np)}</label><label class="fl"><span>Cantidad</span>${inw('','snq',S.nq)}</label></div></div>
    <p class="err" data-r="snerr"${S.err?'':' hidden'}>${esc(S.err)}</p><div class="rca">${fmt}<button type="button" class="btn sm" data-a="snew">Crear e ingresar</button></div></div>`;
  if(r.status==='noexiste')return `<div class="rc warn"><div class="rbn amb" role="alert">${ic('alert',24,'',2.1)}<div><b>Este código no está en tu bodega</b><span>${esc(r.code)}</span></div></div>
    <p class="rnt">Si es un producto nuevo, regístralo como ingreso.</p><div class="rca">${fmt}<button type="button" class="btn sm" data-a="stoin">Pasar a Ingreso</button></div></div>`;
  return `<div class="rc bad"><div class="rbn" role="alert">${ic('alert',24,'',2.1)}<div><b>Sin stock</b><span>${esc(r.p.nom)} no tiene unidades para vender</span></div></div>
    <div class="rca">${fmt}<button type="button" class="btn sm" data-a="stoin">Registrar ingreso</button></div></div>`;
}
function logHTML(){

let lk={val:'',busy:false,msg:'',forgot:false,bio:false,rec:false,recv:'',fmsg:'',gbusy:false};
function lockHTML(){
  const n=C.pin.len();
  if(lk.forgot){
    const K=C.cloud.info(),gOk=K.connected&&K.email,rOk=C.pin.hasRec();
    const sin=!gOk&&!rOk;
    return `<div class="lock" role="dialog" aria-modal="true" aria-label="Olvidé mi clave"><div class="lkt">${C.brandHTML({size:34})}</div>

function overlaysHTML(){

let resetSk=null;
function snapshot(){
  const pos={};$$('[data-sk]',mainEl).forEach(el=>{pos[el.dataset.sk]=[el.scrollTop,el.scrollLeft]});
  const a=document.activeElement;let f=null;
  if(a&&a!==document.body&&mainEl.contains(a)&&a.dataset&&a.dataset.f)f={k:a.dataset.f+'|'+(a.dataset.i||''),s:a.selectionStart,e:a.selectionEnd};
  return {pos,f};
}
function restore(k){
  $$('[data-sk]',mainEl).forEach(el=>{const v=k.pos[el.dataset.sk];if(v&&el.dataset.sk!==resetSk){el.scrollTop=v[0];el.scrollLeft=v[1]}});
  resetSk=null;
  if(k.f){const el=$$('[data-f]',mainEl).find(e=>e.dataset.f+'|'+(e.dataset.i||'')===k.f.k);if(el&&!el.disabled){el.focus({preventScroll:true});try{if(k.f.s!=null)el.setSelectionRange(k.f.s,k.f.e)}catch(e){}}}
}
function countUp(){
  if(RM)return;
  const els=$$('[data-cu]',mainEl);if(!els.length)return;
  const vals=els.map(e=>+e.dataset.cu),t0=performance.now(),DUR=520;
  cancelAnimationFrame(raf);els.forEach(el=>{el.innerHTML=moneyBig(0)});
  const step=now=>{const k=Math.min(1,(now-t0)/DUR),e=1-Math.pow(1-k,3);els.forEach((el,i)=>{if(el.isConnected)el.innerHTML=moneyBig(vals[i]*e)});if(k<1)raf=requestAnimationFrame(step)};
  raf=requestAnimationFrame(step);
}
function render(){
  const st=C.state;
  if(pd&&!sheets.some(x=>x.k==='prod'&&x.id===pd.id))pd=null;
  if(C.booting){mainEl.innerHTML='<div class="boot" role="status" aria-label="Abriendo Cuadre"><span class="mark mi"></span><span class="bdots"><i></i><i></i><i></i></span></div>';return}
  if(st.step!==lastStep)onStep(st.step);
  syncLock();
  if(C.locked&&okEl.firstChild)okEl.innerHTML='';
  if(C.locked&&st.step==='app'){mainEl.innerHTML='';root.style.setProperty('--toast-bottom','88px');return}
  const k=snapshot();
  const rub=st.rubro?C.rubro(st.rubro):null;
  setAccent(st.step==='app'&&rub?rub.color:(st.step==='setup'&&su&&su.rubro?C.rubro(su.rubro).color:DEF_AC));
  root.classList.toggle('hs',!!sheets.length||!!sc);root.classList.toggle('rd',curRd);
  root.style.setProperty('--toast-bottom',page&&page.k==='qed'?'96px':'88px');
  if(pendImp&&st.step==='app'&&C.ready()&&!sheets.length){pendImp=false;im={ph:'elegir'};sheets.push({k:'impo',fresh:true})}
  let html;
  if(pcGate())html=pcGateHTML();                                    // computadora sin la versión para PC (o sin verificar): solo se ve este aviso
  else if(st.step==='welcome')html=welcomeHTML();
  else if(st.step==='setup')html=su&&su.busy?prepHTML():setupHTML();
  else html=C.ready()?appHTML():'';
  const doCount=anim&&st.step==='app'&&tab==='inicio'&&!page&&!sheets.length;
  mainEl.innerHTML=html+overlaysHTML();
  restore(k);
  if(scrollTo){const t=$(scrollTo,mainEl);scrollTo=null;if(t)t.scrollIntoView({block:'start'})}
  if(focusQ){focusQ=false;const i=$('[data-f="q"]',mainEl);if(i)i.focus()}
  if(doCount)countUp();
  afterMods();
  anim=false;
}

function patchProd(p){
  if(!pd||pd.id!==p.id)return;
  const costo=pnum(pd.costo),pv=pnum(pd.pv);
  const b=$('[data-r="pbadge"]',mainEl);if(b)b.innerHTML=statusBadge(p);
  const g=$('[data-r="gan"]',mainEl);if(g)g.innerHTML=ganTxt(p,costo,pv);
  const m=$('[data-r="minn"]',mainEl);if(m)m.textContent=minTxt(p,pnum(pd.min));
  const w=$('[data-r="pwarn"]',mainEl);if(w)w.innerHTML=pwarnHTML(costo,pv,'pfix');
  const d=pdDirty(p),sv=$('[data-r="psave"]',mainEl);if(sv){sv.disabled=!d;sv.textContent=d?'Guardar cambios':'Sin cambios por guardar'}
  const n=$('[data-r="pdn"]',mainEl);if(n)n.textContent=d?'Tienes cambios sin guardar. Toca «Guardar cambios» para aplicarlos.':'Cambia el costo, la ganancia o el precio y toca «Guardar cambios».';
}
function pcalc(which){
  const p=curProd();if(!p||!pd)return;
  const g=k=>$('[data-f="'+k+'"]',mainEl);
  const gc=g('pcosto'),gp=g('ppct');                                  // con «Proteger ganancias y costos» esos dos campos no se muestran
  const costo=pnum(gc?gc.value:pd.costo),pct=pnum(gp?gp.value:pd.pct);let pv=pnum(g('ppv').value);
  if(which==='ppv'){if(gp)gp.value=inp(C.margen(costo,pv))}
  else if(costo>0){pv=C.precioDe(costo,pct);g('ppv').value=inpm(pv)}
  if(gc)pd.costo=gc.value;if(gp)pd.pct=gp.value;pd.pv=g('ppv').value;patchProd(p);      // solo el borrador: se aplica al tocar «Guardar cambios»
}
function patchAW(){const e=$('[data-r="apwarn"]',mainEl);if(e&&ap)e.innerHTML=pwarnHTML(pnum(ap.costo),pnum(ap.pv),'afix')}
function acalc(which){
  const costo=pnum(ap.costo),pct=pnum(ap.pct);
  if(which==='appv'){const np=costo>0?C.margen(costo,pnum(ap.pv)):pct;ap.pct=inp(np);const e=$('[data-f="appct"]',mainEl);if(e&&costo>0)e.value=ap.pct}
  else if(costo>0){ap.pv=inpm(C.precioDe(costo,pct));const e=$('[data-f="appv"]',mainEl);if(e)e.value=ap.pv}
  patchAW();
}

/* Las ventanas (sheets) y lo que se ve en pantalla nunca deben quedar desincronizadas:
   después de cada acción se compara, y si una ventana se quitó de la lista sin redibujar, se redibuja. */
function settle(){
  if(closing||C.locked)return;
  const dom=$$('.ov',mainEl).filter(o=>!o.classList.contains('out')).length;
  if(dom!==sheets.length)render();
}
/* Primero se ejecuta la acción y después se avisa a la nube del toque: si revisar Drive dibuja la pantalla de nuevo,
   el botón que se tocó ya no estaría en pantalla y ese primer toque se perdía. */
function onClick(e){const b=e.target.closest('[data-a]');const f=b&&!b.disabled&&root.contains(b)?A[b.dataset.a]:null;
  if(!f){try{C.cloud.tap()}catch(x){}return}
  let r;try{r=f(b,e)}finally{try{C.cloud.tap()}catch(x){}Promise.resolve(r).then(settle,err=>{settle();throw err})}}
function onInput(e){const el=e.target,f=el.dataset&&el.dataset.f;if(f&&IN[f])IN[f](el)}
function onChange(e){const el=e.target,f=el.dataset&&el.dataset.f;if(!f)return;
  if(CH[f])CH[f](el);
  if(el.dataset.n==='1'&&el.value.trim()!==''&&!(f==='qval'))el.value=(el.dataset.m?inpm:inp)(pnum(el.value))}
function gvFail(m){const e=$('[data-r="gverr"]',mainEl);if(e){e.textContent=m;e.hidden=false}}
function gvDone(){const s=sheets[sheets.length-1];if(!s||s.k!=='gv')return;const then=s.then,off=s.off;sheets.pop();
  if(off){C.gvSet(false);render();toast('Protección quitada: ganancias y costos a la vista');return}
  C.gvOpen();render();toast('Ganancias y costos a la vista por '+C.GV_MIN+' minutos');if(then)setTimeout(then,60)}
function onKey(e){
  if(e.target!==document.body&&e.target!==document.documentElement&&!root.contains(e.target))return;
  if(e.key==='Escape'){if(sc){closeScan();return}if(sheets.length)A.close();return}
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.f){
    const f=e.target.dataset.f;
    if(f==='scode')A.typeread();else if(f==='snombre')A.snext();else if(f==='gvpin')A['gv-pin']();else if(f==='q'||f==='regq'||f==='qpq'||f==='hq')e.target.blur();
  }
}
root.addEventListener('click',onClick);
root.addEventListener('input',onInput);
root.addEventListener('change',onChange);
addEventListener('keydown',onKey);

  else toast(r&&r.fusion?'Se juntaron los cambios de tus dos dispositivos':'Se actualizó con los cambios de tu otro dispositivo')};

/* =====================================================================
   Computadora: teclas rápidas y lector de códigos USB
   (un lector USB funciona como un teclado muy rápido que termina con Enter)
   ===================================================================== */
{
  let buf='',t0=0,tLast=0,pend=0;
  const typing=el=>!!el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT'||el.isContentEditable);
  const free=()=>!sc&&!sheets.length&&!page&&!C.locked&&C.state.step==='app'&&C.ready()&&!pcGate();      // con la pantalla «hace falta la versión para PC» no abren nada
  function wedge(code){
    if(sc){if(sc.busy||sc.locked)return;onScanCode(code,null);return}
    const s=sheets[sheets.length-1];
    if(s&&s.k==='reg'&&reg){const p=C.byCode(code);
      if(p){addRegLine(p);render();toast('Leído: '+code)}
      else if(reg.tipo==='ingreso')openAdd('',{barras:code,ctx:'reg-ingreso'});
      else toast('Este código no está en tu bodega. Regístralo primero con un ingreso.',false,true);return}
    if(s&&s.k==='qpick'){const p=C.byCode(code);if(p){addQLine(p);refreshPick()}else toast('Ese código no está en tu bodega',false,true);return}
    if(!free())return;
    const p=C.byCode(code);
    if(p)pushSheet({k:'prod',id:p.id});else openAdd(code);
  }
  function shortcut(k){
    if(!free())return;
    if(k==='/'||k==='b'){A.gosearch();return}
    if(k==='n'){openAdd('');return}
    if(k==='v'){openReg('venta');return}
    if(k==='i'){openReg('ingreso');return}
    if(k==='e'){openScan('salida');return}
    const t={1:'inicio',2:'productos',3:'cotizar',4:'mas'}[k];if(t){tab=t;anim=true;barSel=-1;render()}
  }
  addEventListener('keydown',e=>{
    if(e.ctrlKey||e.metaKey||e.altKey||e.isComposing)return;
    if(C.locked||C.state.step!=='app')return;
    const now=performance.now();
    if(e.key==='Enter'){
      const n=buf.length,fast=n>=4&&(now-t0)/Math.max(1,n)<45;
      if(fast&&!typing(e.target)){e.preventDefault();clearTimeout(pend);pend=0;const code=buf;buf='';wedge(code);return}
      buf='';return;
    }
    if(e.key.length!==1){return}
    if(now-tLast>120){buf='';t0=now}
    buf+=e.key;tLast=now;
    if(typing(e.target)||e.shiftKey&&!/[a-z]/i.test(e.key))return;
    /* tecla rápida: se espera un instante por si es un lector USB que sigue escribiendo */
    const k=e.key.toLowerCase();
    if(!/^[\/bnvie1-4]$/.test(k))return;
    if(buf.length>1){clearTimeout(pend);pend=0;return}
    if(e.key==='/')e.preventDefault();
    clearTimeout(pend);pend=setTimeout(()=>{pend=0;if(buf.length===1){shortcut(k)}},110);
  },true);
}


/* ---------- teclado del teléfono: nunca tapa el campo que estás escribiendo ----------
   Chrome (Android) ya achica la pantalla con el teclado (interactive-widget=resizes-content en la cabecera). Donde no lo hace (iPhone,
   Chrome viejo) se mide el teclado con visualViewport y se sube la hoja (--kb). En los dos casos el campo con el cursor se acomoda a la vista. */
(function(){
  const vv=window.visualViewport;let last=-1;
  const kb=()=>vv?Math.max(0,Math.round(innerHeight-vv.height-vv.offsetTop)):0;
  const apply=()=>{const k=kb(),v=k>80?k:0;if(v===last)return;last=v;root.style.setProperty('--kb',v+'px')};
  const isField=t=>!!(t&&t.tagName&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)&&!/^(checkbox|radio|file|button|range|submit)$/.test(t.type||''));
  const show=t=>{try{const r=t.getBoundingClientRect(),bottom=innerHeight-Math.max(0,last)-14;if(r.bottom>bottom||r.top<64)t.scrollIntoView({block:'center',inline:'nearest'})}catch(e){}};
  if(vv){vv.addEventListener('resize',apply);vv.addEventListener('scroll',apply)}
  addEventListener('focusin',e=>{const t=e.target;if(!isField(t))return;[80,380,760].forEach(ms=>setTimeout(()=>{apply();if(document.activeElement===t)show(t)},ms))});
  addEventListener('resize',()=>{apply();const a=document.activeElement;if(isField(a))setTimeout(()=>show(a),120)});
})();

/* ---------- sin internet: service worker (guarda toda la app en el teléfono) ---------- */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;
        w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)toast('Hay una versión nueva: se activa la próxima vez que abras la app.')})});
      setTimeout(()=>{try{reg.update()}catch(e){}},4000);
    }).catch(()=>{});
  });
}
