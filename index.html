    <div class="qlist">${rows||`<div class="empty">${ic('doc',30)}<h3>Aún no tienes cotizaciones</h3><p>Crea la primera: eliges productos o escribes ítems libres, ajustas precios y la compartes en PDF o por texto.</p></div>`}</div>

/* ---- registrar venta / ingreso / salida ---- */
const TIPOS={venta:['Venta','Registrar venta','Descuenta del stock y suma a tus ventas.'],ingreso:['Ingreso','Registrar ingreso','Suma unidades al stock: compra, producción o devolución.'],salida:['Salida sin cobrar','Registrar salida','Descuenta del stock sin cobrar: consumo, merma, regalo o uso interno.']};
function regLineRes(l){
  const p=C.prod(l.pid);if(!p)return '';
  const ing=reg.tipo==='ingreso',after=Math.round((ing?p.stock+l.q:p.stock-l.q)*1000)/1000,u=UL(p.u);
  if(!ing&&l.q>p.stock)return `<span class="red">${ic('alert',14,'',2.3)}Solo hay ${num(p.stock)} ${u}</span>`;
  if(!ing&&p.min>0&&after<=p.min)return `<span class="amb">${ic('alert',14,'',2.3)}Quedarían ${num(after)}: bajo el mínimo (${num(p.min)})</span>`;
  return `<span>Hay ${num(p.stock)} ${u}. Quedarían ${num(after)}.</span>`;
}
function regCan(){
  if(!reg.lines.length)return false;
  return reg.lines.every(l=>{const p=C.prod(l.pid);return l.q>0&&p&&(reg.tipo==='ingreso'||l.q<=p.stock)});
}
const regBtnTxt=()=>reg.tipo==='salida'&&C.modOn('entregas')&&(reg.quien||'').trim()?'Registrar y pedir la firma':TIPOS[reg.tipo][1];
function regTotal(){return reg.lines.reduce((a,l)=>a+l.q*l.pv,0)}
function regFootInfo(){
  if(reg.tipo==='venta')return `<span>Total</span><b data-r="rtot">${C.money(regTotal())}</b>`;
  const n=reg.lines.length;return `<span>${TIPOS[reg.tipo][0]}</span><b data-r="rtot" class="sm">${n} ${n===1?'producto':'productos'}</b>`;
}
function pickItems(q,exclude){
  const base=q.trim()?C.search(q):(C.top('mes','mas',8).map(x=>x.p).concat(C.prods().slice().sort((a,b)=>a.nom.localeCompare(b.nom,'es'))));
  const seen=new Set();return base.filter(p=>{if(seen.has(p.id))return false;seen.add(p.id);return !exclude||!exclude.includes(p.id)}).slice(0,q.trim()?30:8);
}
function pickListHTML(q,exclude,act,counts,newAct){
  const it=pickItems(q,exclude),qq=q.trim();

  return frame(s,i,'Registrar','',body,foot,'tall regs');

    <div class="pkl" data-r="pkl">${pickListHTML(s.q,null,'qpickp',counts)}</div></div>`;

function sheetOf(s,i){
  switch(s.k){
    case 'signin':return frame(s,i,'Iniciar sesión','',signinBody(),`<button type="button" class="btn big" data-a="guest2">Entendido, empezar sin cuenta</button>`,'pros');

    case 'ajuste':return ajusteSheet(s,i);

    case 'qprev':return frame(s,i,'Vista previa','',paperHTML(qd),`<button type="button" class="btn big" data-a="qshare">${ic('share',19)}Compartir</button><button type="button" class="btn big ghost" data-a="qpdf">${ic('doc',19)}Abrir PDF</button>`,'tall');

function pushSheet(s){if(closing)return;s.fresh=true;sheets.push(s);render()}

/* =====================================================================
   Módulos Pro: entregas con firma · préstamos y alquileres · firma del negocio
   ===================================================================== */
let pn=null;                      // formulario «nuevo préstamo»
const pre={tab:'afuera'};         // pestaña de la lista de préstamos
const sig={pts:[],cur:null,draw:null};   // trazos de la firma (coordenadas 0..1 dentro del cuadro)
const dayStr=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const parseDay=v=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||'');return m?new Date(+m[1],+m[2]-1,+m[3]).getTime():0};
const SIGR=2.4;                   // proporción ancho/alto del cuadro de firma

/* ---------- firma en pantalla ---------- */
function sigReset(){sig.pts=[];sig.cur=null;sig.draw=null}
function sigInit(){
  const c=$('[data-r="sigc"]',mainEl);if(!c)return;
  const dpr=Math.min(2,window.devicePixelRatio||1),r=c.getBoundingClientRect();
  c.width=Math.max(10,Math.round(r.width*dpr));c.height=Math.max(10,Math.round(r.height*dpr));
  const g=c.getContext('2d');g.lineCap='round';g.lineJoin='round';g.strokeStyle='#0f172a';g.lineWidth=2.6*dpr;
  const draw=()=>{
    g.clearRect(0,0,c.width,c.height);
    sig.pts.forEach(st=>{g.beginPath();st.forEach((p,k)=>{const x=p[0]*c.width,y=p[1]*c.height;if(k)g.lineTo(x,y);else g.moveTo(x,y)});if(st.length===1)g.lineTo(st[0][0]*c.width+.1,st[0][1]*c.height);g.stroke()});
    const h=$('[data-r="sigh"]',mainEl);if(h)h.hidden=sig.pts.length>0;
  };
  sig.draw=draw;draw();
  const pos=e=>{const b=c.getBoundingClientRect();return [Math.min(1,Math.max(0,(e.clientX-b.left)/b.width)),Math.min(1,Math.max(0,(e.clientY-b.top)/b.height))]};
  c.onpointerdown=e=>{e.preventDefault();try{c.setPointerCapture(e.pointerId)}catch(x){}sig.cur=[pos(e)];sig.pts.push(sig.cur);draw();const er=$('[data-r="sigerr"]',mainEl);if(er)er.hidden=true};
  c.onpointermove=e=>{if(!sig.cur)return;e.preventDefault();sig.cur.push(pos(e));draw()};
  const end=()=>{sig.cur=null};c.onpointerup=end;c.onpointercancel=end;c.onpointerleave=end;
}
/* devuelve {src,w,h} (PNG con fondo transparente, recortado a la firma) o null si no hay una firma real */
function sigExport(){
  if(!sig.pts.length)return null;
  let len=0,x0=1,y0=1,x1=0,y1=0;
  sig.pts.forEach(st=>st.forEach((p,i)=>{if(i)len+=Math.hypot((p[0]-st[i-1][0])*SIGR,p[1]-st[i-1][1]);x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])}));
  if(len<.35)return null;
  const W=720,H=Math.round(W/SIGR),cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const g=cv.getContext('2d');g.lineCap='round';g.lineJoin='round';g.strokeStyle='#0f172a';g.lineWidth=5;
  sig.pts.forEach(st=>{g.beginPath();st.forEach((p,k)=>{if(k)g.lineTo(p[0]*W,p[1]*H);else g.moveTo(p[0]*W,p[1]*H)});if(st.length===1)g.lineTo(st[0][0]*W+.1,st[0][1]*H);g.stroke()});
  const pad=12,sx=Math.max(0,Math.floor(x0*W-pad)),sy=Math.max(0,Math.floor(y0*H-pad)),sw=Math.min(W-sx,Math.ceil((x1-x0)*W+pad*2)),sh=Math.min(H-sy,Math.ceil((y1-y0)*H+pad*2));
  const o=document.createElement('canvas');o.width=Math.max(8,sw);o.height=Math.max(8,sh);o.getContext('2d').drawImage(cv,sx,sy,sw,sh,0,0,o.width,o.height);
  return {src:o.toDataURL('image/png'),w:o.width,h:o.height};
}
function afterMods(){
  const s=sheets[sheets.length-1];
  if(s&&s.k==='firma')sigInit();
}

/* foto de una firma o sello → PNG transparente y recortado (quita el papel y deja solo la tinta). null si no se ve nada */
function firmaLimpia(file){return new Promise(res=>{
  if(!file||!/^image\//.test(file.type))return res(null);
  const url=URL.createObjectURL(file),im=new Image();im.onerror=()=>{URL.revokeObjectURL(url);res(null)};
  im.onload=()=>{try{
    URL.revokeObjectURL(url);const m=Math.min(1,1400/Math.max(im.width,im.height)),w=Math.max(8,Math.round(im.width*m)),h=Math.max(8,Math.round(im.height*m));
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;const g=cv.getContext('2d',{willReadFrequently:true});g.drawImage(im,0,0,w,h);
    const d=g.getImageData(0,0,w,h),a=d.data,n=w*h,lum=new Uint8Array(n),hist=new Uint32Array(256);
    for(let i=0;i<n;i++){const k=i*4,l=a[k+3]<128?255:Math.round((a[k]*299+a[k+1]*587+a[k+2]*114)/1000);lum[i]=l;hist[l]++}
    let acc=0,bg=255;for(let v=0;v<256;v++){acc+=hist[v];if(acc>=n*.85){bg=v;break}}   /* el papel = lo más claro que ocupa la mayor parte de la foto */
    bg=Math.max(bg,110);
    let x0=w,y0=h,x1=-1,y1=-1,cnt=0;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      const i=y*w+x,k=i*4,rel=lum[i]/bg,al=rel>=.86?0:rel<=.55?255:Math.round((.86-rel)/.31*255);
      if(al>0){a[k]=a[k]*.7;a[k+1]=a[k+1]*.7;a[k+2]=a[k+2]*.7}
      a[k+3]=al;if(al>90){cnt++;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
    }
    if(cnt<Math.max(60,n*.0006)){res(null);return}
    g.putImageData(d,0,0);
    const pad=Math.round(Math.max(w,h)*.012)+4,sx=Math.max(0,x0-pad),sy=Math.max(0,y0-pad),sw=Math.min(w-sx,x1-x0+1+pad*2),sh=Math.min(h-sy,y1-y0+1+pad*2);
    const k2=Math.min(1,800/Math.max(sw,sh)),ow=Math.max(8,Math.round(sw*k2)),oh=Math.max(8,Math.round(sh*k2)),o=document.createElement('canvas');o.width=ow;o.height=oh;
    o.getContext('2d').drawImage(cv,sx,sy,sw,sh,0,0,ow,oh);
    res({src:o.toDataURL('image/png'),w:ow,h:oh});
  }catch(e){res(null)}};
  im.src=url})}

  }

function prenewSheet(s,i){
  const P=pn.pid?C.prod(pn.pid):null;
  const pick=P?`<section class="pst"><div><span class="lbl">Se presta o se alquila</span><b class="stn sm2">${esc(P.nom)}</b><span class="fine">Hay ${num(P.stock)} ${UL(P.u)} en bodega</span></div><button type="button" class="btn ghost sm" data-a="pnchg">Cambiar</button></section>`
    :`<div class="pk"><div class="sfd ${pn.s?'has':''}">${ic('search',19)}<input type="text" inputmode="search" autocomplete="off" placeholder="Busca lo que vas a prestar" aria-label="Buscar producto" data-f="pnq" value="${esc(pn.s)}"></div>
      <div class="pkl" data-r="pkl">${pickListHTML(pn.s,null,'pnpick',null,'')}</div></div>`;
  const form=P?`<label class="fl"><span>A quién se lo prestas</span><input class="fld" type="text" maxlength="60" autocomplete="off" placeholder="Nombre de la persona o la empresa" data-f="pnquien" value="${esc(pn.quien)}"></label>
    <div class="row2"><label class="fl"><span>Teléfono (opcional)</span><input class="fld" type="tel" inputmode="tel" maxlength="30" data-f="pntel" value="${esc(pn.tel)}"></label>

    <div class="row2"><label class="fl"><span>Debe devolverlo el</span><input class="fld" type="date" data-f="pnvence" value="${esc(pn.vence)}"></label>

    <label class="fl"><span>Nota (opcional)</span><input class="fld" type="text" maxlength="80" placeholder="Ej. Con su cargador" data-f="pnnota" value="${esc(pn.nota)}"></label>

    <p class="fine l">Al guardar, lo que sale se descuenta del stock. Cuando lo devuelvan, vuelve a sumarse.</p>`:'';
  return frame(s,i,'Nuevo préstamo o alquiler','',pick+form,P?`<button type="button" class="btn big" data-a="pnsave" data-r="pnbtn"${pnCan()?'':' disabled'}>Registrar préstamo</button>`:'','tall');
}
const estPre=x=>({afuera:['env','Afuera'],atrasado:['rec','Atrasado'],devuelto:['ace','Devuelto']})[C.prestEstado(x)];
function predetSheet(s,i){
  const x=C.prestamo(s.id);if(!x)return '';
  const es=C.prestEstado(x),pend=C.prestPend(x),dias=C.prestDias(x),cobro=C.prestCobro(x);
  const atr=es==='atrasado'?Math.max(1,Math.round((d0(Date.now())-x.vence)/864e5)):0;
  const bd=es==='atrasado'?`<span class="badge red">${ic('alert',14,'',2.3)}Atrasado ${atr} ${atr===1?'día':'días'}</span>`:es==='devuelto'?`<span class="badge ok">${ic('check',14,'',2.5)}Devuelto</span>`:'<span class="badge">Afuera</span>';
  const body=`<section class="pst"><div><span class="lbl">${es==='devuelto'?'Lo tuvo':'Lo tiene'}</span><b class="stn sm2">${esc(x.quien)}</b></div><div>${bd}</div></section>
    <dl class="dtl" style="margin-top:10px"><div><dt>Producto</dt><dd>${esc(x.nom)}</dd></div><div><dt>Cantidad</dt><dd>${num(x.q)} ${UL(x.u)}${x.qdev&&es!=='devuelto'?' (devolvió '+num(x.qdev)+')':''}</dd></div>
      <div><dt>Salió</dt><dd>${esc(C.fechaDoc(x.t))}</dd></div>${x.vence?`<div><dt>Debe volver</dt><dd>${esc(C.fechaDoc(x.vence))}</dd></div>`:''}${x.tel?`<div><dt>Teléfono</dt><dd>${esc(x.tel)}</dd></div>`:''}${x.nota?`<div><dt>Nota</dt><dd>${esc(x.nota)}</dd></div>`:''}
      ${x.precioDia>0?`<div><dt>Precio por día</dt><dd>${C.money(x.precioDia)}</dd></div>${es!=='devuelto'?`<div><dt>A cobrar hasta hoy (${dias} ${dias===1?'día':'días'})</dt><dd>${C.money(cobro)}</dd></div>`:`<div><dt>Cobrado</dt><dd>${C.money(x.cobrado||0)}</dd></div>`}`:''}</dl>`;
  const foot=(pend>0?`<button type="button" class="btn big" data-a="predev" data-id="${x.id}">${ic('entrada',19)}Registrar devolución</button>`:'')
    +`<div class="two"><button type="button" class="btn ghost sm" data-a="prepdf" data-id="${x.id}">${ic('doc',17)}Comprobante</button>${pend>0?`<button type="button" class="btn ghost sm" data-a="prewa" data-id="${x.id}">${ic('share',17)}Recordar</button>`:'<span></span>'}</div>`;
  return frame(s,i,'Préstamo '+x.num,'',body,foot,'tall');
}
function predevSheet(s,i){
  const x=C.prestamo(s.id);if(!x)return '';
  const pend=C.prestPend(x),q=Math.min(pend,Math.max(0,pnum(s.q)||0)),cobro=C.prestCobro(x,q);
  const body=`<p class="fine">Lo que vuelve se suma otra vez a tu bodega.</p>
    <div class="pst" style="margin-top:10px"><div><span class="lbl">Falta que devuelva</span><b class="stn">${num(pend)} <small>${UL(x.u)}</small></b></div></div>
    <label class="fl" style="margin-top:12px"><span>Cantidad que devuelve (${UL(x.u)})</span>${inw('','pdq',s.q)}</label>
    ${x.precioDia>0?`<div class="pst" style="margin-top:12px"><div><span class="lbl">A cobrar por el alquiler (${C.prestDias(x)} ${C.prestDias(x)===1?'día':'días'})</span><b class="stn sm2" data-r="pdcobro">${C.money(cobro)}</b></div></div>`:''}`;
  return frame(s,i,'Registrar devolución',esc(x.nom)+' · '+esc(x.quien),body,`<button type="button" class="btn big" data-a="predevok" data-id="${x.id}">Confirmar devolución</button>`,'pros');
}

  return `<div class="pov hist ${fresh?'in':''}" role="dialog" aria-modal="true" aria-label="Entregas con firma" style="z-index:40">

function patchScan(){

async function startCamera(){
  const S=sc;if(!S)return;const gen=S.gen;
  if(!SCAN_OK()){S.st='error';S.msg='El lector de códigos no se cargó. Cierra y abre la app de nuevo.';patchScan();return}
  const video=$('video',scanEl);
  try{
    const h=await CuadreScan.start(video,{onCode:(code,info)=>onScanCode(code,info),onState:st=>{}});
    if(!sc||sc.gen!==gen){h.stop();return}
    S.handle=h;S.st='activo';S.canTorch=!!h.canTorch;patchScan();
  }catch(e){
    if(!sc||sc.gen!==gen)return;
    S.st='error';S.msg=(e&&e.message)||'No se pudo abrir la cámara.';patchScan();
  }
}
function onScanCode(code,info){
  if(!sc||sc.busy||sc.locked)return;
  const fmt=info&&info.label?info.label:C.codeFmt(code);
  if(sc.purpose==='pick'){const cb=sc.cb;closeScan(true);render();toast('Leído: '+fmt+' · '+code);try{cb&&cb(code,info)}catch(e){console.error(e)}return}
  doRead(code,fmt);
}
function doRead(code,fmt){
  if(!sc)return;const S=sc;
  const r=C.scanApply(code,S.mode,1);r.fmt=fmt||C.codeFmt(code);
  S.res=r;S.err='';
  if(r.status==='ok')S.log.unshift({pid:r.p.id,nom:r.p.nom,u:r.p.u,mode:r.mode,q:r.q,antes:r.antes,despues:r.despues,low:r.low,cero:r.cero});
  if(r.status==='ok'&&(r.low||r.cero))C.notif&&C.notif.low([{p:r.p,despues:r.despues}]);
  /* continuo (Pro): sigue leyendo; si no, se detiene para mostrar el resultado */
  if(!S.cont||r.status!=='ok'){S.locked=true;try{S.handle&&S.handle.pause()}catch(e){}}
  patchScan();
}
function scanAgain(){
  if(!sc)return;sc.res=null;sc.locked=false;sc.err='';try{sc.handle&&sc.handle.resume()}catch(e){}patchScan();
}

function patchLock(){
  const d=$('[data-r="pdots"]',lockEl);if(d)d.innerHTML=Array.from({length:C.pin.len()},(_,i)=>`<i class="${i<lk.val.length?'on':''}"></i>`).join('');

async function lockKey(k){
  if(lk.busy||lk.forgot)return;
  if(k==='x')lk.val=lk.val.slice(0,-1);else if(lk.val.length<C.pin.len())lk.val+=k;
  lk.msg='';patchLock();
  if(lk.val.length===C.pin.len()){
    lk.busy=true;const v=lk.val,r=await C.unlock(v);lk.busy=false;
    if(!r.ok){lk.val='';
      lk.msg=r.wait?'Demasiados intentos. Espera '+r.wait+' s.':r.error?'No se pudo verificar la clave.':'Clave incorrecta'+(r.left!=null&&r.left<=3?'. Te quedan '+r.left+' intentos.':'.');
      const d=$('[data-r="pdots"]',lockEl);if(d&&!RM){d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake')}
      try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}
      patchLock()}
  }
}
addEventListener('keydown',e=>{if(!lockEl.firstChild||lk.forgot)return;if(/^\d$/.test(e.key))lockKey(e.key);else if(e.key==='Backspace')lockKey('x')});

function overlaysHTML(){

let resetSk=null;
function snapshot(){
  const pos={};$$('[data-sk]',mainEl).forEach(el=>{pos[el.dataset.sk]=[el.scrollTop,el.scrollLeft]});
  const a=document.activeElement;let f=null;
  if(a&&a!==document.body&&mainEl.contains(a)&&a.dataset&&a.dataset.f)f={k:a.dataset.f+'|'+(a.dataset.i||''),s:a.selectionStart,e:a.selectionEnd};
  return {pos,f};
}
function restore(k){
  $$('[data-sk]',mainEl).forEach(el=>{const v=k.pos[el.dataset.sk];if(v&&el.dataset.sk!==resetSk){el.scrollTop=v[0];el.scrollLeft=v[1]}});
  resetSk=null;
  if(k.f){const el=$$('[data-f]',mainEl).find(e=>e.dataset.f+'|'+(e.dataset.i||'')===k.f.k);if(el&&!el.disabled){el.focus({preventScroll:true});try{if(k.f.s!=null)el.setSelectionRange(k.f.s,k.f.e)}catch(e){}}}
}
function countUp(){
  if(RM)return;
  const els=$$('[data-cu]',mainEl);if(!els.length)return;
  const vals=els.map(e=>+e.dataset.cu),t0=performance.now(),DUR=520;
  cancelAnimationFrame(raf);els.forEach(el=>{el.innerHTML=moneyBig(0)});
  const step=now=>{const k=Math.min(1,(now-t0)/DUR),e=1-Math.pow(1-k,3);els.forEach((el,i)=>{if(el.isConnected)el.innerHTML=moneyBig(vals[i]*e)});if(k<1)raf=requestAnimationFrame(step)};
  raf=requestAnimationFrame(step);
}
function render(){
  const st=C.state;
  if(st.step!==lastStep)onStep(st.step);
  syncLock();
  if(C.locked&&st.step==='app'){mainEl.innerHTML='';root.style.setProperty('--toast-bottom','88px');return}
  const k=snapshot();
  const rub=st.rubro?C.rubro(st.rubro):null;
  setAccent(st.step==='app'&&rub?rub.color:(st.step==='setup'&&su&&su.rubro?C.rubro(su.rubro).color:DEF_AC));
  root.classList.toggle('hs',!!sheets.length||!!sc);root.classList.toggle('rd',curRd);
  root.style.setProperty('--toast-bottom',page&&page.k==='qed'?'96px':'88px');
  let html;
  if(st.step==='welcome')html=welcomeHTML();
  else if(st.step==='setup')html=su&&su.busy?prepHTML():setupHTML();
  else html=C.ready()?appHTML():'';
  const doCount=anim&&st.step==='app'&&tab==='inicio'&&!page&&!sheets.length;
  mainEl.innerHTML=html+overlaysHTML();
  restore(k);
  if(scrollTo){const t=$(scrollTo,mainEl);scrollTo=null;if(t)t.scrollIntoView({block:'start'})}
  if(focusQ){focusQ=false;const i=$('[data-f="q"]',mainEl);if(i)i.focus()}
  if(doCount)countUp();
  afterMods();
  anim=false;
}

/* entrega de documentos reales */
async function docFlow(label,make,how){
  toast('Preparando '+label+'…');
  let r;try{r=await make()}catch(e){r={ok:false,reason:'error',msg:String(e&&e.message||e)}}
  if(!r.ok){
    if(r.reason==='limite'){proSheetFor('docs');return r}
    toast(r.reason==='nomod'?'El generador de documentos no se cargó. Cierra y abre la app.':r.reason==='pro'?'Esto es de Pro.':'No pude crear el archivo. '+(r.msg||''),false,true);return r}
  const res=await C.deliver(r.blob,r.name,how||'open');
  const m={shared:'Listo',opened:'Abierto',downloaded:'Descargado: '+r.name+'. Búscalo en tus descargas.',cancel:'',error:'No se pudo entregar el archivo'}[res];if(m)toast(m,false,res==='error');
  return r;
}
async function doBackup(how){
  toast('Preparando tu copia…');
  const r=await C.backupFile();
  if(!r.ok){toast('No pude crear la copia. '+(r.msg||''),false,true);return}
  const res=await C.deliver(r.blob,r.name,how);
  if(res!=='cancel'&&res!=='error'){C.markBackup();toast(res==='shared'?'Copia enviada':'Copia guardada: '+r.name+'. Está en tus descargas.')}
  else if(res==='error')toast('No se pudo guardar la copia',false,true);
}
async function doRestore(file){
  const r=await C.backupRestore(file);
  if(r.ok){sheets=[];page=null;tab='inicio';anim=true;render();toast('Listo: recuperé '+r.prods+' productos y '+r.movs+' movimientos')}
  else toast(r.reason==='formato'?'Ese archivo no es una copia de Cuadre.':'No pude leer ese archivo. '+(r.msg||''),false,true);
}

function pcalc(which){
  const p=curProd();if(!p)return;

  const costo=pnum(g('pcosto').value),pct=pnum(g('ppct').value);let pv=pnum(g('ppv').value),np=pct;
  if(which==='ppv'){np=C.margen(costo,pv);g('ppct').value=inp(np)}

  p.costo=costo;p.pv=pv;C.touch();patchProd(p);
}
function acalc(which){
  const costo=pnum(ap.costo),pct=pnum(ap.pct);

}

function onInput(e){const el=e.target,f=el.dataset&&el.dataset.f;if(f&&IN[f])IN[f](el)}
function onChange(e){const el=e.target,f=el.dataset&&el.dataset.f;if(!f)return;
  if(CH[f])CH[f](el);
  if(el.dataset.n==='1'&&el.value.trim()!==''&&!(f==='qval'))el.value=(el.dataset.m?inpm:inp)(pnum(el.value))}
function onKey(e){
  if(e.target!==document.body&&e.target!==document.documentElement&&!root.contains(e.target))return;
  if(e.key==='Escape'){if(sc){closeScan();return}if(sheets.length)closeSheet();return}
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.f){
    const f=e.target.dataset.f;
    if(f==='scode')A.typeread();else if(f==='snombre')A.snext();else if(f==='q'||f==='regq'||f==='qpq'||f==='hq')e.target.blur();
  }
}

  signo(){const s=topSheet();sheets.pop();sigReset();render();toast('Entrega guardada sin firma. Puedes pedirla después en Más → Módulos → Entregas.')},
  entshare(b){const e=C.entrega(+b.dataset.id);if(!e)return;pushSheet({k:'share',titulo:'Comprobante '+e.num,texto:C.entregaText(e),pdf:()=>C.pdfEntrega(C.entrega(e.id))})},

  /* préstamos y alquileres */
  pretab(b){pre.tab=b.dataset.v;render()},
  pnnew(){pn={pid:null,s:'',quien:'',tel:'',qty:'1',vence:'',precio:'',nota:'',err:''};pushSheet({k:'prenew'})},
  pnpick(b){const p=C.prod(+b.dataset.id);if(!p||!pn)return;if(p.stock<=0){toast('De «'+p.nom+'» no queda nada en bodega',false,true);return}pn.pid=p.id;pn.qty='1';render()},
  pnchg(){if(!pn)return;pn.pid=null;pn.s='';render()},

    const fail=(m,f)=>{pn.err=m;const e=$('[data-r="pnerr"]',mainEl);if(e){e.textContent=m;e.hidden=false}const i=f&&$('[data-f="'+f+'"]',mainEl);if(i)i.focus()};
    if(!P)return fail('Elige qué vas a prestar.');

    if(!(q>0))return fail('Escribe cuántos '+C.uLabel(P.u)+' salen.','pnqty');
    if(q>P.stock)return fail('Solo hay '+num(P.stock)+' '+C.uLabel(P.u)+' en bodega.','pnqty');
    const v=pn.vence?parseDay(pn.vence):0;if(pn.vence&&(!v||v<d0(Date.now())))return fail('Esa fecha de devolución ya pasó.','pnvence');
    const r=C.prestamoNew({pid:P.id,q,quien:pn.quien,tel:pn.tel,vence:v,precioDia:pnum(pn.precio),nota:pn.nota});
    if(!r.ok)return fail(r.reason==='stock'?'No alcanza el stock.':'No se pudo registrar.');
    const lows=(r.done||[]).filter(d=>d.low);sheets.pop();const x=r.p;pn=null;
    if(lows.length)C.notif.low(lows);
    render();toast('Préstamo registrado: '+num(x.q)+' '+C.uLabel(x.u)+' de '+x.nom+' a '+x.quien+(x.vence?'. Debe volver el '+C.fechaCorta(x.vence):''))},

/* =====================================================================
   Computadora: teclas rápidas y lector de códigos USB
   (un lector USB funciona como un teclado muy rápido que termina con Enter)
   ===================================================================== */
{
  let buf='',t0=0,tLast=0,pend=0;
  const typing=el=>!!el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT'||el.isContentEditable);
  const free=()=>!sc&&!sheets.length&&!page&&!C.locked&&C.state.step==='app'&&C.ready();
  function wedge(code){
    if(sc){if(sc.busy||sc.locked)return;onScanCode(code,null);return}
    const s=sheets[sheets.length-1];
    if(s&&s.k==='reg'&&reg){const p=C.byCode(code);
      if(p){addRegLine(p);render();toast('Leído: '+code)}
      else if(reg.tipo==='ingreso')openAdd('',{barras:code,ctx:'reg-ingreso'});
      else toast('Este código no está en tu bodega. Regístralo primero con un ingreso.',false,true);return}
    if(s&&s.k==='qpick'){const p=C.byCode(code);if(p){addQLine(p);refreshPick()}else toast('Ese código no está en tu bodega',false,true);return}
    if(!free())return;
    const p=C.byCode(code);
    if(p)pushSheet({k:'prod',id:p.id});else openAdd(code);
  }
  function shortcut(k){
    if(!free())return;
    if(k==='/'||k==='b'){A.gosearch();return}
    if(k==='n'){openAdd('');return}
    if(k==='v'){openReg('venta');return}
    if(k==='i'){openReg('ingreso');return}
    if(k==='e'){openScan('salida');return}
    const t={1:'inicio',2:'productos',3:'cotizar',4:'mas'}[k];if(t){tab=t;anim=true;barSel=-1;render()}
  }
  addEventListener('keydown',e=>{
    if(e.ctrlKey||e.metaKey||e.altKey||e.isComposing)return;
    if(C.locked||C.state.step!=='app')return;
    const now=performance.now();
    if(e.key==='Enter'){
      const n=buf.length,fast=n>=4&&(now-t0)/Math.max(1,n)<45;
      if(fast&&!typing(e.target)){e.preventDefault();clearTimeout(pend);pend=0;const code=buf;buf='';wedge(code);return}
      buf='';return;
    }
    if(e.key.length!==1){return}
    if(now-tLast>120){buf='';t0=now}
    buf+=e.key;tLast=now;
    if(typing(e.target)||e.shiftKey&&!/[a-z]/i.test(e.key))return;
    /* tecla rápida: se espera un instante por si es un lector USB que sigue escribiendo */
    const k=e.key.toLowerCase();
    if(!/^[\/bnvie1-4]$/.test(k))return;
    if(buf.length>1){clearTimeout(pend);pend=0;return}
    if(e.key==='/')e.preventDefault();
    clearTimeout(pend);pend=setTimeout(()=>{pend=0;if(buf.length===1){shortcut(k)}},110);
  },true);
}


/* ---------- sin internet: service worker (guarda toda la app en el teléfono) ---------- */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){

      reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;
        w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)toast('Hay una versión nueva: se activa la próxima vez que abras la app.')})});
      setTimeout(()=>{try{reg.update()}catch(e){}},4000);
    }).catch(()=>{});
  });
}
