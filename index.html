/* ===== Cuadre · cáscara común (selector de diseño) + piezas compartidas ===== */
:root{--bg:#eef0f3;--fg:#10141b;--bar:#10141b;--bar-fg:#f4f6f8;--bar-mut:#8b95a5;--bar-on:#ffffff;--bar-on-fg:#10141b;--bar-line:#262d3a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0e13;--fg:#eef0f3;--bar:#171c25;--bar-line:#2b3342;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0e13;--fg:#eef0f3;--bar:#171c25;--bar-line:#2b3342;color-scheme:dark}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none}
.cs{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.cs-bar{flex:none;display:flex;align-items:center;gap:8px;background:var(--bar);color:var(--bar-fg);border-bottom:1px solid var(--bar-line);
  padding:calc(6px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px))}
.cs-nums{display:flex;gap:4px;flex:none}
.cs-nums button{width:34px;height:34px;border-radius:10px;border:1px solid var(--bar-line);background:transparent;color:var(--bar-fg);font:700 14px/1 system-ui,sans-serif;cursor:pointer;padding:0}
.cs-nums button[aria-pressed="true"]{background:var(--bar-on);color:var(--bar-on-fg);border-color:var(--bar-on)}
.cs-nums button:disabled{opacity:.3}
.cs-name{flex:1;min-width:0;font:600 12px/1.2 system-ui,sans-serif;color:var(--bar-mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs-plan{display:flex;flex:none;border:1px solid var(--bar-line);border-radius:10px;overflow:hidden}
.cs-plan button{height:32px;padding:0 9px;border:0;background:transparent;color:var(--bar-mut);font:700 12px/1 system-ui,sans-serif;cursor:pointer}
.cs-plan button[aria-pressed="true"]{background:#7c5cff;color:#fff}
.cs-reset{flex:none;width:34px;height:34px;border-radius:10px;border:1px solid var(--bar-line);background:transparent;color:var(--bar-fg);display:grid;place-items:center;cursor:pointer;padding:0}
.cs-stage{flex:1;min-height:0;position:relative;width:100%;max-width:440px;margin:0 auto;overflow:hidden;box-shadow:0 0 0 1px rgba(128,128,128,.18)}
.cs-d{position:absolute;inset:0;display:none;overflow:hidden;--safe-b:env(safe-area-inset-bottom,0px)}
.cs-d.on{display:block}
.cs-flash{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:200;pointer-events:none;background:rgba(16,20,27,.88);color:#fff;padding:7px 14px;border-radius:999px;font:700 12.5px/1 system-ui,sans-serif;opacity:0;transition:opacity .25s;white-space:nowrap}
.cs-flash.on{opacity:1}
[hidden]{display:none!important}

/* piezas compartidas */
.ci{flex:none;display:block}
.ri{display:block;flex:none;overflow:visible}
.ri .s{fill:none;stroke:currentColor;stroke-width:var(--ri-w,2.2);stroke-linecap:round;stroke-linejoin:round}
.ri .a{fill:var(--ri-a,currentColor);fill-opacity:var(--ri-ao,.16);stroke:none}
.ri.draw .s{stroke-dasharray:1;stroke-dashoffset:1;animation:ri-draw .9s .08s cubic-bezier(.5,0,.2,1) forwards}
.ri.draw .a{opacity:0;animation:ri-fill .5s .65s ease forwards}
.ri.pop{animation:ri-pop .55s cubic-bezier(.3,1.7,.5,1) both}
.ri.float{animation:ri-float 3.2s ease-in-out infinite}
.ri.wiggle{animation:ri-wig .9s ease-in-out}
@keyframes ri-draw{to{stroke-dashoffset:0}}
@keyframes ri-fill{to{opacity:1}}
@keyframes ri-pop{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@keyframes ri-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes ri-wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}60%{transform:rotate(7deg)}}
.c-brand{display:inline-flex;align-items:center;gap:.5em;min-width:0;max-width:100%}
.c-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-logo{display:block;height:var(--logo-h,34px);width:auto;max-width:100%;object-fit:contain}
.c-logo.c-sq{width:var(--logo-h,34px);border-radius:var(--logo-r,9px);flex:none}
.c-wide .c-logo{max-width:var(--logo-wide,200px)}
.c-toast{position:absolute;left:50%;bottom:var(--toast-bottom,92px);transform:translate(-50%,14px);opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;
  background:var(--toast-bg,#111827);color:var(--toast-fg,#fff);padding:10px 14px;border-radius:var(--toast-r,12px);font:600 13.5px/1.3 var(--toast-font,system-ui,sans-serif);
  width:max-content;max-width:calc(100% - 28px);display:flex;gap:12px;align-items:center;z-index:300;box-shadow:0 8px 24px rgba(0,0,0,.32)}
.c-toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.c-toast .c-undo{flex:none;border:0;background:none;color:inherit;font:800 13px/1 inherit;text-decoration:underline;padding:6px 4px;cursor:pointer;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.ri.draw .s{animation:none;stroke-dashoffset:0}.ri.draw .a{animation:none;opacity:1}.ri.pop,.ri.float,.ri.wiggle{animation:none}.c-toast{transition:none}}

/* ===== Cuadre · Diseño 1 «Tablero» =====
   Panel claro de control. Superficies gris frío, tarjetas blancas con filete, acento = color del rubro (calculado en JS). */
.d1{
  --bg:#eceff4;--card:#ffffff;--ink:#0f172a;--ink2:#334155;--mut:#566274;--line:#dfe5ed;--fill:#f3f5f9;--fill2:#e8ecf2;
  --red:#c8281d;--reds:#fdecea;--redl:#f4b8b3;--grn:#0b7a4b;--grns:#e2f4ea;--amb:#8a5600;--ambs:#fcf0d4;
  --ac:#3157d5;--acs:#e8edfc;--acm:#aebcf0;--act:#2543b0;--acb:#3157d5;--onb:#ffffff;--acr:rgba(49,87,213,.3);
  --toast-bg:#0f172a;--toast-fg:#ffffff;--toast-bottom:88px;--toast-r:14px;--toast-font:'Plus Jakarta Sans',system-ui,sans-serif;
  --logo-h:30px;--logo-r:8px;--logo-wide:176px;
  background:var(--bg);color:var(--ink);
  font:500 14px/1.35 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  letter-spacing:-.005em;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
}
.d1 *,.d1 *::before,.d1 *::after{box-sizing:border-box}
.d1 h1,.d1 h2,.d1 h3,.d1 h4,.d1 p,.d1 ul,.d1 ol,.d1 dl,.d1 dd{margin:0}
.d1 button{font:inherit;color:inherit;letter-spacing:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
.d1 input,.d1 select,.d1 textarea{font:inherit;color:inherit;letter-spacing:inherit;margin:0}
.d1 button:focus-visible,.d1 a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.d1 .scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#c9d1dc transparent}
.d1 .app{position:absolute;inset:0;display:flex;flex-direction:column}
.d1 .body{flex:1;min-height:0;position:relative}
.d1 .pg{position:absolute;inset:0}
.d1 .pg.scroll{padding:12px 16px 20px}
.d1 .fx{animation:d1-fx .3s ease both}
.d1 .endsp{height:14px}

/* ---------- encabezado ---------- */
.d1 .top{flex:none;position:relative;z-index:5;display:flex;align-items:center;gap:8px;height:58px;padding:3px 6px 0 16px;background:var(--card);box-shadow:0 1px 0 var(--line)}
.d1 .top::before,.d1 .lph::before,.d1 .pvh::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--ac)}
.d1 .brand{flex:1;min-width:0;display:flex;align-items:center}
.d1 .brand .c-brand,.d1 .lph .c-brand,.d1 .pvh .c-brand{gap:9px}
.d1 .c-name{font-weight:800;font-size:17px;letter-spacing:-.025em;color:var(--ink)}
.d1 .c-ri{color:var(--ac);--ri-a:var(--ac);flex:none}
.d1 .plan{position:relative;flex:none;display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 12px;border-radius:999px;background:var(--fill);box-shadow:inset 0 0 0 1px var(--line);font-size:12.5px;font-weight:800;color:var(--ink2);white-space:nowrap}
.d1 button.plan::after{content:'';position:absolute;inset:-8px -4px}

.d1 .nl{line-height:1.1}
.d1 .bdg{position:absolute;top:-5px;right:2px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font:800 11px/19px 'Plus Jakarta Sans',system-ui,sans-serif;font-style:normal;text-align:center;box-shadow:0 0 0 2px var(--card)}

/* ---------- botones y campos ---------- */

.d1 .btn.big{width:100%;height:54px;font-size:15.5px;border-radius:16px}
.d1 .btn.sm{height:44px;padding:0 14px;font-size:13.5px;border-radius:12px}

.d1 .btn.dngb{background:var(--red);color:#fff}

.d1 .ptag{display:inline-flex;align-items:center;flex:none;white-space:nowrap;height:17px;padding:0 6px;border-radius:5px;background:var(--ink);color:#fff;font-size:10px;font-weight:800;letter-spacing:.05em;line-height:1}
.d1 .btn:not(.ghost):not(.txt) .ptag,.d1 .qb.pri .ptag{background:var(--onb);color:var(--acb)}
.d1 .lnk{position:relative;display:inline-flex;align-items:center;gap:2px;height:36px;padding:0 4px 0 10px;color:var(--act);font-size:13px;font-weight:800;white-space:nowrap}
.d1 .lnk::after{content:'';position:absolute;inset:-4px -4px}
.d1 .fl{display:flex;flex-direction:column;gap:5px;min-width:0}
.d1 .fl>span{font-size:12px;font-weight:700;color:var(--ink2)}
.d1 .fld{display:block;width:100%;min-width:0;height:48px;padding:0 14px;border:0;border-radius:12px;background:var(--fill);box-shadow:inset 0 0 0 1.5px var(--line);font-size:15px;font-weight:600;color:var(--ink);outline:0;appearance:none;-webkit-appearance:none;transition:box-shadow .15s,background .15s}
.d1 .fld:focus,.d1 .inpw:focus-within,.d1 .stp:focus-within{box-shadow:inset 0 0 0 2px var(--ac);background:#fff}
.d1 .fld::placeholder,.d1 .inpw input::placeholder{color:#7b879a;font-weight:500}
.d1 select.fld{padding-right:34px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1.500l5 5 5-5' fill='none' stroke='%23566274' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 13px center}
.d1 textarea.fld{height:auto;padding:12px 14px;resize:none;line-height:1.4}

.d1 .inpb{display:flex;gap:8px}

.d1 .stp{display:flex;align-items:center;height:48px;border-radius:12px;background:var(--fill);box-shadow:inset 0 0 0 1.5px var(--line);overflow:hidden;min-width:0;transition:box-shadow .15s,background .15s}
.d1 .stp button{flex:none;display:grid;place-items:center;width:42px;height:48px;color:var(--act)}

.d1 .shb>.fl+.fl,.d1 .shb>.row2+.fl,.d1 .shb>.row3+.fl,.d1 .shb>.err+.fl{margin-top:12px}

.d1 .note{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--mut)}

.d1 .al{display:flex;align-items:center;gap:11px;width:100%;min-height:60px;margin-top:10px;padding:10px 10px 10px 12px;border-radius:16px;background:var(--red);color:#fff;text-align:left;box-shadow:0 10px 20px -12px rgba(200,40,29,.75)}

.d1 .qt h2{font-size:16.5px;font-weight:800;letter-spacing:-.02em}

.d1 .scn{background:#0b1220;color:#fff}
.d1 .scn .ib{color:#fff}
.d1 .scn .ib:active{background:rgba(255,255,255,.12)}
.d1 .cont{position:relative;flex:none;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 7px 0 13px;border-radius:999px;background:rgba(255,255,255,.12);font-size:12.5px;font-weight:700;color:#fff;white-space:nowrap}
.d1 .cont::after{content:'';position:absolute;inset:-5px -2px}
.d1 .cont u{position:relative;width:34px;height:21px;border-radius:11px;background:rgba(255,255,255,.28);text-decoration:none;transition:background .2s}

.d1 .cont .ptag{background:#fff;color:#0b1220}
.d1 .smode{flex:none;padding:0 16px 12px}

.d1 .vf{position:relative;flex:none;overflow:hidden;height:clamp(140px,23vh,196px);margin:0 16px;border-radius:22px;background:radial-gradient(120% 100% at 50% 35%,#27344d 0,#101828 72%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);transition:box-shadow .2s}

.d1 .vf .tl{top:14px;left:14px;border-top-width:4px;border-left-width:4px;border-top-left-radius:13px}

.d1 .vf .ln{position:absolute;left:20px;right:20px;top:20%;height:3px;border-radius:2px;background:var(--acm);box-shadow:0 0 16px 3px var(--ac);animation:d1-scan 2.1s ease-in-out infinite alternate}

.d1 .vfc{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:6px;max-width:calc(100% - 28px);height:28px;padding:0 12px;border-radius:999px;background:rgba(11,18,32,.88);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden}

.d1 .rhint{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.08);font-size:13px;font-weight:600;line-height:1.4;color:rgba(255,255,255,.82)}
.d1 .rc{overflow:hidden;border-radius:18px;background:#fff;color:var(--ink);box-shadow:0 12px 30px -12px rgba(0,0,0,.7);animation:d1-pop .3s ease both}
.d1 .rbn{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--red);color:#fff}
.d1 .rbn div{display:flex;flex-direction:column;min-width:0}
.d1 .rbn b{font-size:15.5px;font-weight:800;letter-spacing:-.015em}
.d1 .rbn span{font-size:13.5px;font-weight:700}
.d1 .rbn.amb{background:#fcefc7;color:#5e3b00}
.d1 .rct{display:flex;align-items:center;gap:11px;padding:12px 14px}
.d1 .rci{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:var(--acs);color:var(--act)}
.d1 .rc.good .rci{background:var(--grns);color:var(--grn)}
.d1 .rci.n{background:var(--acs);color:var(--act)}
.d1 .rcm{flex:1;min-width:0;display:flex;flex-direction:column}
.d1 .rcm b{font-size:15px;font-weight:800;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d1 .rcm i{font-style:normal;font-size:12px;font-weight:600;color:var(--mut)}
.d1 .rcq{flex:none;font-size:22px;font-weight:800;letter-spacing:-.03em}
.d1 .rcs{display:flex;align-items:center;gap:8px;padding:0 14px 12px;font-size:13px;font-weight:600;color:var(--mut)}
.d1 .rcs b{font-size:16px;font-weight:800;color:var(--ink)}
.d1 .rcs b.red{color:var(--red)}
.d1 .rca{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 8px 14px;border-top:1px solid var(--line)}
.d1 .rc.new .rca,.d1 .rc.warn .rca{border-top:0}
.d1 .fmt{display:inline-flex;align-items:center;gap:5px;min-width:0;height:26px;padding:0 10px;border-radius:999px;background:var(--fill2);font-size:11.5px;font-weight:700;color:var(--ink2);white-space:nowrap;overflow:hidden}
.d1 .fmt .ci{flex:none}
.d1 .fmt em{min-width:0;overflow:hidden;text-overflow:ellipsis;font-style:normal}
.d1 .rca .btn{flex:none}
.d1 .rnt{padding:0 14px 10px;font-size:13px;font-weight:500;line-height:1.45;color:var(--ink2)}
.d1 .rc.warn .rnt{padding-top:12px}
.d1 .rnf{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:8px;padding:0 14px}
.d1 .rc .err{padding:0 14px}
.d1 .slog{margin-top:14px}
.d1 .slog h4{margin-bottom:6px;font-size:12px;font-weight:700;color:rgba(255,255,255,.65)}
.d1 .slog ul{list-style:none;margin:0;padding:0;overflow:hidden;border-radius:14px;background:rgba(255,255,255,.08)}
.d1 .slog li{display:flex;align-items:center;gap:10px;min-height:54px;padding:4px 8px 4px 12px;border-top:1px solid rgba(255,255,255,.08)}
.d1 .slog li:first-child{border-top:0}
.d1 .lgi{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.12)}
.d1 .lgm{flex:1;min-width:0;display:flex;flex-direction:column}
.d1 .lgm b{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d1 .lgm i{font-style:normal;font-size:12px;font-weight:600;color:rgba(255,255,255,.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d1 .lgm i.red{color:#ff9f97;font-weight:700}
.d1 .und{position:relative;flex:none;height:36px;padding:0 13px;border-radius:10px;background:rgba(255,255,255,.16);font-size:12.5px;font-weight:800;color:#fff}
.d1 .und::after{content:'';position:absolute;inset:-5px -3px}
.d1 .sbar{flex:none;padding:10px 16px 12px;background:#0b1220;box-shadow:0 -1px 0 rgba(255,255,255,.08)}
.d1 .tcode{display:flex;gap:8px;margin-top:8px}
.d1 .tcode input{flex:1;min-width:0;height:44px;padding:0 14px;border:0;border-radius:12px;background:rgba(255,255,255,.1);font-size:14px;font-weight:600;color:#fff;outline:0}
.d1 .tcode input::placeholder{color:rgba(255,255,255,.55)}
.d1 .tcode input:focus{box-shadow:inset 0 0 0 2px var(--acm)}
.d1 .tcode button{flex:none;height:44px;padding:0 18px;border-radius:12px;background:rgba(255,255,255,.16);font-size:13.5px;font-weight:800;color:#fff}
.d1 .tcode button:disabled,.d1 .tcode input:disabled{opacity:.4}
.d1 .blue{margin-top:8px;text-align:center;font-size:11.5px;font-weight:600;color:rgba(255,255,255,.6)}
.d1 .qbody{flex:1;min-height:0;padding:2px 16px 14px}
.d1 .qbody>.card:first-child{margin-top:12px}
.d1 .ql{padding:10px 0 12px;border-top:1px solid var(--line)}
.d1 .ch+.ql{border-top:0;padding-top:2px}
.d1 .qlh{display:flex;align-items:center;gap:6px;margin-right:-8px}
.d1 .qlh b{flex:1;min-width:0;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d1 .qlt{flex:none;font-size:14px;font-weight:800;letter-spacing:-.02em}
.d1 .qlg{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr) minmax(0,.9fr);gap:8px}
.d1 .tots .trow{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13.5px;font-weight:600;color:var(--ink2)}
.d1 .tots .trow b{font-weight:800;color:var(--ink)}
.d1 .acts3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.d1 .ab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:60px;padding:0 4px;border-radius:12px;background:var(--fill);box-shadow:inset 0 0 0 1px var(--line);font-size:12px;font-weight:700;color:var(--ink);text-align:center}
.d1 .ab .ci{color:var(--act)}
.d1 .ab:active{background:var(--fill2)}
.d1 .qfoot{flex:none;display:flex;align-items:center;gap:16px;padding:10px 16px 12px;background:var(--card);box-shadow:0 -1px 0 var(--line)}
.d1 .qft{display:flex;flex-direction:column;flex:none;line-height:1.1}
.d1 .qft span{font-size:12px;font-weight:700;color:var(--mut)}
.d1 .qft b{font-size:24px;font-weight:800;letter-spacing:-.035em}
.d1 .qfoot .btn{flex:1}
.d1 .modp{background:var(--bg)}
.d1 .modb{flex:1;min-height:0;overflow-y:auto;padding:0 20px}

/* ---------- bienvenida y configuración ---------- */
.d1 .wl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;gap:18px;padding:26px 20px calc(18px + var(--safe-b));overflow-y:auto;background-image:radial-gradient(#cfd6e0 1px,transparent 1.2px);background-size:20px 20px}
.d1 .wlt{display:flex;align-items:center;gap:11px}
.d1 .mark{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--acb);color:var(--onb);box-shadow:0 10px 18px -8px var(--acr)}
.d1 .wm{font-size:30px;font-weight:800;letter-spacing:-.045em}
.d1 .wlg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.d1 .wt{aspect-ratio:1;display:grid;place-items:center;border-radius:16px;background:var(--card);box-shadow:0 0 0 1px var(--line);color:var(--c);--ri-a:var(--c);animation:d1-hl 9s ease-in-out infinite;animation-delay:calc(1.4s + var(--i)*.55s)}
.d1 .wt.in{animation:d1-tile .5s cubic-bezier(.3,1.5,.5,1) both,d1-hl 9s ease-in-out infinite;animation-delay:calc(var(--i)*55ms),calc(1.4s + var(--i)*.55s)}
.d1 .wt .ri.draw .s{animation-delay:calc(var(--i)*55ms + .15s)}
.d1 .wt .ri.draw .a{animation-delay:calc(var(--i)*55ms + .7s)}
.d1 .wlx{margin:0}
.d1 .wlx h1{max-width:320px;font-size:31px;font-weight:800;line-height:1.08;letter-spacing:-.04em}
.d1 .wlx p{max-width:330px;margin-top:10px;font-size:14.5px;font-weight:500;line-height:1.5;color:var(--ink2)}
.d1 .wla{display:flex;flex-direction:column;gap:10px}
.d1 .su{position:absolute;inset:0;display:flex;flex-direction:column}
.d1 .suh{flex:none;display:flex;align-items:center;gap:10px;height:58px;padding:0 20px 0 6px}
.d1 .dots{display:flex;gap:5px}
.d1 .dots i{width:22px;height:6px;border-radius:3px;background:#cdd5e0;transition:background .2s}
.d1 .dots i.on{background:var(--ac)}
.d1 .stp-t{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--mut)}
.d1 .sub{flex:1;min-height:0;padding:8px 20px 20px}
.d1 .sub h1{font-size:27px;font-weight:800;line-height:1.12;letter-spacing:-.04em}
.d1 .sub-p{margin:8px 0 20px;font-size:14px;font-weight:500;line-height:1.45;color:var(--ink2)}
.d1 .pvw{margin-top:24px}
.d1 .pvl{display:block;margin-bottom:8px;font-size:12px;font-weight:700;color:var(--mut)}
.d1 .pvh{position:relative;overflow:hidden;display:flex;align-items:center;gap:8px;height:58px;padding:3px 10px 0 16px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px var(--line)}
.d1 .suf{flex:none;padding:12px 20px calc(16px + var(--safe-b))}
.d1 .rg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.d1 .rt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:86px;padding:10px 6px;border-radius:16px;background:var(--card);box-shadow:0 0 0 1px var(--line);font-size:11.5px;font-weight:700;line-height:1.2;text-align:center;color:var(--ink2);transition:box-shadow .15s,background .15s}
.d1 .rt .ri{color:#7b879a;--ri-a:#7b879a}
.d1 .rt span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.d1 .rt.on{background:var(--cs);box-shadow:0 0 0 2px var(--c);color:var(--ink)}
.d1 .rt.on .ri{color:var(--c);--ri-a:var(--c)}
.d1 .otro{margin-top:14px}
.d1 .pp{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px;text-align:center}
.d1 .ppi{display:grid;place-items:center;width:152px;height:152px;border-radius:46px;background:var(--acs);color:var(--ac);--ri-a:var(--ac);box-shadow:0 0 0 1px var(--acm)}
.d1 .pp h2{max-width:300px;font-size:21px;font-weight:800;line-height:1.2;letter-spacing:-.03em}
.d1 .ppb{width:180px;height:5px;overflow:hidden;border-radius:3px;background:var(--fill2)}
.d1 .ppb i{display:block;width:100%;height:100%;background:var(--ac);transform-origin:left;animation:d1-load 1.2s ease-in-out both}

/* ---------- animaciones ---------- */
@keyframes d1-fx{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes d1-fade{from{opacity:0}to{opacity:1}}
@keyframes d1-fadeout{to{opacity:0}}
@keyframes d1-up{from{transform:translateY(100%)}to{transform:none}}
@keyframes d1-down{to{transform:translateY(100%)}}
@keyframes d1-slide{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes d1-pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes d1-ping{0%{box-shadow:0 0 0 0 rgba(255,255,255,.75)}100%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}
@keyframes d1-scan{from{top:18%}to{top:80%}}
@keyframes d1-tile{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes d1-hl{0%,7%,100%{background:#fff;transform:none}3.5%{background:var(--cs);transform:scale(1.08)}}
@keyframes d1-load{from{transform:scaleX(.05)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){
  .d1 *,.d1 *::before,.d1 *::after{animation:none!important;transition:none!important}
  .d1 .vf .ln{top:50%}
}

/* ===== Cuadre · estilos de la versión real =====
   Va DESPUÉS de shell.css y d1.css. Aquí están: el marco de la app, las piezas que la maqueta no tenía
   (clave, cámara, vista previa del PDF, copia en la nube…) y el diseño para computadora (≥ 900 px). */

/* ---------- marco: la app ocupa toda la pantalla ---------- */
html,body{height:100%;overflow:hidden;background:#d5dce6}
body{margin:0;background:#d5dce6}
#app.d1{position:fixed;inset:0;width:100%;max-width:480px;margin:0 auto;overflow:hidden;color-scheme:light;
  --safe-b:env(safe-area-inset-bottom,0px);--bad:var(--red);box-shadow:0 0 0 1px rgba(15,23,42,.08)}
#main{position:absolute;inset:0}
#scanL,#lockL{position:absolute;inset:0;pointer-events:none}
#scanL>*,#lockL>*{pointer-events:auto}
#scanL:empty,#lockL:empty{display:none}
.d1 :focus{outline-offset:2px}
.d1 .app[aria-hidden="true"]{pointer-events:none}

/* ---------- pequeños arreglos de la maqueta ---------- */
.d1 .addb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:auto;min-width:58px;padding:0 9px}
.d1 .addb span{font-size:9.5px;font-weight:800;line-height:1;letter-spacing:.01em;white-space:nowrap}
.d1 .pch button{display:inline-flex;align-items:center;justify-content:center;gap:4px}
.d1 .plk{opacity:.65}
.d1 .top .off{flex:none;display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:999px;background:var(--ambs);color:var(--amb);font-size:12px;font-weight:800;white-space:nowrap}
.d1 .top .brand{overflow:hidden}

/* ---------- títulos de sección, avisos, tarjetas sueltas ---------- */
.d1 .sech{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 2px 8px}
.d1 .sech h2{font-size:15px;font-weight:800;letter-spacing:-.02em}
.d1 .sepl{height:1px;margin:14px 0;background:var(--line)}
.d1 .subh{margin-bottom:6px;font-size:13.5px;font-weight:800;letter-spacing:-.01em}
.d1 .opt{flex:none;padding:3px 9px;border-radius:999px;background:var(--fill2);font-size:11.5px;font-weight:700;color:var(--mut)}
.d1 .infob{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 18px;border-radius:18px;background:var(--acs);color:var(--act);text-align:center}
.d1 .infob h3{font-size:17px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.d1 .infob p{font-size:13.5px;font-weight:500;line-height:1.5;color:var(--ink2)}
.d1 .ver{margin-top:14px;padding:8px;text-align:center;font-size:12px;font-weight:600;color:var(--mut)}
.d1 .st0h{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.d1 .st0i{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:15px;background:var(--acs);color:var(--act)}
.d1 .st0h h3{font-size:16px}
.d1 .st0h p{margin-top:3px;font-size:13px;font-weight:500;line-height:1.45;color:var(--ink2)}
.d1 .st0 .two{margin-top:8px}
.d1 .freeb{width:100%;margin-top:10px}
.d1 .lnk.inl{display:inline;height:auto;padding:0;text-decoration:underline;white-space:normal;text-align:left}
.d1 .lnk.inl::after{display:none}
.d1 .pinf{text-align:center;font-size:20px;font-weight:800;letter-spacing:.4em}
.d1 .pinf::placeholder{font-size:13px;letter-spacing:0;font-weight:500}
.d1 .net{flex:none;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;font-size:11.5px;font-weight:800;white-space:nowrap}
.d1 .net::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.d1 .net.on{background:var(--grns);color:var(--grn)}
.d1 .net.off{background:var(--ambs);color:var(--amb)}
.d1 .tgl{position:relative;flex:none;width:52px;height:32px;margin-top:2px;border-radius:16px;background:#c3ccd9;transition:background .2s}
.d1 .tgl::before{content:'';position:absolute;inset:-7px -3px}
.d1 .tgl i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(15,23,42,.35);transition:transform .2s}
.d1 .tgl.on{background:var(--acb)}
.d1 .tgl.on i{transform:translateX(20px)}
.d1 .shop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 10px;padding:8px 8px 8px 14px;border-radius:14px;background:var(--reds);color:var(--red);font-size:13px;font-weight:800}
.d1 .shop .btn{background:var(--red);color:#fff}
.d1 button.gc{width:100%;text-align:left;cursor:pointer}
.d1 .gc.lk b{color:#8b97a9}
.d1 .dtl{display:block}
.d1 .dtl>div{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:9px 0;border-top:1px solid var(--line)}
.d1 .dtl>div:first-child{border-top:0}
.d1 .dtl dt{flex:none;font-size:13px;font-weight:600;color:var(--mut)}
.d1 .dtl dd{min-width:0;font-size:13.5px;font-weight:800;text-align:right;overflow-wrap:anywhere}

/* ---------- enviar / compartir ---------- */
.d1 .shm.lite{margin-top:8px;background:var(--fill);color:var(--ink)}
.d1 .shm.lite .shi{background:var(--fill2);color:var(--ink2)}
.d1 .sho .shi{background:var(--bc,var(--fill2));color:#fff}
.d1 .shh2{margin:16px 2px 0;font-size:12px;font-weight:800;color:var(--mut)}
.d1 .shn{margin:8px 2px 0;font-size:12px;font-weight:500;line-height:1.45;color:var(--mut)}

/* ---------- vista previa del PDF (hoja) ---------- */
.d1 .paper{position:relative;overflow:hidden}
.d1 .paper>*:not(.pwm){position:relative}
.d1 .paper .pph:not(.s){display:flex;align-items:center;gap:12px}
.d1 .ppl{flex:none;max-width:120px;max-height:44px;object-fit:contain}
.d1 .ppd{min-width:0;flex:1}
.d1 .ppd b{display:block;font-size:14px;font-weight:800;letter-spacing:-.015em}
.d1 .ppd span{display:block;margin-top:1px;font-size:11px;font-weight:500;line-height:1.35;color:var(--mut)}
.d1 .ppd1{font-size:11px;font-weight:500;color:var(--mut)}
.d1 .pwm{position:absolute;left:50%;top:50%;width:64%;max-height:70%;object-fit:contain;transform:translate(-50%,-50%) rotate(-24deg);opacity:.07;pointer-events:none;z-index:0}

/* ---------- historial y cotización (pantallas completas) ---------- */
.d1 .hist,.d1 .qed{z-index:40}
.d1 .hctl{flex:none;padding:2px 16px 8px}
.d1 .hctl .chips{margin-top:8px}
.d1 .hbody{flex:1;min-height:0;padding:0 16px 18px}

/* ---------- cámara y lector ---------- */
.d1 .vf video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.d1 .vf .c,.d1 .vf .ln,.d1 .vfc{z-index:2}
.d1 .vfs{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px 26px;background:rgba(11,18,32,.82);color:#fff;text-align:center}
.d1 .vfs b{font-size:14px;font-weight:800}
.d1 .vfs i{font-style:normal;font-size:12px;font-weight:600;line-height:1.4;color:rgba(255,255,255,.75)}
.d1 .vfs .btn{margin-top:8px}
.d1 .spin{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:rspin .8s linear infinite}
.d1 .tbtn.on{background:rgba(255,255,255,.22);color:#ffd84a}
.d1 .sx{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.d1 .sx span{min-width:0;font-size:11.5px;font-weight:600;line-height:1.3;text-align:right;color:rgba(255,255,255,.6)}
.d1 .lk2{flex:none;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 13px;border-radius:12px;background:rgba(255,255,255,.12);font-size:12.5px;font-weight:800;color:#fff}
.d1 .rc.bad .rci{background:var(--reds);color:var(--red)}
.d1 .rc.bad .rcq{color:var(--red)}
.d1 .rc .rnt{padding:0 14px 6px;font-size:13px;font-weight:500;line-height:1.45;color:var(--ink2)}
.d1 .rc .rnf{display:flex;flex-direction:column;gap:10px;padding:2px 14px 6px}   /* una sola columna: Nombre arriba, Precio y Cantidad debajo, bordes alineados */
.d1 .rc .rnf .row2{margin-top:0}
.d1 .rc .rnf .fl>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d1 .rc.new .rca{padding:10px 14px 14px}

/* ---------- pantalla de clave ---------- */
.d1 .lock{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:22px 20px calc(18px + var(--safe-b));overflow-y:auto;background:var(--bg);text-align:center;animation:d1-fade .2s ease both}
.d1 .lkt{display:flex;justify-content:center;margin-bottom:6px}
.d1 .lock h2{font-size:21px;font-weight:800;letter-spacing:-.03em}
.d1 .pdots{display:flex;gap:16px;margin:6px 0 0}
.d1 .pdots i{width:15px;height:15px;border-radius:50%;box-shadow:inset 0 0 0 2px #aab4c3;transition:background .12s,box-shadow .12s,transform .12s}
.d1 .pdots i.on{background:var(--ac);box-shadow:none;transform:scale(1.08)}
.d1 .pdots.shake{animation:d1-shake .38s ease}
.d1 .lkm{min-height:20px;max-width:300px;font-size:13px;font-weight:700;line-height:1.35;color:var(--red)}
.d1 .keypad{display:grid;grid-template-columns:repeat(3,76px);gap:12px 20px;margin-top:2px}
.d1 .keypad button{display:grid;place-items:center;width:76px;height:76px;border-radius:50%;background:var(--card);box-shadow:0 0 0 1px var(--line);font-size:28px;font-weight:700;color:var(--ink);transition:transform .08s,background .12s}
.d1 .keypad button:active{transform:scale(.94);background:var(--acs)}
.d1 .keypad button[data-k="x"]{background:none;box-shadow:none;color:var(--ink2)}
.d1 .lkf{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:340px}
.d1 .lkf>.ci{color:var(--red)}
.d1 .lkf h2{font-size:20px}
.d1 .lkf p{font-size:13.5px;font-weight:500;line-height:1.5;color:var(--ink2)}
@media (max-height:660px){
  .d1 .keypad{grid-template-columns:repeat(3,62px);gap:8px 18px}
  .d1 .keypad button{width:62px;height:62px;font-size:24px}
  .d1 .lock{gap:8px}
}

/* ---------- movimiento ---------- */
@keyframes rspin{to{transform:rotate(360deg)}}
@keyframes d1-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes rmodal{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.d1 .spin{animation:none}.d1 .pdots.shake{animation:none}}

/* ---------- ratón: resaltar lo que se puede tocar ---------- */
@media (hover:hover){
  .d1 .btn:hover{filter:brightness(.96)}
  .d1 .btn.ghost:hover{background:var(--fill)}
  .d1 .pr:hover,.d1 .qrow:hover,.d1 .mr:hover{background:var(--fill)}
  .d1 .pr.low:hover{background:#ffebe8}
  .d1 .chp:not(.on):hover{background:var(--fill)}
  .d1 .ib:hover{background:var(--fill2)}
  .d1 .scn .ib:hover{background:rgba(255,255,255,.12)}
  .d1 .qb:not(.pri):hover{background:var(--fill)}
  .d1 .ni:not(.on):hover{color:var(--ink)}
  .d1 .keypad button:hover{background:var(--acs)}
  .d1 .sho:hover{background:var(--fill)}
}

/* =====================================================================
   COMPUTADORA (≥ 900 px): barra lateral, ventanas centradas, dos columnas
   ===================================================================== */
@media (min-width:900px){
  html,body{background:var(--bg0,#eceff4)}
  #app.d1{max-width:none;box-shadow:none}

  /* marco: arriba la barra, a la izquierda el menú, a la derecha el contenido */
  .d1 .app{display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:60px minmax(0,1fr)}
  .d1 .top{grid-column:1/-1;grid-row:1;height:60px;padding:3px 14px 0 20px}
  .d1 .body{grid-column:2;grid-row:2}
  .d1 .nav{grid-column:1;grid-row:2;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:4px;height:auto;padding:16px 12px;background:var(--card);box-shadow:1px 0 0 var(--line)}
  .d1 .ni{flex-direction:row;justify-content:flex-start;gap:12px;height:46px;padding:0 14px;border-radius:13px;font-size:14px;text-align:left}
  .d1 .ni.on{background:var(--acs)}
  .d1 .nip{position:static;width:26px;height:26px;border-radius:0;background:none!important}
  .d1 .ni .bdg{position:absolute;right:12px;top:50%;transform:translateY(-50%);box-shadow:none}
  .d1 .nl{font-size:14px;font-weight:700}
  .d1 .ni.mid{order:-1;margin-bottom:10px;background:var(--acb);color:var(--onb);padding:0 14px;height:50px;justify-content:flex-start}
  .d1 .ni.mid .nl{font-weight:800}
  .d1 .ni.mid .fab{position:static;transform:none;width:26px;height:26px;border-radius:0;background:none;box-shadow:none;color:inherit}
  .d1 .ni.mid .fab .ci,.d1 .ni.mid .fab svg{width:24px;height:24px}
  .d1 .ni.mid:active .fab{transform:none}
  .d1 .ni.mid:hover{filter:brightness(.96);color:var(--onb)}

  /* contenido centrado, con ancho cómodo */
  .d1 .pg{--w:1060px}
  .d1 .pg[data-sk="m-cotizar"]{--w:820px}
  .d1 .pg.prods{--w:920px}
  .d1 .pg.scroll{padding:26px max(32px,calc((100% - var(--w))/2)) 36px}
  .d1 .ctl{padding:22px max(32px,calc((100% - var(--w))/2)) 6px}
  .d1 .pl{padding:6px max(32px,calc((100% - var(--w))/2)) 28px}
  .d1 .hd h1{font-size:26px}
  .d1 .hd{margin-bottom:14px}

  /* Inicio y Más: dos columnas */
  .d1 .pg[data-sk="m-inicio"]{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:16px;align-content:start}
  .d1 .pg[data-sk="m-inicio"]>.hd,.d1 .pg[data-sk="m-inicio"]>.tgrid,.d1 .pg[data-sk="m-inicio"]>.sg,
  .d1 .pg[data-sk="m-inicio"]>.al,.d1 .pg[data-sk="m-inicio"]>.qa,.d1 .pg[data-sk="m-inicio"]>.endsp,.d1 .pg[data-sk="m-inicio"]>.vb,
  .d1 .pg[data-sk="m-inicio"]>.st0,.d1 .pg[data-sk="m-inicio"]>.empty{grid-column:1/-1}
  /* Más: ajustes en dos columnas que se acomodan solas (sin huecos) */
  .d1 .pg[data-sk="m-mas"]{display:block;columns:2;column-gap:16px}
  .d1 .pg[data-sk="m-mas"]>.hd,.d1 .pg[data-sk="m-mas"]>.sech{column-span:all}
  .d1 .pg[data-sk="m-mas"]>.card,.d1 .pg[data-sk="m-mas"]>section{break-inside:avoid}
  .d1 .bb:nth-child(n+4){display:none}
  .d1 .tgrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .d1 .qa{gap:12px}
  .d1 .qb{height:84px;flex-direction:row;gap:12px;font-size:14px}
  .d1 .sg{margin:12px 0 0}
  .d1 .sgr{flex-wrap:wrap;overflow:visible;padding:2px 0 4px;scroll-snap-type:none}
  .d1 .bb{width:calc(33.333% - 6px)}
  .d1 .bars{height:150px}
  .d1 .top .brand{flex:1}

  /* ventanas (hojas) centradas en vez de subir desde abajo */
  .d1 .ov{justify-content:center;align-items:center;padding:28px}
  .d1 .sheet{width:min(560px,100%);max-height:min(100%,860px);border-radius:22px;padding-bottom:0;box-shadow:0 24px 70px rgba(15,23,42,.38)}
  .d1 .sheet.regs,.d1 .sheet.wide{width:min(700px,100%)}
  .d1 .sheet.tall{min-height:0}
  .d1 .grab{display:none}
  .d1 .shh{padding:10px 10px 4px 22px}
  .d1 .shb{padding:6px 22px 22px}
  .d1 .shf{padding:14px 22px 18px;border-radius:0 0 22px 22px}
  .d1 .ov.in .sheet{animation:rmodal .22s cubic-bezier(.2,.9,.25,1) both}
  .d1 .ov.out .sheet{animation:d1-fadeout .15s ease both}
  .d1 .shg{grid-template-columns:repeat(6,1fr)}

  /* pantallas completas (cotización, historial, cámara) como panel central */
  .d1 .pov{inset:20px 0;margin:0 auto;width:min(860px,calc(100% - 40px));border-radius:22px;overflow:hidden;box-shadow:0 0 0 100vmax rgba(15,23,42,.5),0 24px 70px rgba(0,0,0,.4)}
  .d1 .pov.scn{width:min(580px,calc(100% - 40px))}
  .d1 .pov.hist{width:min(760px,calc(100% - 40px))}
  .d1 .pov.in{animation:rmodal .25s cubic-bezier(.2,.9,.25,1) both}
  .d1 .vf{height:clamp(200px,34vh,320px)}
  .d1 .scn.has .vf{height:clamp(120px,18vh,170px)}
  .d1 .qbody{padding:2px 22px 18px}
  .d1 .stop{padding:0 14px 0 10px}

  /* bienvenida y configuración: una columna centrada */
  .d1 .wl{padding-left:max(20px,calc((100% - 460px)/2));padding-right:max(20px,calc((100% - 460px)/2))}
  .d1 .suh{padding-left:max(6px,calc((100% - 480px)/2))}
  .d1 .sub{padding-left:max(20px,calc((100% - 480px)/2));padding-right:max(20px,calc((100% - 480px)/2))}
  .d1 .wlx h1{max-width:420px}

  /* aviso en pantalla: arriba a la derecha, no tapa el contenido */
  .d1 .c-toast{left:auto;right:24px;bottom:24px;transform:translate(0,14px)}
  .d1 .c-toast.on{transform:none}
  .d1.hs .c-toast{top:auto;bottom:24px;transform:translate(0,14px)}
  .d1.hs .c-toast.on{transform:none}
  .d1 .keypad button{width:80px;height:80px}
  .d1 .keypad{grid-template-columns:repeat(3,80px)}
}

/* tabletas y ventanas anchas pero no tanto: tres columnas de ranking cómodas */
@media (min-width:1280px){
  .d1 .app{grid-template-columns:248px minmax(0,1fr)}
  .d1 .pg{--w:1180px}
}

/* impresión: si alguien imprime la página, que salga solo el contenido */
@media print{
  html,body{overflow:visible;background:#fff}
  #app.d1{position:static;box-shadow:none}
  .d1 .nav,.d1 .top,.d1 .c-toast{display:none!important}
}

/* ---------- íconos dentro de frases ---------- */
.d1 .accn .ci,.d1 .accn svg,.d1 .fine .ci{display:inline-block;vertical-align:-3px;margin-right:3px}
.d1 .okic{color:var(--grn)}
.d1 .sw>.okic{align-self:center}

/* ---------- Más: computadora y teclas ---------- */
.d1 .pcu{margin:6px 0 10px;padding:9px 12px;border-radius:11px;background:var(--fill);font-size:12.5px;font-weight:700;color:var(--ink2);overflow-wrap:anywhere;user-select:all}
.d1 kbd{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 7px;border-radius:7px;background:var(--fill);box-shadow:inset 0 0 0 1px var(--line),0 1px 0 var(--line);font:800 12px/1 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink)}
.d1 .ch>.ci{color:var(--mut)}

/* ---------- módulos Pro: entregas con firma, préstamos y alquileres, firma del negocio ---------- */
.d1 .est.rec{background:var(--reds);color:var(--red)}
.d1 .stn.sm2{font-size:20px;letter-spacing:-.02em;margin-top:2px}
.d1 .pst .lbl{display:block;font-size:12px;font-weight:700;color:var(--mut)}
.d1 .pst .fine{display:block;margin-top:2px}
.d1 .entb{margin-top:16px;padding:14px;border-radius:16px;background:var(--fill)}
.d1 .entb h4{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.d1 .entb .fl+.fl{margin-top:10px}
.d1 .entb .fld{background:var(--card)}
.d1 .sigw{position:relative;margin-top:10px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);overflow:hidden}
.d1 .sigw::after{content:'';position:absolute;left:7%;right:7%;bottom:24%;border-top:1.5px dashed #cfd5df;pointer-events:none}
.d1 .sigc{display:block;width:100%;aspect-ratio:2.4/1;touch-action:none;cursor:crosshair;-webkit-user-select:none;user-select:none}
.d1 .sigh{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:700;letter-spacing:.02em;color:#9aa3b2;pointer-events:none}
.d1 .sigh[hidden]{display:none}
.d1 .sigv{display:grid;place-items:center;padding:10px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.d1 .sigv img{max-width:100%;max-height:120px;object-fit:contain}
.d1 .sigl{list-style:none;margin:0;padding:0}
.d1 .sigl li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.d1 .sigl li:first-child{border-top:0}
.d1 .sigl span{min-width:0;font-weight:600;overflow-wrap:anywhere}
.d1 .sigl b{flex:none;font-weight:800}
.d1 .pfirma{display:flex;flex-direction:column;align-items:center;gap:3px;width:46%;margin:14px 0 0 auto}
.d1 .pfirma img{max-width:100%;max-height:44px;object-fit:contain}
.d1 .pfirma span{width:100%;padding-top:3px;border-top:1px solid #c8cfda;text-align:center;font-size:10.5px;font-weight:600;color:var(--mut)}
.d1 .subh{display:block}
.d1 .pk .pkl{margin-top:8px}

.d1 .shb>.pst+.fl,.d1 .shb>.pst+.row2,.d1 .shb>.pst+.dtl{margin-top:12px}
.d1 .shb>.pk+.fl{margin-top:12px}

.d1 .shb>.card+.fl,.d1 .shb>.card+.card{margin-top:12px}
.d1 .shb>.fl+.card{margin-top:12px}

/* =====================================================================
   PRODUCTOS: tabla
   miniatura · Código · Detalle (nombre y etiquetas) · Ingreso · Egreso · Precio · menú ⋮
   ===================================================================== */
.d1 .plist{--g:4px;--w0:38px;--w3:34px;--w4:34px;--ws:46px;--w5:58px;--w6:24px;display:flex;flex-direction:column;margin:0 -6px;background:var(--card);border-radius:18px;box-shadow:0 0 0 1px var(--line),0 6px 18px -12px rgba(15,23,42,.25);overflow:clip}
.d1 .pth,.d1 .plist .pr{display:grid;grid-template-columns:var(--w0) minmax(0,1fr) var(--w3) var(--w4) var(--ws) var(--w5) var(--w6);column-gap:var(--g);align-items:center;padding-left:10px;padding-right:6px}
.d1 .pth{position:sticky;top:0;z-index:3;padding-top:10px;padding-bottom:10px;background:var(--fill);border-bottom:1px solid var(--line);font-size:10px;font-weight:800;letter-spacing:0;color:var(--mut);line-height:1.1}
.d1 .pth .c3,.d1 .pth .c4,.d1 .pth .c5{text-align:right}
.d1 .pth .stc{text-align:center}
.d1 .plist .pc.c1,.d1 .pth>.c1{display:none}
.d1 .plist .pr{position:relative;padding-top:9px;padding-bottom:9px;border-top:1px solid var(--line);background:var(--card)}
.d1 .plist .pth+.pr{border-top:0}
.d1 .plist .pr::before{content:none}
.d1 .plist .pr.low{background:#fff7f6}
.d1 .plist .prh{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;border-radius:0;background:transparent;cursor:pointer;z-index:1}
.d1 .plist .prh:active{background:rgba(15,23,42,.05)}
@media (hover:hover){.d1 .plist .prh:hover{background:rgba(15,23,42,.04)}}
.d1 .plist .prh:focus-visible{outline:2px solid var(--ac);outline-offset:-2px}
.d1 .plist .pc{min-width:0;font-weight:700;color:var(--ink);pointer-events:none}
.d1 .plist .c1{font-size:11.5px;color:var(--mut);overflow-wrap:anywhere;line-height:1.2}
.d1 .plist .c2{display:flex;flex-direction:column;gap:4px}
.d1 .plist .prn{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal;overflow:hidden;font-size:14px;font-weight:800;line-height:1.2;letter-spacing:-.01em;color:var(--ink)}
.d1 .plist .prc{display:flex;flex-wrap:wrap;align-items:center;gap:3px}
.d1 .plist .cod{font-size:10.5px;font-weight:700;color:var(--mut);margin-right:2px}
.d1 .plist .stc{display:flex;flex-direction:column;align-items:center;gap:1px}
.d1 .plist .stc b{display:block;width:100%;padding:3px 0;border-radius:9px;background:var(--fill);text-align:center;font-size:14.5px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.d1 .plist .stc i{font-style:normal;font-size:9.5px;font-weight:700;line-height:1.1;color:var(--mut);white-space:nowrap}
.d1 .plist .stc.low b{background:#fff1da;color:#9a5b00}
.d1 .plist .stc.zero b{background:#fde7e4;color:var(--red)}
.d1 .plist .stc.zero i{color:var(--red)}
.d1 .plist .chp2{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:999px;background:var(--fill);font-size:10.5px;font-weight:700;line-height:1.35;color:var(--mut);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.d1 .plist .chp2.stk{background:#e8f6ee;color:#17703c}
.d1 .plist .chp2.low{background:#fde7e4;color:var(--red);font-weight:800}
.d1 .plist .chp2.amb{background:#fff1da;color:#9a5b00;font-weight:800}
.d1 .plist .c3,.d1 .plist .c4,.d1 .plist .c5{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.d1 .plist .c3,.d1 .plist .c4{font-size:13px}
.d1 .plist .c3.nil,.d1 .plist .c4.nil{color:var(--mut);font-weight:600}

.d1 .lcok.big{padding:16px 14px}.d1 .lcok.big b{font-size:17px}
.d1 .lnkb{display:inline;padding:0;border:0;background:none;color:var(--act);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
.d1 .pcof{display:flex;flex-direction:column;gap:5px;margin:4px 0 12px;padding:12px;border-radius:14px;background:var(--acs)}
.d1 .pcof>b{font-size:15px;font-weight:800}
.d1 .pcof>span{font-size:12.5px;font-weight:600;line-height:1.4;color:var(--ink2)}
.d1 .pcpp{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:3px;font-size:12.5px;font-weight:600;color:var(--mut)}
.d1 .pcpp b{font-size:19px;font-weight:800;letter-spacing:-.03em;color:var(--ink)}
.d1 .pcgp{margin:4px 0 14px;font-size:14px;font-weight:600;color:var(--ink2)}.d1 .pcgp b{font-size:18px;font-weight:800;color:var(--ink)}
.d1 .hpc.one{cursor:default;margin-top:12px}
.d1 .nxtb{display:flex;align-items:flex-start;gap:11px;margin:14px 0 6px;padding:12px;border-radius:14px;background:var(--acs);color:var(--ink)}
.d1 .nxtb>.ci{flex:none;margin-top:1px;color:var(--ac)}
.d1 .nxtb div{display:flex;flex-direction:column;gap:3px;min-width:0}
.d1 .nxtb b{font-size:13.5px;font-weight:800}
.d1 .nxtb span{font-size:12.5px;font-weight:600;line-height:1.42;color:var(--ink2);overflow-wrap:anywhere}
.d1 .nxtb span b{font-size:inherit;color:var(--ink)}
.d1 .pcgm{padding:10px 12px;border-radius:12px;background:var(--ambs);color:var(--ink2);font-size:13px!important;font-weight:600!important;text-align:left}
/* aviso de la computadora: estados (inicio de sesión, cuenta incorrecta, verificar) */
.d1 .pcgm.warn{display:flex;gap:8px;align-items:center;background:var(--reds,var(--ambs));color:var(--ink)}
.d1 .pcgm.warn svg{flex:none}
.d1 .pcgb.sec{margin-top:2px}
.d1 .pcgb.sec .btn{min-height:46px;font-size:15px}
/* candado de «Ganancia» en las tarjetas chicas (Semana/Mes/Año): compacto para que no se corte con «…» */
.d1 .ttg .gm{padding:0 5px;gap:2px;font-size:.82em;letter-spacing:.02em;vertical-align:baseline}
.d1 .ttg .gm svg{width:10px;height:10px}
.d1 .ttg{text-overflow:clip}
/* etiquetas: vista previa a escala (1 mm = 3,2 px) */
.d1 .etp{box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:1px;margin:10px auto 4px;background:#fff;color:#141821;border:1px solid var(--line);border-radius:5px;box-shadow:0 2px 10px rgba(20,30,50,.12);overflow:hidden;text-align:center}
.d1 .etp b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:800;line-height:1.1;max-width:100%}
.d1 .etp strong{font-weight:800;line-height:1.1}
.d1 .etp .etc{display:flex;align-items:center;justify-content:center;flex:1;min-height:0;max-width:100%}
.d1 .etp .etc svg{display:block;max-width:100%;max-height:100%;color:#141821}
.d1 .etp em{font-style:normal;line-height:1.05;color:#46505c;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d1 .etsz{margin:2px 0 10px;text-align:center;font-size:12.5px;font-weight:700;color:var(--mut)}
.d1 .etn{display:flex;align-items:center;gap:8px}.d1 .etn .fld{flex:1;text-align:center;font-weight:800;font-size:18px}
.d1 .etn .ib{flex:none;width:46px;height:46px;border-radius:12px;background:var(--fill)}

/* foto inteligente (Pro) */
.d1 .fal{display:grid;justify-items:center;text-align:center;gap:8px;padding:26px 8px 14px}
.d1 .fal p{margin:0;font-weight:800;font-size:15px}.d1 .fal i{font-style:normal;font-size:12.5px;color:var(--mut);max-width:30ch}
.d1 .fal .fai{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--mut)}
.d1 .fasp{width:34px;height:34px;border-radius:50%;border:3.5px solid var(--fill);border-top-color:var(--ac);animation:rspin .8s linear infinite}
.d1 .fag{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0 6px}
.d1 .fac{display:grid;gap:6px;justify-items:center;padding:8px 6px 7px;border-radius:16px;background:var(--fill);border:2px solid transparent;cursor:pointer;font:inherit;color:inherit;min-width:0}
.d1 .fac:hover,.d1 .fac:focus-visible{border-color:var(--ac)}.d1 .fac img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:11px;background:#fff}
.d1 .fac span{font-size:11px;font-weight:800;color:var(--mut);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.d1 .fasp{animation:none}}

/* mensaje al cliente */
.d1 .qmpv{margin:0;padding:12px 14px;border-radius:14px;background:var(--fill);font:500 12.5px/1.45 var(--f,inherit);color:var(--ink2);white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto}
/* pantallas muy anchas (1500 px o más): el contenido gana ancho para que los nombres no se partan en dos líneas */
@media (min-width:1500px){.d1 .pg{--w:1240px}.d1 .pg.prods{--w:1260px}.d1 .pg[data-sk="m-cotizar"]{--w:1000px}.d1 .plist{--w1:140px;--w5:150px}}

C.rubroBuscar=q=>{
  const ws=norm(q).split(/[^a-z0-9ñ]+/).filter(Boolean).map(stem);if(!ws.length)return [];
  const res=[];
  DATA.forEach(r=>{if(r.id==='otro')return;
    const n=norm(r.nom),c=norm(r.cats.join(' ')),it=norm(r.items.map(x=>x.nom).join(' ')+' '+(r.kw||'')),sc=ws.reduce((a,w)=>{const k=n.includes(w)?3:c.includes(w)?2:it.includes(w)?1:0;return a===null||k===0?null:a+k},0);
    if(sc)res.push([sc,r])});
  return res.sort((a,b)=>b[0]-a[0]).map(x=>x[1])};

function detectRegion(){
  try{const L=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'']);
    for(const l of L){const m=String(l).match(/[-_]([A-Za-z]{2})$/);if(m&&KNOWN.has(m[1].toUpperCase()))return m[1].toUpperCase()}}catch(e){}
  try{const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;if(TZ2R[tz])return TZ2R[tz]}catch(e){}
  return 'OT';
}

function fixed(n,dec,s){
  n=Math.round((+n||0)*Math.pow(10,dec))/Math.pow(10,dec);const neg=n<0;const t=Math.abs(n).toFixed(dec).split('.');
  return {neg:neg&&n!==0,int:t[0].replace(/\B(?=(\d{3})+(?!\d))/g,s.g),dec:t[1]?s.d+t[1]:''};
}

  const body=f.int+f.dec;

}

C.parseNum=v=>{let s=String(v==null?'':v).trim().replace(/[^\d.,\-]/g,'');if(!s)return 0;

  if(lc>=0&&ld>=0){const dsep=lc>ld?',':'.';s=s.split(dsep==','?'.':',').join('');s=s.replace(dsep,'.')}
  else if(lc>=0||ld>=0){const ch=lc>=0?',':'.',parts=s.split(ch);if(parts.length>2)s=parts.join('');else s=parts.join('.')}
  const x=parseFloat(s);return isFinite(x)?(neg?-x:x):0};

function payload(){return JSON.stringify({v:1,s:C.state,d:D,t:Date.now()},clean)}      // foto completa (copias, modo localStorage)
const mkey=t=>'m:'+(isFinite(t)?new Date(t).toISOString().slice(0,7):'0000-00');
function parts(){
  let d=null;const g=new Map();
  if(D){d={};Object.keys(D).forEach(k=>{if(k!=='movs')d[k]=D[k]});for(const m of D.movs){const k=mkey(m.t);let a=g.get(k);if(!a){a=[];g.set(k,a)}a.push(m)}}
  const meta=JSON.stringify({v:2,s:C.state,d},clean),sig={},chunks={};
  g.forEach((a,k)=>{let x=0;for(let i=0;i<a.length;i++)x=(x+(+a[i].id||0)*(i+1))%1e9;sig[k]=a.length+'|'+a[0].id+'|'+a[a.length-1].id+'|'+x;chunks[k]=a});
  return {meta,sig,chunks}
}
function sigOf(a){let x=0;for(let i=0;i<a.length;i++)x=(x+(+a[i].id||0)*(i+1))%1e9;return a.length+'|'+a[0].id+'|'+a[a.length-1].id+'|'+x}
function adopt(o){
  C.state=Object.assign(ST0(),o.s);C.state.info=Object.assign(ST0().info,o.s.info||{});C.state.docs=Object.assign({day:0,n:0,keys:{}},o.s.docs||{});
  if(!DEVOK)C.state.devPlan=null;
  D=o.d?Object.assign(D0(),o.d):(C.state.step==='app'?D0():null);
  if(D){D.seqs=Object.assign(D0().seqs,D.seqs||{});if(!Array.isArray(D.movs))D.movs=[]}
  if(C.state.step==='app'&&!D)D=D0();
  C.locked=!!(C.state.pin&&C.state.step==='app');
}
/* ---- IndexedDB ---- */
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
function idbOpen(){return new Promise((res,rej)=>{const to=setTimeout(()=>rej(new Error('idb-timeout')),4000);
  try{const r=indexedDB.open('cuadre',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv')};
    r.onsuccess=()=>{clearTimeout(to);res(r.result)};r.onerror=()=>{clearTimeout(to);rej(r.error||new Error('idb'))}}catch(e){clearTimeout(to);rej(e)}})}
async function idbLoad(){
  const tx=STO.db.transaction('kv','readonly'),os=tx.objectStore('kv'),R=IDBKeyRange.bound('m:','m;');
  const [m,t,ks,vs]=await Promise.all([rq(os.get('meta')),rq(os.get('t')),rq(os.getAllKeys(R)),rq(os.getAll(R))]);
  if(!m)return null;const ch={};ks.forEach((k,i)=>ch[k]=vs[i]);return {meta:m,t:+t||0,ch}
}
function fromStored(cur,hot){
  const arr={},sig={},clen={};
  Object.keys(cur.ch).forEach(k=>{try{const a=JSON.parse(cur.ch[k]);arr[k]=a;sig[k]=a.length?sigOf(a):'0';clen[k]=cur.ch[k].length}catch(e){console.error('Cuadre: trozo ilegible',k,e)}});
  let meta=cur.meta,t=cur.t;
  if(hot&&hot.t>cur.t){meta=hot.meta;t=hot.t;Object.keys(hot.chunks||{}).forEach(k=>{try{arr[k]=JSON.parse(hot.chunks[k])}catch(e){}});STO.recovered=true}
  const o=JSON.parse(meta);
  if(o.d){o.d.movs=[];Object.keys(arr).sort().forEach(k=>{for(const m of arr[k])o.d.movs.push(m)})}
  return {o:{s:o.s,d:o.d},t:cur.t,sig,clen,mlen:cur.meta.length}
}
/* ---- escritura ---- */
function hotWrite(P,changed){try{localStorage.setItem('cuadre.hot',JSON.stringify({t:STO.hotT=Math.max(Date.now(),STO.t+1),meta:P.meta,chunks:changed}))}catch(e){}}
function diff(P){const changed={};Object.keys(P.sig).forEach(k=>{if(STO.sig[k]!==P.sig[k])changed[k]=JSON.stringify(P.chunks[k],clean)});
  return {changed,gone:Object.keys(STO.sig).filter(k=>!(k in P.sig))}}
async function flush(){
  if(STO.busy){STO.again=true;try{const P=parts(),d=diff(P);hotWrite(P,d.changed)}catch(e){}return}
  STO.busy=true;
  try{
    if(STO.clearing)await STO.clearing;
    const P=parts(),{changed,gone}=diff(P),now=Math.max(Date.now(),STO.t+1);
    hotWrite(P,changed);                                       // respaldo inmediato, síncrono
    let res='error',erro=null;
    await new Promise(done=>{
      let tx;try{tx=STO.db.transaction('kv','readwrite')}catch(e){erro=e;done();return}
      const os=tx.objectStore('kv'),g=os.get('t');
      g.onsuccess=()=>{const cur=+g.result||0;
        if(cur>STO.t){res='conflicto';tx.abort();return}
        Object.keys(changed).forEach(k=>os.put(changed[k],k));gone.forEach(k=>os.delete(k));os.put(P.meta,'meta');os.put(now,'t')};
      tx.oncomplete=()=>{if(res==='error')res='ok';done()};
      tx.onabort=()=>{if(res==='error'){erro=tx.error;}done()};
      tx.onerror=()=>{erro=tx.error}});
    if(res==='ok'){
      STO.t=now;STO.sig=P.sig;STO.mlen=P.meta.length;Object.keys(changed).forEach(k=>STO.clen[k]=changed[k].length);gone.forEach(k=>delete STO.clen[k]);
      STO.err=null;lastErr=null;saveWarn=false;try{localStorage.removeItem('cuadre.hot')}catch(e){}
      try{STO.bc&&STO.bc.postMessage({t:now,w:WID})}catch(e){}
      try{C.notif&&C.notif.mirror()}catch(x){}
      dailyBackup();
    }else if(res==='conflicto'){STO.busy=false;await adoptExternal(true);STO.busy=true}      // lo mío no llegó a guardarse: queda en una copia
    else{STO.err=erro||new Error('guardar');lastErr=STO.err;if(!saveWarn){saveWarn=true;try{C.toast('No pude guardar: la memoria del navegador está llena. Baja una copia de seguridad.',false,true)}catch(x){}}}
  }catch(e){STO.err=e;lastErr=e;console.error('Cuadre: guardar',e)}
  STO.busy=false;if(STO.again){STO.again=false;setTimeout(flush,50)}
}
/* otra ventana guardó algo más nuevo: se trae, y lo mío sin guardar queda en una copia automática */
async function adoptExternal(mine){
  try{
    const pending=!!mine||!!saveT||STO.again;
    if(pending&&D)C.safety('cambios-sin-guardar');
    const cur=await idbLoad();if(!cur)return;
    const f=fromStored(cur);clearTimeout(saveT);saveT=0;
    adopt(f.o);STO.t=f.t;STO.sig=f.sig;STO.clen=f.clen;STO.mlen=f.mlen;STO.again=false;
    try{localStorage.removeItem('cuadre.hot')}catch(e){}
    C.refresh();
    if(pending)C.toast('Otra ventana guardó cambios más nuevos: se actualizó. Lo que estaba sin guardar aquí quedó en una copia automática.')
    else C.toast('Se actualizó con los cambios de otra ventana.');
  }catch(e){console.error('Cuadre: traer cambios de otra ventana',e)}
}
async function idbT(){try{return +(await rq(STO.db.transaction('kv','readonly').objectStore('kv').get('t')))||0}catch(e){return 0}}
/* ---- copias automáticas dentro del teléfono ---- */
async function zipStr(txt){if(typeof CompressionStream==='undefined')return null;const cs=new CompressionStream('gzip'),w=cs.writable.getWriter();w.write(new TextEncoder().encode(txt));w.close();return new Uint8Array(await new Response(cs.readable).arrayBuffer())}
async function unzipStr(u8){const ds=new DecompressionStream('gzip'),w=ds.writable.getWriter();w.write(u8);w.close();return new TextDecoder().decode(await new Response(ds.readable).arrayBuffer())}
const KEEP={d:3,s:4};
async function bakPut(kind,tag){
  if(STO.mode!=='idb'||!D||C.state.step!=='app')return false;
  try{
    const txt=payload(),meta={k:kind+Date.now(),kind,tag:tag||'',t:Date.now(),prods:D.prods.length,movs:D.movs.length,nom:C.state.nombre||'',biz:C.state.bizId||''};
    let data=txt;try{const u=await zipStr(txt);if(u){data=u;meta.z=true}}catch(e){}
    meta.size=meta.z?data.byteLength:data.length;
    await new Promise((res,rej)=>{const tx=STO.db.transaction('kv','readwrite'),os=tx.objectStore('kv'),g=os.get('bak:idx');
      g.onsuccess=()=>{let idx=g.result||[];idx.push(meta);const mine=idx.filter(x=>x.kind===kind).sort((a,b)=>b.t-a.t),drop=mine.slice(KEEP[kind]||3);
        drop.forEach(x=>os.delete('bak:'+x.k));idx=idx.filter(x=>drop.indexOf(x)<0);os.put(data,'bak:'+meta.k);os.put(idx,'bak:idx')};
      tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('abort'))});
    return true;
  }catch(e){console.error('Cuadre: copia automática',e);return false}
}
const hoyLocal=t=>new Date((t||Date.now())-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
function dailyBackup(){const today=hoyLocal();if(STO.lastBak===today||!D||C.state.step!=='app'||!D.prods.length)return;STO.lastBak=today;bakPut('d','diaria')}
C.safety=tag=>{
  if(STO.mode==='idb'){bakPut('s',tag);return true}
  try{const p=payload();const o=localStorage.getItem('cuadre.safe.1');if(o)localStorage.setItem('cuadre.safe.2',o);
    localStorage.setItem('cuadre.safe.1',p);return true}catch(e){return false}};
C.autoBackups=async()=>{if(STO.mode!=='idb')return [];try{const idx=await rq(STO.db.transaction('kv','readonly').objectStore('kv').get('bak:idx'));return (idx||[]).slice().sort((a,b)=>b.t-a.t)}catch(e){return []}};
C.autoRestore=async k=>{
  try{const os=STO.db.transaction('kv','readonly').objectStore('kv'),idx=(await rq(os.get('bak:idx'))||[]),m=idx.find(x=>x.k===k),data=await rq(STO.db.transaction('kv','readonly').objectStore('kv').get('bak:'+k));
    if(!m||data==null)return {ok:false,msg:'No encontré esa copia.'};
    const txt=m.z?await unzipStr(data):data,o=JSON.parse(txt);
    return applyBackup({app:'cuadre',s:o.s,d:o.d})}catch(e){console.error(e);return {ok:false,msg:'No pude leer esa copia.'}}};

C.storageInfo=()=>{let b=STO.mode==='idb'?STO.mlen:lastSize;if(STO.mode==='idb')Object.keys(STO.clen).forEach(k=>b+=STO.clen[k]);return {bytes:b,error:!!lastErr,mode:STO.mode}};

function readLegacy(){try{const raw=localStorage.getItem(KEY);if(!raw)return null;const o=JSON.parse(raw);if(!o||!o.s)return null;return {o,size:raw.length}}catch(e){console.error('Cuadre: no pude leer lo guardado',e);return null}}
function readHot(){try{const r=localStorage.getItem('cuadre.hot');return r?JSON.parse(r):null}catch(e){return null}}
function booted(){
  C.booting=false;
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if(STO.mode==='idb'){
    try{if('BroadcastChannel' in window){STO.bc=new BroadcastChannel('cuadre-store');STO.bc.onmessage=e=>{const m=e.data||{};if(m.w!==WID&&m.t>STO.t)adoptExternal()}}}catch(e){}
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)idbT().then(t=>{if(t>STO.t)adoptExternal()})});
    if(STO.recovered||STO.mig)scheduleSave();

    addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue)return;try{const o=JSON.parse(e.newValue);if(o&&o.s&&(o.t||0)>(C.state._t||0)){clearTimeout(saveT);adopt(o);C.refresh();C.toast('Se actualizó con los cambios de otra ventana.')}}catch(x){}})}
  C.refresh();
}
async function boot(){
  const legacy=readLegacy();
  try{
    STO.db=await idbOpen();STO.mode='idb';
    try{const ix=await rq(STO.db.transaction('kv','readonly').objectStore('kv').get('bak:idx')),ld=(ix||[]).filter(x=>x.kind==='d').sort((x,y)=>y.t-x.t)[0];if(ld)STO.lastBak=hoyLocal(ld.t)}catch(e){}      // la copia del día es una por día, no una por cada vez que se abre
    const cur=await idbLoad(),hot=readHot();
    if(cur){const f=fromStored(cur,hot);adopt(f.o);STO.t=f.t;STO.sig=f.sig;STO.clen=f.clen;STO.mlen=f.mlen}
    else if(legacy){adopt(legacy.o);STO.mig=true;                      // primera vez con IndexedDB: se pasa todo lo guardado antes
      try{localStorage.setItem('cuadre.mig',String(Date.now()))}catch(e){}}
    else if(hot){try{const o=JSON.parse(hot.meta);if(o&&o.s){o.d&&(o.d.movs=[]);adopt(o);Object.keys(hot.chunks||{}).forEach(k=>{try{JSON.parse(hot.chunks[k]).forEach(m=>D.movs.push(m))}catch(e){}});STO.recovered=true}}catch(e){}}
    // el respaldo viejo (localStorage) se borra 14 días después de pasar a IndexedDB, cuando ya no hace falta
    try{const mg=+localStorage.getItem('cuadre.mig');if(mg&&cur&&Date.now()-mg>14*DAY){localStorage.removeItem(KEY);localStorage.removeItem('cuadre.mig')}}catch(e){}
  }catch(e){
    console.error('Cuadre: IndexedDB no disponible, se usa localStorage',e);STO.mode='ls';STO.db=null;
    if(legacy){adopt(legacy.o);lastSize=legacy.size}
  }
  booted();
}

/* ---- plan: Gratis, prueba de 7 días y Pro ---- */
/* licencia (código de activación atado a la cuenta de Google): vale si no venció y, con la cuenta conectada, si es la misma cuenta */
const normMail=e=>{e=String(e||'').trim().toLowerCase();const m=e.match(/^([^@]+)@(gmail\.com|googlemail\.com)$/);return m?m[1].split('+')[0].replace(/\./g,'')+'@gmail.com':e};
C.normMail=normMail;
/* Dos casillas, cada una con su código firmado y atada a la cuenta de Google:
   · state.lic   = Pro (suscripción mensual/anual; vence)
   · state.licPc = versión para PC (para siempre; su «until» es hasta cuándo trae Pro incluido; 0 = sin límite) */
const mailOk=L=>{const K=C.state.cloud;return !(K&&K.on&&K.email&&normMail(K.email)!==L.email)};
const licOk=()=>{const L=C.state.lic;if(!L||L.plan!=='pro'||!L.code)return null;if(L.until&&L.until<Date.now())return null;return mailOk(L)?L:null};
const pcOk=()=>{const P=C.state.licPc;if(!P||P.plan!=='pc'||!P.code)return null;return mailOk(P)?P:null};
const pcProOk=()=>{const P=pcOk();return P&&(!P.until||P.until>Date.now())?P:null};
C.licSlots=()=>({pro:licOk(),pc:pcOk()});
/* Pro que está valiendo ahora (el de la suscripción o el que trae la versión PC; el que dure más) */
C.licInfo=()=>{const L=licOk(),P=pcProOk();
  const x=L&&P?(!L.until||(P.until&&L.until>=P.until)?L:P):(L||P);
  return x?{plan:'pro',email:x.email,until:x.until||0,via:x.via||'',sku:x.sku||'',code:x.code||'',incl:x===P&&x!==L}:null};
/* la versión para PC (sigue valiendo aunque se acabe el mes de Pro que trae) */
C.pcInfo=()=>{const P=pcOk();return P?{email:P.email,proUntil:P.until||0,via:P.via||'',sku:P.sku||'',code:P.code||'',proActivo:!!pcProOk()}:null};
C.isPro=()=>{const s=C.state,dv=DEVOK?s.devPlan:null;if(dv==='pro'||dv==='pc')return true;if(dv==='free')return false;if(licOk()||pcProOk())return true;return s.trialEnd>Date.now()};
/* ¿puede usar la versión de computadora? Durante la prueba sí; después, con la versión para PC (o si PLAN.pcGratis) */
C.hasPC=()=>{const s=C.state,dv=DEVOK?s.devPlan:null;if(PLAN.pcGratis||dv==='pc')return true;if(dv==='pro'||dv==='free')return false;if(pcOk())return true;return s.trialEnd>Date.now()};
/* La PC con plan se vuelve a comprobar con la cuenta de Google: cada contacto con tu Drive (o activar el código) anota la hora.
   Si pasan más de PLAN.pcSinInternetDias días sin contacto, pide conectarse. Es solo de este equipo (no viaja en las copias). */
const pcVista=()=>{const K=C.state.cloud;return (K&&K.vOk)||0};
C.pcVerif=()=>{const d=PLAN.pcSinInternetDias|0,P=pcOk();
  if(!P||!d)return {ok:true,dias:d,faltan:d,desde:0};
  let v=pcVista();if(!v){v=Date.now();(C.state.cloud||(C.state.cloud=ST0().cloud)).vOk=v}            // primera vez que se ve: el margen empieza ahora
  const left=v+d*DAY-Date.now();return {ok:left>0,dias:d,faltan:Math.max(0,Math.ceil(left/DAY)),desde:v}};
/* estado de la computadora: ok · nada (sin cuenta de Google) · sin (cuenta sin la versión para PC) · otra (la PC es de otra cuenta) · verif (hay que conectarse) */
C.pcEstado=()=>{const s=C.state,dv=DEVOK?s.devPlan:null,K=s.cloud,con=!!(K&&K.on&&K.email);
  if(C.hasPC()){if(PLAN.pcGratis||dv==='pc'||s.trialEnd>Date.now()||!pcOk())return 'ok';return C.pcVerif().ok?'ok':'verif'}
  const P=s.licPc;if(P&&P.code&&!mailOk(P))return 'otra';return con?'sin':'nada'};
C.maskMail=e=>{e=String(e||'');const i=e.indexOf('@');if(i<1)return e;return e.slice(0,Math.min(2,i))+'•••'+e.slice(i)};
/* enlace para escribir al vendedor ('' si aún no hay contacto en PLAN.contacto) */
C.contactoURL=msg=>{const c=PLAN.contacto||{},t=encodeURIComponent(msg||'');
  if(C.billing&&C.billing.enPlay&&C.billing.enPlay())return '';        // dentro de la app de Google Play no se ofrece ningún otro medio de pago
  if(c.whatsapp)return 'https://wa.me/'+String(c.whatsapp).replace(/\D/g,'')+(t?'?text='+t:'');
  if(c.email)return 'mailto:'+c.email+'?subject='+encodeURIComponent('Cuadre')+(t?'&body='+t:'');return ''};
C.trial=()=>{const s=C.state,left=Math.max(0,s.trialEnd-Date.now());return {active:left>0,used:s.trialUsed,daysLeft:Math.ceil(left/DAY),ends:s.trialEnd,expired:s.trialUsed&&left<=0}};
C.startTrial=()=>{const s=C.state;if(s.trialUsed)return false;s.trialUsed=true;s.trialEnd=Date.now()+PLAN.trialDays*DAY;C.emit();return true};
C.setDev=p=>{if(!DEVOK)return;C.state.devPlan=p;C.emit()};      // solo para probar y solo en localhost
C.devOk=DEVOK;
C.planName=()=>{const pro=C.isPro(),pc=!!pcOk();return pro&&pc?'Pro + Computadora':pro?'Pro':pc?'Computadora':'Gratis'};
