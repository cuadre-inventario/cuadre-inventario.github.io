   Productos
   ===================================================================== */
C.prods=()=>D?D.prods.filter(p=>p.activo!==false):[];
C.movsCount=()=>D?D.movs.length:0;
C.archived=()=>D?D.prods.filter(p=>p.activo===false):[];
C.prod=id=>D&&D.prods.find(p=>p.id===id);
/* Categorías: empiezan en cero. Solo existen las que la persona crea o elige; las del rubro son solo sugerencias. */
const CMP=new Intl.Collator('es').compare;C.cmp=CMP;      // ordenar nombres: mucho más rápido que localeCompare cuando hay miles
C.cats=()=>Array.from(new Set(C.prods().map(p=>p.cat).filter(Boolean))).sort(CMP);
C.catNom=p=>(p&&p.cat)||'Sin categoría';
C.catCanon=txt=>{const t=String(txt||'').trim().replace(/\s+/g,' ').slice(0,30);if(!t)return '';const hit=C.cats().find(c=>norm(c)===norm(t));return hit||t};
C.catsSug=()=>{const R=C.rubro(C.state.rubro),used=new Set(C.cats().map(norm));return (R.cats||[]).filter(c=>!used.has(norm(c)))};
C.sinCat=()=>C.prods().filter(p=>!p.cat).length;
/* Textos de ejemplo (el gris dentro de los campos): salen del rubro elegido; nunca de otro negocio */
const EJ0={nom:'Ej. Nombre del producto',marca:'Ej. Marca o proveedor',cat:'Ej. Escribe tu categoría',dest:'Ej. Cliente, área o uso interno',libre:'Ej. Servicio, mano de obra, flete…'};
C.ej=k=>{const R=C.rubro(C.state.rubro);return (R&&R.ej&&R.ej[k])||EJ0[k]};
C.bajo=p=>p.min>0&&p.stock<=p.min;
C.faltantes=()=>C.prods().filter(C.bajo).map(p=>({p,faltan:Math.max(0,Math.ceil((p.ideal>0?p.ideal:p.min*2)-p.stock))})).sort((a,b)=>(a.p.stock/(a.p.min||1))-(b.p.stock/(b.p.min||1)));
C.diasSin=p=>C.diasDesde(p.last||p.creado||Date.now());
C.sinMov=(minDias)=>{const lim=minDias==null?30:minDias;return C.prods().filter(p=>p.stock>0).map(p=>({p,dias:C.diasSin(p)})).filter(x=>x.dias>=lim).sort((a,b)=>b.dias-a.dias)};
const hay=p=>p._h||(p._h=norm([p.cod,p.barras,p.nom,p.marca,p.cat].join(' ')));
C.search=q=>{const ws=norm(q).split(/\s+/).filter(Boolean);if(!ws.length)return C.prods();
  const L=[];for(const p of C.prods()){const h=hay(p);if(ws.every(w=>h.includes(w)))L.push([rankP(p,ws),p])}
  return L.sort((a,b)=>a[0]-b[0]||CMP(a[1].nom,b[1].nom)).map(x=>x[1])};
function rankP(p,ws){const n=norm(p.nom),c=norm(p.cod),b=String(p.barras||'').toLowerCase();let r=3;
  if(ws.length===1){const w=ws[0];if(c===w||b===w)r=0;else if(n.startsWith(w)||norm(p.marca).startsWith(w))r=1;else if(n.includes(w))r=2}return r}
const zeroless=c=>String(c).replace(/^0+/,'');
C.byCode=code=>{code=String(code||'').trim().toLowerCase();if(!code)return null;const ps=C.prods();
  let p=ps.find(x=>x.cod.toLowerCase()===code||(x.barras&&x.barras.toLowerCase()===code));if(p)return p;
  if(/^\d{12,13}$/.test(code)){const z=zeroless(code);p=ps.find(x=>x.barras&&/^\d{12,13}$/.test(x.barras)&&zeroless(x.barras)===z)}
  return p||null};
C.margen=(costo,pv)=>costo>0?(pv-costo)/costo*100:0;
C.precioDe=(costo,pct)=>Math.round(costo*(1+pct/100)*100)/100;
/* ---- Protección de precios: UNA sola regla para toda la app ----
   Ganancia = (precio − costo) ÷ costo. El mínimo es el «% de ganancia por defecto» de Ajustes (state.margenDef).
   Pérdida  = precio por debajo del costo.  Margen bajo = ganancia menor que ese mínimo. */
C.margenMin=()=>Math.max(0,+C.state.margenDef||0);
C.precioMin=costo=>costo>0?C.precioDe(costo,C.margenMin()):0;
C.precioEstado=(costo,pv)=>{
  if(!(costo>0)||!(pv>=0))return null;
  if(pv<costo-1e-9)return {k:'perdida',por:Math.round((costo-pv)*100)/100,sug:C.precioMin(costo)};
  const m=C.margen(costo,pv),min=C.margenMin();
  if(min>0&&m<min-0.5)return {k:'bajo',m,min,sug:C.precioMin(costo)};
  return null};
C.enRiesgo=()=>C.prods().map(p=>({p,e:C.precioEstado(p.costo,p.pv)})).filter(x=>x.e);
C.bloqueaPerdida=()=>!!C.state.noPerdida;
C.valorBodega=()=>C.prods().reduce((a,p)=>a+Math.max(0,p.stock)*p.costo,0);
C.valorVenta=()=>C.prods().reduce((a,p)=>a+Math.max(0,p.stock)*(p.pv||0),0);
C.codePrefix=()=>{const id=(C.state.rubro||'otro');return (norm(id).replace(/[^a-z]/g,'')+'ITM').slice(0,3).toUpperCase()};
C.dupBarras=(barras,exceptId)=>{const b=String(barras||'').trim().toLowerCase();if(!b)return null;return D.prods.find(p=>p.id!==exceptId&&p.activo!==false&&p.barras&&p.barras.toLowerCase()===b)||null};
C.addProd=o=>{
  if(!D)return {ok:false,reason:'vacio'};
  const nom=String(o.nom||'').trim();if(!nom)return {ok:false,reason:'nombre'};
  const dup=C.dupBarras(o.barras);if(dup)return {ok:false,reason:'dup',p:dup};
  if(!C.puedeCrear())return {ok:false,reason:'limite'};
  const id=D.seqs.prod++,now=Date.now();
  /* el código automático nunca repite uno que ya existe (por ejemplo uno importado desde Excel) */
  let ck=id,cod;do{cod=C.codePrefix()+'-'+String(ck++).padStart(3,'0')}while(D.prods.some(x=>String(x.cod||'').toLowerCase()===cod.toLowerCase()));
  const p={id,cod,barras:String(o.barras||'').trim(),nom,marca:String(o.marca||'').trim(),cat:C.catCanon(o.cat),u:o.u||'und',
    pv:+o.pv||0,costo:+o.costo||0,stock:0,min:+o.min||0,ideal:+o.ideal||0,activo:true,creado:now,last:now,uid:UID()};
  if(o.ej)p.ej=true;if(o.img)p.img=String(o.img);
  D.prods.push(p);
  const st=+o.stock||0;
  if(st>0){D.movs.push({id:D.seqs.mov++,t:now,tipo:'ingreso',pid:id,nom:p.nom,u:p.u,q:st,pv:0,costo:p.costo,antes:0,despues:st,nota:'Stock inicial',b:D.seqs.b++,uid:UID()});p.stock=st}
  D.undo=null;C.emit();return {ok:true,p};
};
C.updateProd=(id,patch)=>{const p=C.prod(id);if(!p)return null;
  const keys=['nom','marca','cat','u','pv','costo','min','ideal','barras'];
  keys.forEach(k=>{if(patch[k]!==undefined)p[k]=k==='cat'?C.catCanon(patch[k]):(k==='nom'||k==='marca'||k==='u'||k==='barras')?String(patch[k]).trim():+patch[k]||0});delete p._h;
  if(patch.img!==undefined){if(patch.img)p.img=String(patch.img);else delete p.img}
  if(!p.nom)p.nom='Producto';C.emit();return p};
C.archiveProd=(id,on)=>{const p=C.prod(id);if(!p)return;p.activo=on===false?true:false;C.emit()};
C.deleteProd=id=>{const i=D.prods.findIndex(p=>p.id===id);if(i<0)return false;if(D.movs.some(m=>m.pid===id)){C.archiveProd(id);return 'archivado'}tomb('p',D.prods[i]);D.prods.splice(i,1);C.emit();return true};
/* productos de ejemplo del rubro (marcados con ej para poder quitarlos todos) */
C.cargarEjemplos=()=>{
  const R=C.rubro(C.state.rubro);let n=0;
  R.items.forEach(it=>{if(D.prods.some(p=>p.ej&&p.nom===it.nom))return;
    const r=C.addProd({nom:it.nom,cat:it.cat,u:it.u,pv:it.pv,costo:it.costo,stock:it.stock,min:it.min,ideal:it.ideal,ej:true});if(r.ok)n++});
  return n};
C.hayEjemplos=()=>!!D&&D.prods.some(p=>p.ej);
C.quitarEjemplos=()=>{const ids=new Set(D.prods.filter(p=>p.ej).map(p=>p.id));if(!ids.size)return 0;D.prods.forEach(p=>{if(ids.has(p.id))tomb('p',p)});D.movs.forEach(m=>{if(ids.has(m.pid))tomb('m',m)});
  D.prods=D.prods.filter(p=>!ids.has(p.id));D.movs=D.movs.filter(m=>!ids.has(m.pid));D.undo=null;C.emit();return ids.size};

/* =====================================================================
   Movimientos (ventas, ingresos, salidas, ajustes) · todo sale de aquí
   ===================================================================== */
/* tipo: 'venta' | 'ingreso' | 'salida'. lines: [{pid,q,pv?}] */
C.mov=(tipo,lines,o)=>{
  if(!D)return {ok:false};o=o||{};
  const b=D.seqs.b++,now=Date.now(),done=[],nro=D.seqs[tipo]||1;   /* nro: número propio de cada tipo (Venta N.º 1, 2, 3…) */
  for(const l of lines){const p=C.prod(l.pid);if(!p||!(l.q>0))continue;
    if(tipo!=='ingreso'&&l.q>p.stock+1e-9&&!o.force)return rollback(done,{ok:false,reason:'stock',p});
    const antes=p.stock,despues=r3(tipo==='ingreso'?antes+l.q:antes-l.q);
    let cAntes=null;if(tipo==='ingreso'&&l.costo>0&&Math.abs(l.costo-p.costo)>1e-9){cAntes=p.costo;p.costo=l.costo}   /* ingreso con costo nuevo: el producto queda con el último costo */
    const m={id:D.seqs.mov++,t:now,tipo,pid:p.id,nom:p.nom,u:p.u,q:l.q,pv:tipo==='venta'?(l.pv!=null?+l.pv:p.pv):0,costo:p.costo,antes,despues,nota:o.nota||'',b,nro,uid:UID()};
    p.stock=despues;p.last=now;D.movs.push(m);
    done.push({m,p,antes,despues,cAntes,low:C.bajo(p)&&tipo!=='ingreso',cero:despues<=0});
  }
  if(!done.length)return {ok:false,reason:'vacio'};
  D.seqs[tipo]=nro+1;
  D.undo=done.map(x=>({id:x.m.id,pid:x.p.id,antes:x.antes,costoAntes:x.cAntes,tipo,nro}));C.emit();return {ok:true,done,b,nro};
};
function rollback(done,res){done.slice().reverse().forEach(x=>{x.p.stock=x.antes;if(x.cAntes!=null)x.p.costo=x.cAntes;const i=D.movs.lastIndexOf(x.m);if(i>=0)D.movs.splice(i,1)});return res}
C.ajustar=(pid,nuevo,nota)=>{const p=C.prod(pid);if(!p)return {ok:false};nuevo=r3(Math.max(0,+nuevo||0));if(nuevo===p.stock)return {ok:true,igual:true};
  const antes=p.stock,now=Date.now();
  D.movs.push({id:D.seqs.mov++,t:now,tipo:'ajuste',pid:p.id,nom:p.nom,u:p.u,q:Math.abs(r3(nuevo-antes)),pv:0,costo:p.costo,antes,despues:nuevo,nota:nota||'Corrección de stock',b:D.seqs.b++,uid:UID()});
  p.stock=nuevo;p.last=now;D.undo=null;C.emit();return {ok:true,antes,despues:nuevo}};
C.undo=()=>{if(!D||!D.undo||!D.undo.length)return false;
  D.undo.slice().reverse().forEach(u=>{if(u.tipo&&D.seqs[u.tipo]===u.nro+1)D.seqs[u.tipo]=u.nro;const p=C.prod(u.pid);if(p){p.stock=u.antes;if(u.costoAntes!=null)p.costo=u.costoAntes}const i=D.movs.findIndex(m=>m.id===u.id);if(i>=0){tomb('m',D.movs[i]);D.movs.splice(i,1)}});
  D.prods.forEach(p=>{const l=lastMov(p.id);p.last=l?l.t:p.creado});D.undo=null;C.emit();return true};
function lastMov(pid){for(let i=D.movs.length-1;i>=0;i--)if(D.movs[i].pid===pid)return D.movs[i];return null}
const decor=m=>Object.assign({p:C.prod(m.pid)},m);
C.movs=(n,f)=>{if(!D)return [];f=f||{};const out=[],q=norm(f.q||'');
  for(let i=D.movs.length-1;i>=0&&out.length<(n||20);i--){const m=D.movs[i];
    if(f.tipo&&m.tipo!==f.tipo)continue;if(f.pid&&m.pid!==f.pid)continue;if(q&&!norm(m.nom).includes(q))continue;out.push(decor(m))}
  return out};
C.movCount=()=>D?D.movs.length:0;
C.kardex=pid=>{if(!D)return [];return C.movs(500,{pid}).map(m=>{
  const ent=(m.tipo==='ingreso'||(m.tipo==='ajuste'&&m.despues>m.antes))?m.q:0,sal=(m.tipo==='venta'||m.tipo==='salida'||(m.tipo==='ajuste'&&m.despues<m.antes))?m.q:0;
  return {t:m.t,tipo:({venta:'Venta',ingreso:'Ingreso',salida:'Salida',ajuste:'Ajuste'})[m.tipo],ent,sal,saldo:m.despues,nota:m.nota||'',fecha:C.fechaCorta(m.t),hora:C.hora(m.t)}})};
/* totales por producto para la tabla de Productos: unidades que han entrado (ingresos)
   y unidades que han salido (egresos = ventas, salidas sin cobrar y ajustes a la baja) */
C.flujo=()=>{const F=new Map();if(!D)return F;
  for(const m of D.movs){let f=F.get(m.pid);if(!f){f={i:0,e:0};F.set(m.pid,f)}
    if(m.tipo==='ingreso'||(m.tipo==='ajuste'&&m.despues>m.antes))f.i+=m.q;
    else if(m.tipo==='venta'||m.tipo==='salida'||(m.tipo==='ajuste'&&m.despues<m.antes))f.e+=m.q}
  F.forEach(f=>{f.i=r3(f.i);f.e=r3(f.e)});return F};
C.tipoNom=t=>({venta:'Venta',ingreso:'Ingreso',salida:'Salida sin cobrar',ajuste:'Ajuste'})[t]||t;

/* ---- estadísticas: salen de los movimientos ---- */
/* periodRange(k, ref): el período «hoy | semana | mes | anio» que contiene la fecha ref (sin ref = ahora).
   a..b = lo que ya pasó del período (si es el actual llega hasta ahora), e = su fin natural, cur = ¿es el período en curso?
   pa..pb = el período anterior para comparar (si el actual sigue abierto, solo el mismo tramo del anterior). */
function periodRange(k,ref){
  const now=Date.now(),R=ref==null?now:Math.min(+ref,now),d0=startDay(R),d=new Date(R),y=d.getFullYear(),mo=d.getMonth();
  let a,e,pa,pe;
  if(k==='hoy'){a=d0;e=addDays(d0,1)-1;pa=addDays(d0,-1);pe=a-1}
  else if(k==='semana'){a=addDays(d0,-((d.getDay()+6)%7));e=addDays(a,7)-1;pa=addDays(a,-7);pe=a-1}
  else if(k==='mes'){a=new Date(y,mo,1).getTime();e=new Date(y,mo+1,1).getTime()-1;pa=new Date(y,mo-1,1).getTime();pe=a-1}
  else{a=new Date(y,0,1).getTime();e=new Date(y+1,0,1).getTime()-1;pa=null;pe=null}
  const b=Math.min(e,now),cur=now<=e;
  return {a,b,e,cur,pa,pb:pa==null?null:cur?Math.min(pa+(b-a),pe):pe};
}
C.rango=periodRange;
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
/* hasta dónde se puede retroceder: el 1 de enero del año del primer movimiento */
let refMinC={n:-1,t:0};
C.refMin=()=>{const n=D?D.movs.length:0;if(refMinC.n!==n){let f=Date.now();if(D)for(const m of D.movs)if(m.t<f)f=m.t;refMinC={n,t:new Date(new Date(f).getFullYear(),0,1).getTime()}}return refMinC.t};
/* mueve la fecha de referencia un día / semana / mes / año; devuelve null cuando vuelve a «hoy» */
C.refShift=(k,ref,dir)=>{const now=Date.now(),R=ref==null?now:Math.min(+ref,now),d=new Date(R),Y=d.getFullYear(),M=d.getMonth(),D0=d.getDate();let t;
  if(k==='hoy')t=new Date(Y,M,D0+dir).getTime();
  else if(k==='semana')t=new Date(Y,M,D0+7*dir).getTime();
  else if(k==='mes')t=new Date(Y,M+dir,Math.min(D0,new Date(Y,M+dir+1,0).getDate())).getTime();
  else t=new Date(Y+dir,M,Math.min(D0,new Date(Y+dir,M+1,0).getDate())).getTime();
  return t>=startDay(now)?null:Math.max(t,C.refMin())};
/* ¿se puede ir al período anterior (dir -1) o al siguiente (dir 1)? */
C.refCan=(k,ref,dir)=>{const r=periodRange(k,ref);return dir<0?r.a>C.refMin():!r.cur};
/* nombre corto de un período que ya pasó («Vie 23 oct», «14–20 sep», «Septiembre», «2025»); null si es el actual */
C.perEtq=(k,ref)=>{const r=periodRange(k,ref);if(r.cur)return null;const a=new Date(r.a),e=new Date(r.e),y=new Date().getFullYear();
  if(k==='hoy')return cap(C.fechaLarga(r.a))+(a.getFullYear()!==y?' '+a.getFullYear():'');
  if(k==='semana')return (a.getMonth()===e.getMonth()?a.getDate()+'–'+e.getDate()+' '+MON[e.getMonth()]:a.getDate()+' '+MON[a.getMonth()]+' – '+e.getDate()+' '+MON[e.getMonth()])+(e.getFullYear()!==y?' '+e.getFullYear():'');
  if(k==='mes')return cap(MESES[a.getMonth()])+(a.getFullYear()!==y?' '+a.getFullYear():'');
  return String(a.getFullYear())};
function sumVentas(a,b){let total=0,uds=0,costo=0;const bs=new Set();
  if(D)for(let i=D.movs.length-1;i>=0;i--){const m=D.movs[i];if(m.t<a)break;if(m.tipo!=='venta'||m.t>b)continue;total+=m.q*m.pv;uds+=m.q;costo+=m.q*(m.costo||0);bs.add(m.b)}
  return {total,uds,costo,n:bs.size}}
C.sales=(k,ref)=>{const r=periodRange(k,ref),cur=sumVentas(r.a,r.b),prev=r.pa!=null?sumVentas(r.pa,r.pb):null;
  return {total:cur.total,uds:cur.uds,costo:cur.costo,ganancia:cur.total-cur.costo,n:cur.n,ticket:cur.n?cur.total/cur.n:0,prev:prev?prev.total:null,
    delta:prev&&prev.total>0?(cur.total-prev.total)/prev.total*100:null}};
/* Tendencia de un período frente al anterior, comparando solo el mismo tramo (hasta la misma hora / día).
   Devuelve null cuando el % no diría nada: no hubo ventas antes, o el período apenas empezó
   (primeras horas del día, primer día de la semana, primera semana del mes) y saldría un «-98 %» engañoso. */
C.trend=(k,ref)=>{const r=periodRange(k,ref);let pa=r.pa,pb=r.pb;
  if(k==='anio'){const y=new Date(r.a).getFullYear();pa=new Date(y-1,0,1).getTime();pb=Math.min(pa+(r.b-r.a),r.a-1)}
  if(pa==null)return null;
  const prev=sumVentas(pa,pb);if(!(prev.total>0))return null;
  const frac=(r.b-r.a)/(r.e-r.a),min={hoy:.4,semana:.25,mes:.25,anio:.25}[k]||.25;
  if(r.cur&&frac<min)return null;
  const cur=sumVentas(r.a,r.b);
  return {d:Math.max(-999,Math.min(999,(cur.total-prev.total)/prev.total*100)),prev:prev.total,cur:cur.total}};
/* Resumen de un período (lo que abre al tocar Hoy / Semana / Mes / Año):
   ventas, costo de lo vendido, ganancia de las ventas, lo que salió sin cobrar (a costo) y la ganancia neta real. */
C.resumen=(k,ref)=>{
  const r=periodRange(k,ref);let ventas=0,costo=0,uds=0,sinCosto=0,sc=0,scUds=0;const bs=new Set(),por={};
  if(D)for(let i=D.movs.length-1;i>=0;i--){const m=D.movs[i];if(m.t<r.a)break;if(m.t>r.b)continue;
    if(m.tipo==='venta'){const imp=m.q*m.pv,c=m.q*(m.costo||0);ventas+=imp;costo+=c;uds+=m.q;bs.add(m.b);if(!(m.costo>0))sinCosto++;
      const x=por[m.pid]||(por[m.pid]={nom:m.nom,q:0,imp:0,gan:0,u:m.u});x.q+=m.q;x.imp+=imp;x.gan+=imp-c}
    else if(m.tipo==='salida'){sc+=m.q*(m.costo||0);scUds+=m.q}}
  const bruta=ventas-costo,neta=bruta-sc,prev=r.pa!=null?sumVentas(r.pa,r.pb):null;
  const top=Object.keys(por).map(id=>por[id]).sort((a,b)=>b.gan-a.gan)[0]||null;
  return {k,ventas,costo,bruta,salidasCosto:sc,salidasUds:scUds,neta,uds,n:bs.size,ticket:bs.size?ventas/bs.size:0,
    margen:ventas>0?bruta/ventas*100:null,sinCosto,top,prevVentas:prev?prev.total:null,delta:prev&&prev.total>0?(ventas-prev.total)/prev.total*100:null}};
C.verRanking=k=>C.isPro()||PLAN.rankingGratis.includes(k);
C.verGanancia=k=>C.isPro()||PLAN.gananciaGratis.includes(k);
C.top=(k,dir,n,ref)=>{const r=periodRange(k,ref),q={};
  if(D)for(let i=D.movs.length-1;i>=0;i--){const m=D.movs[i];if(m.t<r.a)break;if(m.tipo==='venta'&&m.t<=r.b)q[m.pid]=(q[m.pid]||0)+m.q}
  let rows=C.prods().map(p=>({p,q:q[p.id]||0,imp:0,gan:0}));
  if(D)for(let i=D.movs.length-1;i>=0;i--){const m=D.movs[i];if(m.t<r.a)break;if(m.tipo!=='venta'||m.t>r.b)continue;const x=rows.find(y=>y.p.id===m.pid);if(x){x.imp+=m.q*m.pv;x.gan+=m.q*(m.pv-(m.costo||0))}}

  const now=Date.now(),t0=startDay(now),R=ref==null?now:Math.min(+ref,now),d0=startDay(R),out=[];
  const add=(a,b,fn)=>{if(D)for(let i=D.movs.length-1;i>=0;i--){const m=D.movs[i];if(m.t<a)break;if(m.tipo==='venta'&&m.t<=b)fn(m)}};
  if(k==='anio'){const y=new Date(R).getFullYear(),cm=new Date(R).getMonth(),cy=new Date(now).getFullYear(),nm=new Date(now).getMonth();
    for(let m=0;m<12;m++)out.push({lab:'EFMAMJJASOND'[m],v:0,now:m===cm,fut:y>cy||(y===cy&&m>nm)});
    add(new Date(y,0,1).getTime(),new Date(y+1,0,1).getTime()-1,m=>{out[new Date(m.t).getMonth()].v+=m.q*m.pv});return out}
  let a,n;
  if(k==='semana'){a=addDays(d0,-((new Date(R).getDay()+6)%7));n=7}
  else if(k==='mes'){const d=new Date(R);a=new Date(d.getFullYear(),d.getMonth(),1).getTime();const dn=new Date(now);n=d.getFullYear()===dn.getFullYear()&&d.getMonth()===dn.getMonth()?dn.getDate():new Date(d.getFullYear(),d.getMonth()+1,0).getDate()}
  else{a=addDays(d0,-6);n=7}
  for(let i=0;i<n;i++){const t=addDays(a,i),dt=new Date(t);out.push({lab:(k==='mes')?String(dt.getDate()):['D','L','M','X','J','V','S'][dt.getDay()],v:0,now:t===d0,fut:t>t0})}
  add(a,addDays(a,n)-1,m=>{const i=Math.floor((startDay(m.t)-a)/DAY+0.5);if(out[i])out[i].v+=m.q*m.pv});return out;
};

C.deliver=async(blob,name,how)=>{

    if(how==='share'){const file=new File([blob],name,{type:blob.type});
      if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return 'shared'}catch(e){if(e&&e.name==='AbortError')return 'cancel'}}
      how='open'}
    if(how==='open'){const url=URL.createObjectURL(blob),w=window.open(url,'_blank');if(w){setTimeout(()=>URL.revokeObjectURL(url),120000);return 'opened'}URL.revokeObjectURL(url);how='download'}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.rel='noopener';document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);return 'downloaded';
  }catch(e){console.error(e);return 'error'}

const enc=new TextEncoder();
const b64=u8=>{let s='';u8.forEach(b=>s+=String.fromCharCode(b));return btoa(s)};

function sha256(bytes){ /* respaldo en JS puro (si el navegador no tiene crypto.subtle, p. ej. al abrir el archivo suelto) */

  const H=[];for(let i=2,n=0;n<8;i++){let p=1;for(let j=2;j*j<=i;j++)if(i%j===0){p=0;break}if(p){H[n++]=(Math.pow(i,.5)%1*4294967296)|0}}
  const l=bytes.length,nb=((l+9+63)>>6)<<6,m=new Uint8Array(nb);m.set(bytes);m[l]=128;const dv=new DataView(m.buffer);dv.setUint32(nb-4,l*8>>>0);dv.setUint32(nb-8,Math.floor(l*8/4294967296));
  const w=new Array(64),rr=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<nb;o+=64){for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){const a=w[i-15],b=w[i-2];w[i]=(w[i-16]+(rr(a,7)^rr(a,18)^(a>>>3))+w[i-7]+(rr(b,17)^rr(b,19)^(b>>>10)))|0}
    let [a,b,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){const t1=(h+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0,t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&b)^(a&c)^(b&c)))|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0}
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0}

async function derive(pin,salt,it,alg){
  if(alg==='pbkdf2'&&window.crypto&&crypto.subtle){
    const key=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},key,256))}

C.pin={
  has:()=>!!C.state.pin,
  len:()=>C.state.pin?C.state.pin.len:4,

    const alg=(window.crypto&&crypto.subtle)?'pbkdf2':'sha',it=alg==='pbkdf2'?150000:4000,salt=crypto.getRandomValues(new Uint8Array(16)),h=await derive(pin,salt,it,alg);

    C.state.pin={salt:b64(salt),hash:b64(h),it,alg,len:pin.length};if(rec)C.state.pin.rec=rec;C.state.pinFail={n:0,until:0};C.emit();C.save();return true},
  /* Clave de recuperación: 12 letras/números (sin 0, O, 1, I). Se muestra UNA vez; aquí solo queda su huella (hash). */
  hasRec:()=>!!(C.state.pin&&C.state.pin.rec),
  async newRec(){if(!C.state.pin)return null;
    const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(12));let k='';for(let i=0;i<12;i++)k+=A[r[i]%32];
    const alg=(window.crypto&&crypto.subtle)?'pbkdf2':'sha',it=alg==='pbkdf2'?150000:4000,salt=crypto.getRandomValues(new Uint8Array(16)),h=await derive(k,salt,it,alg);

  async checkRec(txt){const s=C.state,p=s.pin;if(!p||!p.rec)return {ok:false,sin:true};
    const f=s.recFail||(s.recFail={n:0,until:0}),wait=f.until-Date.now();if(wait>0)return {ok:false,wait:Math.ceil(wait/1000)};
    const k=String(txt||'').toUpperCase().replace(/[^A-Z0-9]/g,'');let h;
    try{h=await derive(k,unb64(p.rec.salt),p.rec.it,p.rec.alg)}catch(e){return {ok:false,error:true}}
    if(k.length===12&&eq(h,unb64(p.rec.hash))){s.recFail={n:0,until:0};C.emit();return {ok:true}}
    f.n++;if(f.n>=5){const j=f.n-5;f.until=Date.now()+Math.min(900,60*Math.pow(2,j))*1000}
    C.emit();C.save();return {ok:false,left:Math.max(0,5-f.n),wait:Math.max(0,Math.ceil((f.until-Date.now())/1000))}},
  async check(pin){const s=C.state;if(!s.pin)return {ok:true};
    const wait=s.pinFail.until-Date.now();if(wait>0)return {ok:false,wait:Math.ceil(wait/1000)};
    let h;try{h=await derive(pin,unb64(s.pin.salt),s.pin.it,s.pin.alg)}catch(e){return {ok:false,error:true}}
    if(eq(h,unb64(s.pin.hash))){s.pinFail={n:0,until:0};C.emit();return {ok:true}}
    s.pinFail.n++;if(s.pinFail.n>=5){const k=s.pinFail.n-5,secs=Math.min(300,30*Math.pow(2,k));s.pinFail.until=Date.now()+secs*1000}

/* Huella o rostro: usa el sensor del teléfono (WebAuthn, credencial de plataforma). Es una entrada más rápida;
   la clave sigue siendo el respaldo y lo que protege de verdad. La credencial no sale del teléfono. */
C.bio={
  ok:false,   /* ¿este teléfono puede? (se calcula al abrir) */
  supported:()=>!!(window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext),
  async available(){try{return C.bio.supported()&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()}catch(e){return false}},
  on:()=>!!(C.state.pin&&C.state.bio&&C.state.bio.id),
  async enable(){
    if(!C.state.pin)return {ok:false,msg:'Primero pon una clave.'};
    if(!(await C.bio.available()))return {ok:false,msg:'Este teléfono no tiene huella o bloqueo de pantalla configurado.'};
    try{
      const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Cuadre'},
        user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'cuadre',displayName:'Cuadre'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
        authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000,attestation:'none'}});
      C.state.bio={id:b64(new Uint8Array(cred.rawId))};C.emit();C.save();return {ok:true}
    }catch(e){const c=e&&(e.name==='NotAllowedError'||e.name==='AbortError');return {ok:false,cancel:c,msg:c?'No se activó la huella (lo cancelaste o se acabó el tiempo).':'No pude activar la huella en este teléfono.'}}
  },
  async check(){
    if(!C.bio.on())return {ok:false,msg:'La huella no está activada.'};
    try{
      await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),timeout:60000,userVerification:'required',
        allowCredentials:[{type:'public-key',id:unb64(C.state.bio.id)}]}});
      return {ok:true}
    }catch(e){const c=e&&(e.name==='NotAllowedError'||e.name==='AbortError');return {ok:false,cancel:c,msg:c?'':'No se pudo con la huella. Usa tu clave.'}}
  },
  disable(){C.state.bio=null;C.emit();C.save()}
};

/* ---- Proteger ganancias y costos ----
   Con la opción activada, las ganancias y los costos salen ocultos hasta que se confirma con la huella (o la clave).
   Se piden una vez y quedan a la vista unos minutos (C.GV_MIN); luego vuelven a ocultarse solos. No se guarda en disco: al cerrar la app vuelven a estar ocultos. */
C.GV_MIN=5;let gvUntil=0,gvT=0;
C.gvOn=()=>!!(C.state.protGan&&C.state.pin);                /* ¿la protección está activada (y hay clave que la sostenga)? */
C.gv=()=>!C.gvOn()||Date.now()<gvUntil;                     /* ¿se pueden ver ahora costos y ganancias? */
C.gvLeft=()=>C.gvOn()?Math.max(0,gvUntil-Date.now()):0;
C.gvOpen=()=>{gvUntil=Date.now()+C.GV_MIN*60000;clearTimeout(gvT);gvT=setTimeout(()=>{gvUntil=0;C.emit()},C.GV_MIN*60000+80);C.emit()};
C.gvClose=()=>{gvUntil=0;clearTimeout(gvT);C.emit()};
C.gvSet=on=>{C.state.protGan=!!on&&!!C.state.pin;gvUntil=0;clearTimeout(gvT);C.emit();C.save()};
/* «Olvidé mi clave»: la única salida es borrar los datos de este teléfono (o restaurar una copia) */
C.wipe=()=>{C.reset()};

/* =====================================================================
   Módulos Pro: entregas con firma · préstamos y alquileres · firma del negocio

C.MODS=[
  {id:'entregas',nom:'Entrega con firma de quien recibe',desc:'Cuando sacas productos sin cobrar (a un empleado, un cliente o un área), quien los recibe firma con el dedo en la pantalla y sale un comprobante en PDF.'},
  {id:'prestamos',nom:'Préstamos y alquileres',desc:'Para lo que prestas o alquilas y te devuelven: herramientas, equipos, uniformes. Anotas a quién y hasta cuándo (y el precio por día si alquilas) y te avisa cuando algo no volvió.'}];
C.modOn=id=>C.isPro()&&!!(C.state.mods&&C.state.mods[id]);
C.setMod=(id,on)=>{C.state.mods=Object.assign({entregas:false,prestamos:false},C.state.mods);C.state.mods[id]=!!on;C.emit()};
const EN=()=>D.entregas||(D.entregas=[]),PR=()=>D.prestamos||(D.prestamos=[]);
const seqOf=k=>{D.seqs[k]=D.seqs[k]||1;return D.seqs[k]++};
const r2=x=>Math.round(x*100)/100;

/* o: {quien, destino, nota, lines:[{pid,q}]} → saca el stock y deja el registro (la firma se agrega después) */
C.entregaNew=o=>{

/* ---------- préstamos y alquileres ---------- */
C.prestamos=()=>D?PR().slice().sort((a,b)=>b.t-a.t):[];
C.prestamo=id=>D&&PR().find(x=>x.id===id);
C.prestPend=p=>Math.max(0,Math.round((p.q-(p.qdev||0))*1000)/1000);
C.prestEstado=p=>C.prestPend(p)<=0?'devuelto':(p.vence&&p.vence<startDay(Date.now())?'atrasado':'afuera');
C.prestAtrasados=()=>D?PR().filter(p=>C.prestEstado(p)==='atrasado'):[];
C.prestAfuera=()=>D?PR().filter(p=>C.prestEstado(p)!=='devuelto'):[];
C.prestDias=(p,fin)=>Math.max(1,Math.round((startDay(fin||Date.now())-startDay(p.t))/DAY)+1);
/* lo que corresponde cobrar por alquiler (si hay precio por día) de una cantidad, hasta hoy */
C.prestCobro=(p,q)=>p.precioDia>0?r2(C.prestDias(p)*p.precioDia*(q==null?C.prestPend(p):q)):0;
/* o: {pid, q, quien, tel, vence (ms, opcional), precioDia (opcional), nota} */
C.prestamoNew=o=>{
  if(!D)return {ok:false};
  const quien=String(o.quien||'').trim();if(!quien)return {ok:false,reason:'quien'};
  const p=C.prod(o.pid);if(!p)return {ok:false,reason:'producto'};const q=+o.q||0;if(!(q>0))return {ok:false,reason:'cantidad'};
  const r=C.mov('salida',[{pid:p.id,q}],{nota:'Préstamo a '+quien});if(!r.ok)return r;
  const id=seqOf('pr');
  const x={id,num:'PRE-'+String(id).padStart(4,'0'),t:Date.now(),b:r.b,pid:p.id,nom:p.nom,u:p.u,q,qdev:0,quien,tel:String(o.tel||'').trim(),vence:+o.vence||0,precioDia:+o.precioDia||0,nota:String(o.nota||'').trim(),cobrado:0,devs:[]};
  PR().push(x);D.undo=null;C.emit();return {ok:true,p:x,done:r.done};
};
C.prestamoDevolver=(id,q)=>{const x=C.prestamo(id);if(!x)return {ok:false};
  const pend=C.prestPend(x);q=q==null?pend:Math.min(pend,+q||0);if(!(q>0))return {ok:false,reason:'cantidad'};
  const cobro=C.prestCobro(x,q);
  if(C.prod(x.pid))C.mov('ingreso',[{pid:x.pid,q}],{nota:'Devolución de '+x.quien});
  x.qdev=Math.round(((x.qdev||0)+q)*1000)/1000;x.cobrado=r2((x.cobrado||0)+cobro);(x.devs=x.devs||[]).push({t:Date.now(),q,cobro});
  if(C.prestPend(x)<=0)x.tDev=Date.now();
  D.undo=null;C.emit();return {ok:true,cobro,completo:C.prestPend(x)<=0}};
C.prestamoText=x=>{const s=C.state,n=C.prestPend(x),venc=x.vence?C.fechaDoc(x.vence):null,atr=C.prestEstado(x)==='atrasado';
  return 'Hola '+x.quien+', te escribo de '+s.nombre+'. '+(atr?'Venció el préstamo':'Te recuerdo el préstamo')+' de '+C.num(n)+' '+C.uLabel(x.u)+' de '+x.nom+' (desde el '+C.fechaDoc(x.t)+(venc?', hasta el '+venc:'')+'). '
    +(x.precioDia>0?'Alquiler: '+C.money(x.precioDia)+' por día. ':'')+'¿Cuándo me lo puedes devolver? Gracias.'};
const prestDoc=x=>({tipo:'prestamo',num:x.num,t:x.t,quien:x.quien,destino:x.tel?'Tel. '+x.tel:'',nota:x.nota,vence:x.vence,precioDia:x.precioDia,lines:[{nom:x.nom,u:x.u,q:x.q}]});
C.pdfPrestamo=x=>pdfCall(()=>CuadrePDF.entrega(prestDoc(x),C.ctx()),'pr:'+x.num+':'+hash32(JSON.stringify([x.vence,x.precioDia,C.state.nombre,C.state.logo&&C.state.logo.w])),'Prestamo-'+x.num+'.pdf');

/* =====================================================================
   Juntar dos copias de Cuadre (la de este dispositivo y la del Drive) SIN perder nada y SIN preguntar.
   Función pura: recibe {s,d} (lo de aquí) y {s,d} (lo del Drive) y devuelve {s,d,info}.
   - Cada cosa se reconoce por su «identidad» (id + fecha de creación), no solo por su número: dos dispositivos pueden
     haber creado a la vez el producto N.º 12 y son productos distintos; el de afuera recibe un número libre.
   - Los movimientos (ventas, ingresos, salidas, ajustes) se juntan todos; el stock de cada producto se recalcula
     sumando lo que hizo cada dispositivo (si uno vendió 3 y el otro 2, descuenta 5).
   - Lo borrado queda anotado en D.tomb para que no resucite desde la copia vieja.
   - Si el mismo producto/cotización se editó en los dos, gana el cambio más reciente (campo «mod»).
   ===================================================================== */
const mergeData=(function(){
  const clone=o=>JSON.parse(JSON.stringify(o));
  const r3=x=>Math.round(x*1000)/1000;
  const nrm=s=>String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
  /* identidad: lo creado desde esta versión trae su propio código único (uid / u), que no cambia aunque el número se reasigne al juntar; lo anterior sigue usando número+fecha */
  /* «kid»: lo anterior a esta versión (sin código único) se reconoce por número+fecha. Si al juntar hay que cambiarle el número, se guarda ahí su llave de siempre,
     así el otro dispositivo —que aún lo tiene con el número viejo— lo sigue reconociendo y no lo duplica. */
  const pK=p=>p.uid?'u'+p.uid:p.kid||'p'+p.id+'|'+(p.creado||0);
  const mK=m=>m.uid?'u'+m.uid:m.kid||m.id+'|'+m.t;
  const qK=q=>q.uid?'u'+q.uid:q.kid||q.id+'|'+(q.ct||q.t||0);
  const eK=e=>e.uid?'u'+e.uid:e.kid||e.id+'|'+(e.t||0);
  const tK=t=>nrm(t.nombre);
  const PF=['nom','marca','cat','u','pv','costo','min','ideal','barras','activo','img','imgAuto','imgSrc','ej'];     // campos de un producto que se pueden editar
  const sameP=(a,b)=>PF.every(k=>JSON.stringify(a[k]===undefined?null:a[k])===JSON.stringify(b[k]===undefined?null:b[k]));
  const empty=v=>v==null||v==='';
  const TOMB_DIAS=120;
  function merge(L,R,opt){
    opt=opt||{};L=clone(L);R=clone(R);
    const now=opt.now||Date.now();
    const dl=L.d=L.d||{},dr=R.d=R.d||{};
    ['prods','movs','quotes','qtpl','entregas','prestamos'].forEach(k=>{if(!Array.isArray(dl[k]))dl[k]=[];if(!Array.isArray(dr[k]))dr[k]=[]});
    dl.seqs=Object.assign({},dl.seqs);dr.seqs=Object.assign({},dr.seqs);
    const info={prods:0,movs:0,quotes:0,tpls:0,ents:0,prests:0,borrados:0,rAporto:false,lAporto:false};
    /* ---- lo borrado (de los dos lados) ---- */
    const T=Object.assign({},dl.tomb||{});Object.keys(dr.tomb||{}).forEach(k=>{T[k]=Math.max(T[k]||0,dr.tomb[k])});
    const gone=(key,mod)=>T[key]!=null&&T[key]>=(mod||0);
    /* un producto borrado en un dispositivo, pero con movimientos vivos en el otro (por ejemplo una venta hecha sin internet), NO se borra:
       así no desaparece dinero cobrado de los reportes. Vuelve a aparecer (y se puede volver a quitar; con movimientos se archiva). */
    const liveKeys=(prods,movs)=>{const live=new Set(movs.filter(m=>!gone('m:'+mK(m),0)).map(m=>m.pid));return new Set(prods.filter(p=>live.has(p.id)).map(pK))};
    const liveL=liveKeys(dl.prods,dl.movs),liveR=liveKeys(dr.prods,dr.movs);
    const goneP=p=>{const k='p:'+pK(p);if(!gone(k,p.mod||p.creado))return false;
      if(liveL.has(pK(p))||liveR.has(pK(p))){delete T[k];info.lAporto=true;info.rAporto=true;info.salvados=(info.salvados||0)+1;return false}
      return true};
    /* ---- números libres: siempre por encima de todo lo que existe en cualquiera de las dos copias ---- */
    const maxId=(a,b)=>Math.max(0,...a.map(x=>+x.id||0),...b.map(x=>+x.id||0));
    const maxB=Math.max(0,...dl.movs.map(m=>+m.b||0),...dr.movs.map(m=>+m.b||0));
    const N={prod:Math.max(dl.seqs.prod||1,dr.seqs.prod||1,maxId(dl.prods,dr.prods)+1),
      mov:Math.max(dl.seqs.mov||1,dr.seqs.mov||1,maxId(dl.movs,dr.movs)+1),
      q:Math.max(dl.seqs.q||1,dr.seqs.q||1,maxId(dl.quotes,dr.quotes)+1),
      tpl:Math.max(dl.seqs.tpl||1,dr.seqs.tpl||1,maxId(dl.qtpl,dr.qtpl)+1),
      e:Math.max(dl.seqs.e||1,dr.seqs.e||1,maxId(dl.entregas,dr.entregas)+1),
      pr:Math.max(dl.seqs.pr||1,dr.seqs.pr||1,maxId(dl.prestamos,dr.prestamos)+1),
      b:Math.max(dl.seqs.b||1,dr.seqs.b||1,maxB+1)};

    /* ================= PRODUCTOS ================= */
    const byK=new Map(),byBar=new Map(),claimed=new Set();
    dl.prods.forEach(p=>{byK.set(pK(p),p);if(p.barras){const b=nrm(p.barras);if(!byBar.has(b)||(byBar.get(b).activo===false&&p.activo!==false))byBar.set(b,p)}});
    const rKeysP=new Set(dr.prods.map(pK));
    const used=new Set(dl.prods.map(p=>p.id)),pmap=new Map(),newR=new Set();     // pmap: número del producto en la copia de afuera → número en la junta
    let prods=[];
    dl.prods.forEach(p=>{if(goneP(p)){info.borrados++;info.rAporto=true}else prods.push(p)});
    const pById=new Map(prods.map(p=>[p.id,p]));
    dr.prods.forEach(rp=>{
      if(goneP(rp)){pmap.set(rp.id,null);return}
      let lp=byK.get(pK(rp));if(!lp&&rp.barras){const c=byBar.get(nrm(rp.barras));if(c&&!rKeysP.has(pK(c)))lp=c}      // por código de barras solo si ese producto no tiene ya su igual exacto afuera
      if(lp&&claimed.has(lp.id))lp=null;
      if(lp&&!pById.has(lp.id)){pmap.set(rp.id,null);return}                       // el de aquí fue borrado
      if(lp){                                                                     // el mismo producto en los dos lados
        claimed.add(lp.id);pmap.set(rp.id,lp.id);
        const lm=lp.mod||0,rm=rp.mod||0,igual=sameP(lp,rp);
        if(!igual){
          if(rm>lm){PF.forEach(k=>{if(rp[k]===undefined)delete lp[k];else lp[k]=rp[k]});info.rAporto=true}
          else{PF.forEach(k=>{if(empty(lp[k])&&!empty(rp[k]))lp[k]=rp[k]});info.lAporto=true}
        }
        lp.last=Math.max(lp.last||0,rp.last||0);lp.mod=Math.max(lm,rm)||undefined;if(lp.mod===undefined)delete lp.mod;
        lp.creado=Math.min(lp.creado||Infinity,rp.creado||Infinity);if(!isFinite(lp.creado))lp.creado=now;
        return;
      }
      const np=Object.assign({},rp);                                              // producto nuevo que solo estaba afuera
      if(used.has(np.id)){if(!np.uid&&!np.kid)np.kid=pK(rp);np.id=N.prod++}
      used.add(np.id);pmap.set(rp.id,np.id);newR.add(np.id);prods.push(np);pById.set(np.id,np);info.prods++;info.rAporto=true;
    });
    if(prods.some(p=>!claimed.has(p.id)&&!newR.has(p.id)))info.lAporto=true;
    const pidOf=pid=>pmap.has(pid)?pmap.get(pid):pid;

    /* ================= MOVIMIENTOS ================= */
    const lKeys=new Set(dl.movs.map(mK)),rKeys=new Set(dr.movs.map(mK));
    let movs=[];const dropped=[],ord=new Map();     // ord: de dónde viene cada movimiento y en qué lugar estaba (para no desordenar los que pasaron en el mismo milisegundo)
    dl.movs.forEach((m,i)=>{if(gone('m:'+mK(m),0)||!pById.has(m.pid)){dropped.push(m);return}movs.push(m);ord.set(m,[0,i]);if(!rKeys.has(mK(m)))info.lAporto=true});
    if(dropped.length){info.rAporto=true}
    const usedMov=new Set(dl.movs.map(m=>m.id)),usedB=new Set(dl.movs.map(m=>m.b)),bmap=new Map(),added=[];
    dr.movs.forEach((m,ri)=>{
      const k=mK(m);if(lKeys.has(k))return;if(gone('m:'+k,0))return;
      const pid=pidOf(m.pid);if(pid==null||!pById.has(pid))return;
      const nm=Object.assign({},m,{pid});
      if(usedMov.has(nm.id)){if(!nm.uid&&!nm.kid)nm.kid=mK(m);nm.id=N.mov++}usedMov.add(nm.id);
      if(m.b!=null){if(!bmap.has(m.b))bmap.set(m.b,usedB.has(m.b)?N.b++:m.b);nm.b=bmap.get(m.b)}
      added.push(nm);movs.push(nm);ord.set(nm,[1,ri]);info.movs++;info.rAporto=true;
    });
    movs.sort((a,b)=>(a.t-b.t)||(ord.get(a)[0]-ord.get(b)[0])||(ord.get(a)[1]-ord.get(b)[1]));
    /* stock: lo de aquí + lo que hizo el otro dispositivo (y menos lo que se deshizo) */
    const delta=m=>r3((+m.despues||0)-(+m.antes||0)),adj=new Map(),affected=new Set();
    added.forEach(m=>{if(newR.has(m.pid))return;adj.set(m.pid,(adj.get(m.pid)||0)+delta(m));affected.add(m.pid)});
    dropped.forEach(m=>{if(!pById.has(m.pid))return;adj.set(m.pid,(adj.get(m.pid)||0)-delta(m));affected.add(m.pid)});
    prods.forEach(p=>{if(adj.has(p.id))p.stock=r3((+p.stock||0)+adj.get(p.id))});
    const by=new Map();movs.forEach(m=>{if(affected.has(m.pid)){let a=by.get(m.pid);if(!a){a=[];by.set(m.pid,a)}a.push(m)}});
    by.forEach((list,pid)=>{const p=pById.get(pid);let sum=0;list.forEach(m=>{sum+=delta(m)});let cur=r3((+p.stock||0)-sum);
      list.forEach(m=>{const d=delta(m);m.antes=cur;cur=r3(cur+d);m.despues=cur})});

    /* ================= COTIZACIONES ================= */
    const remapLines=ls=>(ls||[]).map(l=>{const c=Object.assign({},l);if(c.pid!=null){const x=pidOf(c.pid);c.pid=x==null?null:x}return c});
    const lq=new Map(dl.quotes.map(q=>[qK(q),q])),usedQ=new Set(dl.quotes.map(q=>q.id)),usedNum=new Set(dl.quotes.map(q=>q.num));

async function gapi(url,opt,tk){

function cloudMsg(e){const m=String(e&&e.message||e);

  if(m==='drive:403')return 'Google negó el acceso a la carpeta de la app. Cierra la sesión y vuelve a entrar.';

async function driveFiles(tk){const r=await gapi(DRV+'/files?spaces=appDataFolder&fields='+encodeURIComponent('files(id,name,modifiedTime,appProperties)')+'&pageSize=20',{},tk);return (await r.json()).files||[]}
/* Si dos dispositivos suben a la vez, Drive puede quedarse con dos archivos «principal»: se toma el de revisión más alta (a igual revisión, el más reciente). */
const rkey=f=>{const p=f.appProperties||{};return [+p.rev||0,+p.t||Date.parse(f.modifiedTime)||0]};
const mainOf=files=>files.filter(x=>x.name===FMAIN).sort((a,b)=>{const x=rkey(a),y=rkey(b);return (y[0]-x[0])||(y[1]-x[1])||(a.id<b.id?1:-1)})[0];

  return {id:f.id,rev:+p.rev||0,dev:p.dev||'',biz:p.biz||'',nom:p.nom||'',prods:+p.prods||0,movs:+p.movs||0,t:+p.t||Date.parse(f.modifiedTime)||0,propio:p.dev===DEV}}
async function drivePut(tk,json,rev,files){
  const snap={h:cloudHash(),sh:sHash()};                       // se toma en el mismo instante en que el que llama armó «json»
  const main=mainOf(files),prev=files.find(f=>f.name===FPREV);
  /* un duplicado propio (de una subida simultánea) ya quedó incluido al juntar: se borra para no acumular archivos */
  for(const d of files.filter(f=>f.name===FMAIN&&f!==main&&(f.appProperties||{}).dev===DEV))try{await gapi(DRV+'/files/'+d.id,{method:'DELETE'},tk)}catch(e){}
  if(main){if(prev)await gapi(DRV+'/files/'+prev.id,{method:'DELETE'},tk);
    await gapi(DRV+'/files/'+main.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:FPREV})},tk)}
  const meta={name:FMAIN,parents:['appDataFolder'],appProperties:{rev:String(rev),dev:DEV,biz:C.bizId(),nom:String(C.state.nombre||'').slice(0,60),prods:String(D.prods.length),movs:String(D.movs.length),t:String(Date.now())}};
  const b='cuadre'+rnd(12);
  const body='--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+json+'\r\n--'+b+'--';
  await gapi(UPL+'/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body},tk);
  for(const id of cl.pendDel.splice(0))try{await gapi(DRV+'/files/'+id,{method:'DELETE'},tk)}catch(e){}      // copias de otro dispositivo que quedaron «debajo» y que ya se juntaron en esta
  return snap;

async function driveGet(tk,id){const r=await gapi(DRV+'/files/'+id+'?alt=media',{},tk);return r.json()}
/* aplica una copia ya bajada de la nube (sin esperas en medio: nada se puede registrar entre mirar y reemplazar) */
function aplicarNube(o,R,avisar){
  cl.nk=true;const res=applyBackup(o,{cloud:true});cl.nk=false;
  if(!res.ok)return {ok:false,reason:'error',msg:'La copia de la nube no se pudo leer.'};
  markSynced(R.rev,R.dev);
  if(avisar&&C.cloud.onPull){try{C.cloud.onPull(res)}catch(e){console.error(e)}}
  return {ok:true,pull:true,prods:res.prods,movs:res.movs}
}
/* trae lo de la nube y lo aplica; el estado del teléfono queda «al día» con la nube.
   «guard»: si mientras se bajaba la copia aquí se registró algo (una venta, por ejemplo), NO se reemplaza —se perdería—: se juntan las dos. */
async function pull(tk,R,avisar,guard){
  const o=await driveGet(tk,R.id);
  if(guard&&cloudHash()!==guard.h)return await mezclar(tk,R,guard.files,cloudHash(),guard.manual,o);
  return aplicarNube(o,R,avisar)
}
/* juntar lo de aquí con una copia de afuera (incluye elegir el mejor código de plan de cada lado) */
function unir(o){
  const S=CS(),mine=backupObj(true),sCambio=S.sh===undefined||S.sh===''||sHash()!==S.sh;
  const M=C.mergeData({s:mine.s,d:mine.d},{s:o.s,d:o.d},{sLocalChanged:sCambio});
  splitLic(mine.s);splitLic(o.s);
  M.s.lic=betterLic(mine.s.lic,o.s.lic)||undefined;if(!M.s.lic)delete M.s.lic;
  M.s.licPc=betterPc(mine.s.licPc,o.s.licPc)||undefined;if(!M.s.licPc)delete M.s.licPc;
  return M}
/* Si dos dispositivos suben a la vez, la copia de uno queda «debajo» (otro archivo principal, de otro dispositivo). Si no se junta, el cambio de ese
   dispositivo se pierde cuando el otro vuelve a subir. Aquí se juntan antes de seguir; se borran al subir la copia que ya las incluye. */
async function absorber(tk,files,manual){
  const main=mainOf(files);
  const hu=files.filter(f=>f.name===FMAIN&&f!==main&&(f.appProperties||{}).dev!==DEV&&!cl.huDone.has(f.id));
  if(!hu.length)return {n:0};
  if(!manual&&C.cloud.idle&&!C.cloud.idle()){cl.check=true;cl.timer=setTimeout(()=>cloudSync(false),5e3);return {aplazado:true}}
  let n=0;
  for(const f of hu){
    let o=null;try{o=await driveGet(tk,f.id)}catch(e){continue}                 // si ya no está, no hay nada que juntar
    if(!o||o.app!=='cuadre'||!o.s||!o.d||!Array.isArray(o.d.prods)){cl.huDone.add(f.id);continue}
    const M=unir(o);
    if(M.info.rAporto){cl.nk=true;const res=applyBackup({app:'cuadre',v:1,s:M.s,d:M.d},{cloud:true});cl.nk=false;if(!res.ok)continue;n++}
    cl.huDone.add(f.id);cl.pendDel.push(f.id)}
  return {n}}
/* los dos dispositivos cambiaron algo: se juntan los cambios. Nunca se pregunta y nunca se pierde nada. */
async function mezclar(tk,R,files,h,manual,pre){
  const S=CS(),o=pre||await driveGet(tk,R.id);
  if(!o||o.app!=='cuadre'||!o.s||!o.d||!Array.isArray(o.d.prods))return {ok:false,reason:'error',msg:'La copia de tu Drive no se pudo leer; no la toqué. Se intentará de nuevo.'};
  const M=unir(o);
  if(!M.info.rAporto){                                     // el Drive no trae nada que aquí no esté: solo subir lo de aquí
    const rev=R.rev+1,sn=await drivePut(tk,JSON.stringify(backupObj(true)),rev,files);markSynced(rev,undefined,sn);return {ok:true,fusion:false}}
  if(!M.info.lAporto){                                     // aquí no hay nada que el Drive no tenga: se queda con el Drive
    if(!manual&&C.cloud.idle&&!C.cloud.idle()){cl.check=true;cl.timer=setTimeout(()=>cloudSync(false),5e3);return {ok:true,aplazado:true}}
    return aplicarNube(o,R,true)}
  if(!manual&&C.cloud.idle&&!C.cloud.idle()){cl.check=true;cl.timer=setTimeout(()=>cloudSync(false),5e3);return {ok:true,aplazado:true}}
  cl.nk=true;const res=applyBackup({app:'cuadre',v:1,s:M.s,d:M.d},{cloud:true});cl.nk=false;
  if(!res.ok)return {ok:false,reason:'error',msg:'No se pudieron juntar las copias.'};
  const f2=await driveFiles(tk),R2=remoteOf(f2);
  if(R2&&R2.rev!==R.rev){cl.check=true;cl.timer=setTimeout(()=>cloudSync(false),2e3);return {ok:true,aplazado:true}}     // un tercer dispositivo escribió justo ahora: se repite
  const rev=R.rev+1,sn=await drivePut(tk,JSON.stringify(backupObj(true)),rev,f2);markSynced(rev,undefined,sn);
  if(C.cloud.onPull){try{C.cloud.onPull(Object.assign({fusion:true},res))}catch(e){console.error(e)}}

async function cloudSync(manual,gesture){
  const S=CS();if(!S.on||!cfgOk()||!D||cl.busy)return {ok:false,reason:'nada'};
  if(!C.online())return {ok:false,reason:'offline'};
  if(!manual&&!gesture&&cl.needAuth)return {ok:false,reason:'auth'};
  if(cl.conflict&&!manual)return {ok:false,reason:'conflicto'};
  let h=cloudHash();
  if(!manual&&h===S.hash&&!cl.check){cl.dirty=false;return {ok:true,igual:true}}
  cl.busy=true;cl.err='';cl.nk=true;C.emit();cl.nk=false;
  try{
    await loadGIS();const tk=await getToken(manual||gesture?true:false);await tokCuenta(tk);
    const files=await driveFiles(tk),R=remoteOf(files);S.vOk=Date.now();            // hubo contacto con tu Drive: la PC con plan queda verificada
    const hu=await absorber(tk,files,manual);if(hu.aplazado)return {ok:true,aplazado:true};
    if(hu.n)h=cloudHash();                                                           // lo de aquí cambió al juntar las copias que habían quedado debajo
    /* «lost»: la misma revisión pero escrita por OTRO dispositivo (dos subieron a la vez y la nuestra quedó debajo): hay que juntar, no traer */
    const lost=!!(R&&S.rdev&&R.rev===(S.rev||0)&&R.dev&&R.dev!==S.rdev);
    if(R&&(R.rev!==(S.rev||0)||lost)){                      // otro dispositivo escribió desde la última vez
      if(h===S.hash&&!lost){
        if(C.cloud.idle&&!C.cloud.idle()){cl.check=true;cl.timer=setTimeout(()=>cloudSync(false),5e3);return {ok:true,aplazado:true}}
        return await pull(tk,R,true,{h,files,manual});
      }
      cl.needAuth=false;
      /* Dos dispositivos del MISMO negocio se juntan solos. Solo si son dos negocios distintos con la misma cuenta se pregunta (caso raro). */
      if(!cl.juntar&&D&&(D.prods.length||D.movs.length)&&R.biz&&C.state.bizId&&R.biz!==C.state.bizId&&(R.prods+R.movs)>0&&nombreNeg(R.nom)!==nombreNeg(C.state.nombre)){cl.conflict=R;return {ok:false,reason:'conflicto'}}
      return await mezclar(tk,R,files,h,manual);
    }
    cl.check=false;
    if(h===S.hash&&!manual){cl.dirty=false;cl.needAuth=false;return {ok:true,igual:true}}
    if(!R&&C.state.step!=='app'){cl.check=false;cl.dirty=false;return {ok:true,igual:true}}      // aún no hay negocio aquí: no se sube una copia vacía
    const rev=(R?R.rev:0)+1;
    const sn=await drivePut(tk,JSON.stringify(backupObj(true)),rev,files);
    markSynced(rev,undefined,sn);cl.needAuth=false;cl.err='';return {ok:true};
  }catch(e){cl.err=cloudMsg(e);if(/^(auth|otra):/.test(String(e&&e.message)))cl.needAuth=true;return {ok:false,reason:'error',msg:cl.err}}
  finally{cl.busy=false;cl.nk=true;C.emit();cl.nk=false;
    if(cl.again){cl.again=false;clearTimeout(cl.timer);cl.timer=setTimeout(()=>{cloudSync(false)},400)}}      // se cambió algo mientras subía: se vuelve a subir enseguida
}

  async juntar(){cl.juntar=true;cl.conflict=null;try{return await cloudSync(true)}finally{cl.juntar=false}},      // «Juntar los dos»: dos negocios de la misma cuenta, el usuario eligió juntarlos

/* Casi instantáneo entre teléfono y computadora: con la app a la vista se mira cada pocos segundos si el otro dispositivo cambió algo
   (una consulta liviana que solo lee la «revisión» del archivo; si cambió, se trae o se junta solo) y al volver a la app se mira de inmediato.
   Los cambios de aquí se suben a los ~2 segundos. Sin internet queda pendiente y se sincroniza al volver. */
let lastAct=Date.now(),pollT=0;
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>{lastAct=Date.now()},{passive:true,capture:true}));
function pollNow(){const S=CS();if(!S.on||!cfgOk()||!D||cl.busy||document.hidden||!C.online()||cl.needAuth||cl.conflict)return;
  cl.lastCheck=Date.now();cl.check=true;cloudSync(false)}
function pollLoop(){clearTimeout(pollT);const c=C.CONFIG,slow=Date.now()-lastAct>c.sondearLentoTrasMs,ms=slow?c.sondearLentoMs:c.sondearCadaMs;
  if(!(ms>0)){pollT=setTimeout(pollLoop,5e3);return}                // apagado: se vuelve a mirar la configuración cada 5 s
  pollT=setTimeout(()=>{try{pollNow()}catch(e){}pollLoop()},Math.max(1500,ms))}
['focus','online','pageshow'].forEach(ev=>addEventListener(ev,()=>{if(C.CONFIG.sondearCadaMs>0){lastAct=Date.now();setTimeout(pollNow,250)}}));
pollLoop();
setTimeout(()=>{if(CS().on&&cfgOk()){cl.check=true;C.cloud.kick(500)}},2500);


/* =====================================================================
   Sonido y vibración al registrar (Web Audio: los sonidos de la app no usan archivos y funcionan sin internet)
   Todo lo configurable está en Más → Sonido y vibración:
     state.sonido (sí/no) · state.vibra (sí/no) · state.snd = uno de C.SONIDOS, o 'mio' = un sonido que el usuario sube de su dispositivo
   El sonido propio se guarda SOLO en este dispositivo (IndexedDB), no viaja a Drive.
   ===================================================================== */
C.SONIDOS=[['notif','Notificación'],['campana','Campana'],['moneda','Moneda'],['suave','Suave'],['caja','Caja registradora']];
const SND_MAX={bytes:400*1024,seg:10};      // tope del sonido propio: 400 KB y 10 segundos
const SFX=(()=>{
  let ctx=null;
  const get=()=>{try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;if(!ctx)ctx=new A();if(ctx.state==='suspended')ctx.resume();return ctx}catch(e){return null}};
  const tone=(c,t0,f,dur,vol,type)=>{const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);
    g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+dur+0.03)};
  const noise=(c,t0,dur,vol,hp)=>{const n=Math.max(1,Math.floor(c.sampleRate*dur)),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
    const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=hp||1200;
    const g=c.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(c.destination);s.start(t0)};
  /* una nota «redonda»: la base y dos armónicos suaves, como las de un aviso del teléfono */
  const note=(c,t0,f,dur,vol)=>{tone(c,t0,f,dur,vol);tone(c,t0,f*2,dur*0.7,vol*0.22);tone(c,t0,f*3,dur*0.45,vol*0.08)};
  const bell=(c,t0,f,dur,vol)=>[[1,1],[2.76,.5],[5.4,.25],[8.93,.12]].forEach(x=>tone(c,t0,f*x[0],dur/(x[0]>1?1.6:1),vol*x[1]));
  const P={
    /* Notificación (la de siempre): dos notas limpias hacia arriba; más suave en ingresos y salidas */
    notif:{venta(c,t){note(c,t,880,0.28,0.2);note(c,t+0.14,1319,0.6,0.2)},ingreso(c,t){note(c,t,1047,0.5,0.16)},salida(c,t){note(c,t,659,0.4,0.16)}},
    campana:{venta(c,t){bell(c,t,1047,1.3,0.16)},ingreso(c,t){bell(c,t,784,0.9,0.12)},salida(c,t){bell(c,t,523,0.8,0.12)}},
    moneda:{venta(c,t){tone(c,t,1568,0.09,0.2,'triangle');tone(c,t+0.07,2349,0.55,0.2,'triangle');tone(c,t+0.07,4698,0.3,0.06)},ingreso(c,t){tone(c,t,1760,0.35,0.14,'triangle')},salida(c,t){tone(c,t,1175,0.25,0.12,'triangle')}},
    suave:{venta(c,t){tone(c,t,523,0.18,0.2);tone(c,t+0.1,784,0.35,0.2)},ingreso(c,t){tone(c,t,659,0.25,0.15)},salida(c,t){tone(c,t,440,0.2,0.14)}},
    /* caja registradora: golpe mecánico («ka»), cierre del cajón y campanilla («ching») */
    caja:{venta(c,t){noise(c,t,0.09,0.55,900);tone(c,t,170,0.1,0.28,'triangle');noise(c,t+0.12,0.05,0.28,3200);
        [[2093,0.95,0.2],[2637,0.85,0.15],[3136,0.7,0.1],[4186,0.5,0.05]].forEach(f=>tone(c,t+0.17,f[0],f[1],f[2]))},
      ingreso(c,t){tone(c,t,784,0.4,0.16);tone(c,t+0.11,1175,0.55,0.16)},
      salida(c,t){noise(c,t,0.05,0.25,1500);tone(c,t,520,0.22,0.16,'triangle')}}};
  return {
    play(pack,kind){const c=get();if(!c)return;const k=kind==='venta'||kind==='ingreso'||kind==='salida'?kind:'venta',p=P[pack]||P.notif;p[k](c,c.currentTime+0.01)},
    /* lectura de un código */
    scan(){const c=get();if(!c)return;const t=c.currentTime+0.01;tone(c,t,1568,0.09,0.12,'square')}
  };
})();
/* sonido propio: se guarda como archivo en IndexedDB (clave 'snd') y suena con un <audio> */
const MIO={name:'',url:'',el:null,ok:false};
const mioSet=(buf,name,type)=>{try{if(MIO.url)URL.revokeObjectURL(MIO.url)}catch(e){}
  MIO.url=URL.createObjectURL(new Blob([buf],{type:type||'audio/mpeg'}));MIO.name=name||'Mi sonido';MIO.el=new Audio(MIO.url);MIO.el.preload='auto';MIO.ok=true};
const mioClear=()=>{try{if(MIO.url)URL.revokeObjectURL(MIO.url)}catch(e){}MIO.url='';MIO.el=null;MIO.name='';MIO.ok=false};
const idbKv=(mode,fn)=>new Promise((res,rej)=>{if(!STO.db||STO.mode!=='idb'){rej(new Error('sin idb'));return}
  try{const tx=STO.db.transaction('kv',mode),os=tx.objectStore('kv'),r=fn(os);tx.oncomplete=()=>res(r&&r.result);tx.onerror=tx.onabort=()=>rej(tx.error)}catch(e){rej(e)}});
C.sndLoad=async()=>{try{const o=await idbKv('readonly',os=>os.get('snd'));if(o&&o.buf)mioSet(o.buf,o.name,o.type);else mioClear()}catch(e){}};
C.sndInfo=()=>({ok:MIO.ok,name:MIO.name,max:SND_MAX,persist:STO.mode==='idb'});
/* sube un sonido del dispositivo: comprueba que sea audio, corto y liviano; si todo va bien queda elegido */
C.sndPick=async file=>{
  if(!file)return {ok:false,msg:''};
  if(!/^audio\//.test(file.type||'')&&!/\.(mp3|wav|ogg|oga|m4a|aac|opus|weba|flac)$/i.test(file.name||''))return {ok:false,msg:'Ese archivo no es un sonido. Elige un mp3, wav, ogg o m4a.'};
  if(file.size>SND_MAX.bytes)return {ok:false,msg:'El sonido pesa '+Math.round(file.size/1024)+' KB. Elige uno de hasta '+Math.round(SND_MAX.bytes/1024)+' KB (un aviso corto).'};
  const buf=await file.arrayBuffer(),type=file.type||'audio/mpeg';
  const dur=await new Promise(res=>{const u=URL.createObjectURL(new Blob([buf],{type})),a=new Audio();let done=false;const fin=v=>{if(done)return;done=true;try{URL.revokeObjectURL(u)}catch(e){}res(v)};
    a.preload='metadata';a.onloadedmetadata=()=>fin(a.duration);a.onerror=()=>fin(-1);setTimeout(()=>fin(-2),4000);a.src=u});
  if(dur===-1)return {ok:false,msg:'No pude reproducir ese archivo. Prueba con otro (mp3 o m4a funcionan casi siempre).'};
  if(dur>SND_MAX.seg)return {ok:false,msg:'Ese sonido dura '+Math.round(dur)+' segundos. Elige uno de hasta '+SND_MAX.seg+' segundos.'};
  mioSet(buf,file.name.replace(/\.[^.]+$/,'').slice(0,40),type);
  let saved=true;try{await idbKv('readwrite',os=>os.put({buf,name:MIO.name,type},'snd'))}catch(e){saved=false}
  C.state.snd='mio';C.touch();
  return {ok:true,name:MIO.name,saved}};
C.sndClear=async()=>{mioClear();try{await idbKv('readwrite',os=>os.delete('snd'))}catch(e){}if(C.state.snd==='mio')C.state.snd='notif';C.touch()};
const mioPlay=()=>{if(!MIO.ok||!MIO.el)return false;try{MIO.el.currentTime=0;const p=MIO.el.play();if(p&&p.catch)p.catch(()=>{});return true}catch(e){return false}};
C.sfx=(kind,force)=>{if(C.state.sonido===false&&!force)return;
  try{if(kind==='scan'){SFX.scan();return}
    const pk=C.state.snd||'notif';
    if(pk==='mio'&&mioPlay())return;
    SFX.play(pk==='mio'?'notif':pk,kind)}catch(e){}};
C.sfxProbar=pk=>{try{if(pk==='mio'){if(!mioPlay())SFX.play('notif','venta')}else SFX.play(pk,'venta')}catch(e){}};
C.buzz=pat=>{if(C.state.vibra===false)return;try{navigator.vibrate&&navigator.vibrate(pat)}catch(e){}};

/* =====================================================================
   Foto del producto: se toma o se elige y queda como una miniatura cuadrada pequeña (unos 3 KB)
   dentro del propio producto (p.img). Así viaja sola en la copia de Drive y en las copias del teléfono.
   ===================================================================== */
C.FOTO={px:96,calidad:0.62};
C.photoThumb=async file=>{
  if(!file)return {ok:false,msg:''};
  if(!/^image\//.test(file.type||'')&&!/\.(jpe?g|png|webp|gif|bmp|heic|heif|avif)$/i.test(file.name||''))return {ok:false,msg:'Ese archivo no es una foto.'};
  let src=null,w=0,h=0,url='';
  try{
    if(window.createImageBitmap){try{src=await createImageBitmap(file,{imageOrientation:'from-image'});w=src.width;h=src.height}catch(e){src=null}}
    if(!src){url=URL.createObjectURL(file);src=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('img'));im.src=url});w=src.naturalWidth;h=src.naturalHeight}
    if(!w||!h)return {ok:false,msg:'No pude leer esa foto.'};
    const N=C.FOTO.px,cv=document.createElement('canvas');cv.width=cv.height=N;const g=cv.getContext('2d');
    g.fillStyle='#ffffff';g.fillRect(0,0,N,N);
    const m=Math.min(w,h),sx=(w-m)/2,sy=(h-m)/2;      // recorte cuadrado desde el centro
    g.imageSmoothingQuality='high';g.drawImage(src,sx,sy,m,m,0,0,N,N);
    let out=cv.toDataURL('image/webp',C.FOTO.calidad);
    if(!/^data:image\/webp/.test(out))out=cv.toDataURL('image/jpeg',C.FOTO.calidad);
    return {ok:true,img:out,bytes:out.length}
  }catch(e){return {ok:false,msg:'No pude leer esa foto. Prueba con otra.'}}
  finally{try{if(url)URL.revokeObjectURL(url);if(src&&src.close)src.close()}catch(e){}}
};

/* =====================================================================
   Foto inteligente (Pro): busca la foto del producto en catálogos abiertos (Open Food Facts, Open Beauty Facts, Open Products Facts
   y Wikipedia) con SOLO el código de barras y/o el nombre. No se manda nada más (sin cuenta, sin datos del negocio, sin referer).
   Las fotos se bajan aquí y se reducen a miniatura (igual que una foto propia): lo que se muestra es exactamente lo que se guarda.
   ===================================================================== */
C.fotoBuscar=async q=>{
  const F=PLAN.fotoAuto,nom=String(q&&q.nom||'').replace(/\s+/g,' ').trim().slice(0,80),marca=String(q&&q.marca||'').trim().slice(0,40),bar0=String(q&&q.barras||'').replace(/[\s-]/g,''),bar=/^\d{8,14}$/.test(bar0)?bar0:'';      // solo códigos de barras numéricos (un código interno con letras no se busca)
  if(!C.isPro())return {ok:false,msg:'La foto automática es de Pro.',pro:true};
  if(!C.online())return {ok:false,msg:'Sin internet no puedo buscar. Puedes tomar la foto o elegirla de tu galería.',offline:true};
  if(bar.length<8&&nom.length<3)return {ok:false,msg:'Escribe el nombre del producto (o escanea su código de barras) y vuelve a buscar.',falta:true};
  const fx=async(url,tipo)=>{const ac=new AbortController(),t=setTimeout(()=>ac.abort(),F.ms);
    try{const r=await fetch(url,{signal:ac.signal,credentials:'omit',referrerPolicy:'no-referrer',cache:'no-store'});if(!r.ok)throw new Error('http'+r.status);return tipo==='blob'?await r.blob():await r.json()}finally{clearTimeout(t)}};
  const exact=[],porNombre=[],wiki=[];
  const OFFS=[['off',F.off,'Open Food Facts'],['obf',F.obf,'Open Beauty Facts'],['opf',F.opf,'Open Products Facts']];
  const jobs=[];let sinResp=0;const sr=e=>{if(!/^http4\d\d$/.test(String(e&&e.message||'')))sinResp++};      // «no encontrado» (404) no es falta de internet
  if(bar.length>=8)OFFS.forEach(([k,base,fuente])=>jobs.push(fx(base+'/api/v2/product/'+bar+'.json?fields=product_name,brands,image_front_small_url,image_front_url','json').then(j=>{
    const p=j&&j.status===1&&j.product;if(!p)return;const u=p.image_front_small_url||p.image_front_url;if(u)exact.push({u,tit:p.product_name||nom,fuente,exacta:true})}).catch(sr)));
  if(nom.length>=3){
    const txt=encodeURIComponent((marca&&!norm(nom).includes(norm(marca))?marca+' ':'')+nom);
    jobs.push(fx(F.off+'/cgi/search.pl?search_terms='+txt+'&search_simple=1&action=process&json=1&page_size=4&fields=product_name,brands,image_front_small_url','json').then(j=>{
      (j&&j.products||[]).forEach(p=>{if(p&&p.image_front_small_url)porNombre.push({u:p.image_front_small_url,tit:[p.product_name,p.brands].filter(Boolean).join(' · ')||nom,fuente:'Open Food Facts'})})}).catch(sr));
    jobs.push(fx(F.wiki+'/w/api.php?action=query&format=json&origin=*&generator=search&gsrsearch='+txt+'&gsrlimit=4&prop=pageimages&piprop=thumbnail&pithumbsize=240&pilimit=4','json').then(j=>{
      const pg=j&&j.query&&j.query.pages?Object.values(j.query.pages).sort((a,b)=>(a.index||0)-(b.index||0)):[];
      pg.forEach(p=>{if(p&&p.thumbnail&&p.thumbnail.source)wiki.push({u:p.thumbnail.source,tit:p.title||nom,fuente:'Wikipedia'})})}).catch(sr));
  }
  await Promise.all(jobs);
  const seen=new Set(),lista=[];
  [].concat(exact,porNombre,wiki).forEach(x=>{if(!/^https:\/\//.test(x.u)||seen.has(x.u))return;seen.add(x.u);lista.push(x)});
  const bajadas=await Promise.all(lista.slice(0,F.max).map(async x=>{
    try{const b=await fx(x.u,'blob');const r=await C.photoThumb(b.type&&/^image\//.test(b.type)?b:new Blob([b],{type:'image/jpeg'}));return r.ok?{img:r.img,tit:x.tit,fuente:x.fuente,exacta:!!x.exacta}:null}catch(e){return null}}));
  const res=bajadas.filter(Boolean);
  if(!res.length&&jobs.length&&sinResp===jobs.length)return {ok:false,msg:'No pude conectarme para buscar. Revisa tu internet e inténtalo de nuevo.',offline:true};
  return {ok:true,res};
};

  C.quotes().forEach(q=>{const nom=String(q.cliente||'').trim();if(!nom)return;const k=norm(nom);let c=seen.get(k);   // el más reciente primero; el teléfono y el correo salen de la última cotización que los tenga

    if(!c.tel&&q.tel)c.tel=q.tel;if(!c.email&&q.email)c.email=q.email});
  return out.filter(c=>!t||norm(c.nom+' '+c.tel+' '+c.email).includes(t)).slice(0,30)};

C.quoteDup=id=>{const o=D.quotes.find(x=>x.id===id);if(!o)return null;

C.tplList=()=>D?(D.qtpl||[]).slice().sort((a,b)=>b.t-a.t):[];
C.tplSave=(q,nombre)=>{if(!C.isPro())return {ok:false,reason:'pro'};

/* una cotización nueva a partir de la plantilla: los precios se ponen al día con los de cada producto */

C.gananciaPor=(k,modo,ref)=>{const r=C.rango(k,ref),M=new Map();let tot={imp:0,costo:0,gan:0,q:0};
  for(let i=D.movs.length-1;i>=0;i--){const m=D.movs[i];if(m.t<r.a)break;if(m.tipo!=='venta'||m.t>r.b)continue;
    const p=C.prod(m.pid),key=modo==='cat'?((p&&p.cat)||''):String(m.pid),nom=modo==='cat'?(key||'Sin categoría'):(m.nom||(p&&p.nom)||'—');
    let x=M.get(key);if(!x){x={key,nom,q:0,imp:0,costo:0,gan:0,u:modo==='cat'?'':m.u,pid:modo==='cat'?null:m.pid,sinCosto:false};M.set(key,x)}
    if(!(m.costo>0))x.sinCosto=true;
    const imp=m.q*m.pv,c=m.q*(m.costo||0);x.q+=m.q;x.imp+=imp;x.costo+=c;x.gan+=imp-c;tot.imp+=imp;tot.costo+=c;tot.gan+=imp-c;tot.q+=m.q}
  const rows=Array.from(M.values()).sort((a,b)=>b.gan-a.gan||b.imp-a.imp).map(x=>{x.pct=x.costo>0?x.gan/x.costo*100:null;x.parte=tot.gan>0?Math.max(0,x.gan)/tot.gan*100:0;return x});
  return {rows,tot,k,modo,sinCosto:rows.some(x=>x.sinCosto)}};
C.cierreText=t=>{const c=C.cierre(t),s=C.state,fm=C.money,L=['*'+s.nombre+'* · Cierre de caja',C.fechaLarga(c.a)+' '+new Date(c.a).getFullYear(),''];
  const ver=C.gv();                                              // con «Proteger ganancias y costos» el texto sale sin costos ni ganancias
  L.push('Ventas: '+c.n+' · Unidades: '+C.num(c.uds));L.push('Total vendido: '+fm(c.ventas));
  if(ver){L.push('Costo de lo vendido: '+fm(c.costo));L.push('Ganancia de las ventas: '+fm(c.bruta));
    if(c.salCosto>0)L.push('Salió sin cobrar (a costo): '+fm(c.salCosto));L.push('*Ganancia neta del día: '+fm(c.neta)+'*');if(c.entroCosto>0)L.push('Mercadería que entró (a costo): '+fm(c.entroCosto))}
  if(c.por.length){L.push('');c.por.slice(0,15).forEach(x=>L.push('• '+C.num(x.q)+' '+C.uLabel(x.u)+' × '+x.nom+' — '+fm(x.imp)));if(c.por.length>15)L.push('… y '+(c.por.length-15)+' productos más')}
  return L.join('\n')};
C.cierreVacio=t=>{const c=C.cierre(t);return !(c.n||c.salN||c.entroN||c.ajN)};
C.cierre=t=>{const a=startDay(t==null?Date.now():t),b=addDays(a,1)-1,por={},bs=new Set(),sal=new Set();
  let ventas=0,costo=0,uds=0,salCosto=0,salN=0,entroCosto=0,entroN=0,ajN=0;
  for(let i=D.movs.length-1;i>=0;i--){const m=D.movs[i];if(m.t<a)break;if(m.t>b)continue;
    if(m.tipo==='venta'){const imp=m.q*m.pv,c=m.q*(m.costo||0);ventas+=imp;costo+=c;uds+=m.q;bs.add(m.b);
      const x=por[m.pid]||(por[m.pid]={nom:m.nom,u:m.u,q:0,imp:0,costo:0,gan:0});x.q+=m.q;x.imp+=imp;x.costo+=c;x.gan+=imp-c}
    else if(m.tipo==='salida'){salCosto+=m.q*(m.costo||0);sal.add(m.b)}
    else if(m.tipo==='ingreso'){entroCosto+=m.q*(m.costo||0);entroN++}
    else if(m.tipo==='ajuste')ajN++}
  const rows=Object.keys(por).map(k=>por[k]).sort((x,y)=>y.gan-x.gan||y.imp-x.imp);
  return {a,n:bs.size,ventas,costo,bruta:ventas-costo,salCosto,salN:sal.size,neta:ventas-costo-salCosto,uds,ticket:bs.size?ventas/bs.size:0,entroCosto,entroN,ajN,por:rows}};

/* =====================================================================
   Activación de Pro y del plan Computadora con un código atado a la cuenta de Google
   Código = CUADRE-<PRO|PC>-<vence AAAAMMDD o 0>-<firma>. La firma (ECDSA P-256) cubre el plan, el vencimiento y el correo
   de la cuenta; solo quien tiene la clave privada (el generador de Luis) puede crearla. La app solo trae la clave pública
   (PLAN.licKey). El código queda en el estado, así que con la misma cuenta aparece solo en el otro dispositivo.
   ===================================================================== */
const b64u=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
const LIC_RE=/^cuadre-(pro|pc)-(\d{1,8})-([A-Za-z0-9_-]{86})$/i;
C.licParse=code=>{const m=String(code||'').replace(/\s+/g,'').match(LIC_RE);return m?{plan:m[1].toLowerCase(),until:+m[2],sig:m[3]}:null};
const licUntil=n=>{if(!n)return 0;const y=Math.floor(n/10000),mo=Math.floor(n/100)%100,d=n%100;return new Date(y,mo-1,d,23,59,59).getTime()};
/* ¿la firma corresponde a este plan, vencimiento y correo? */
C.licVerify=async(code,email)=>{
  const P=C.licParse(code);if(!P)return {ok:false,msg:'El código no está completo o no es de Cuadre. Cópialo de nuevo tal como te lo enviaron.'};
  if(!(window.crypto&&crypto.subtle))return {ok:false,nocrypto:true,msg:'Este navegador no puede comprobar el código. Abre Cuadre en Chrome o Safari.'};
  const mail=C.normMail(email);if(!mail)return {ok:false,msg:'Falta la cuenta de Google.'};
  try{
    const msg=new TextEncoder().encode(['cuadre',1,P.plan,P.until,mail].join('|')),sig=b64u(P.sig);
    let ok=false;
    for(const jwk of [C.PLAN.licKey,C.PLAN.licKeyCompras]){      // código del vendedor o código del servidor de compras de Play
      if(!jwk||ok)continue;
      const key=await crypto.subtle.importKey('jwk',jwk,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
      ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,sig,msg);
    }
    if(!ok)return {ok:false,otra:true,msg:'Este código no corresponde a la cuenta '+email+'. Cada código funciona solo con el correo de Google para el que se pidió.'};
    /* un código de Pro vence; uno de la versión para PC NO (la PC es para siempre): su fecha solo dice hasta cuándo trae Pro */
    if(P.plan==='pro'&&P.until&&licUntil(P.until)<Date.now())return {ok:false,msg:'Este código venció. Pide uno nuevo.'};
    return {ok:true,plan:P.plan,until:P.until?licUntil(P.until):0,email:mail}
  }catch(e){return {ok:false,msg:'No pude comprobar el código. Revisa que esté completo.'}}
};
C.licActivate=async code=>{
  const K=C.cloud.info();
  if(!K.connected||!K.email)return {ok:false,sin:true,msg:'Primero entra con tu cuenta de Google: el código se activa para esa cuenta.'};
  const r=await C.licVerify(code,K.email);if(!r.ok)return r;
  const P=C.licParse(code),nueva={plan:r.plan,email:r.email,until:r.until,code:'CUADRE-'+P.plan.toUpperCase()+'-'+P.until+'-'+P.sig,t:Date.now()};
  /* la versión para PC y Pro son dos casillas: activar una nunca borra ni empeora la otra; en cada una, nunca se cambia un código mejor por uno peor */
  const pc=r.plan==='pc',slot=pc?'licPc':'lic',prev=C.state[slot]&&C.state[slot].email===nueva.email?C.state[slot]:null;
  const mejor=(pc?betterPc:betterLic)(prev,nueva);
  C.state[slot]=mejor;r.guardada=mejor===nueva;CS().vOk=Date.now();
  C.emit();return r};
C.licClear=w=>{if(w!=='pc')C.state.lic=null;if(w!=='pro')C.state.licPc=null;C.emit()};
/* al abrir y al traer datos de otro dispositivo: el código guardado se vuelve a comprobar; si no vale, se quita */
C.licRecheck=async()=>{splitLic(C.state);
  for(const [slot,pc] of [['lic',false],['licPc',true]]){const L=C.state[slot];if(!L||!L.code)continue;const r=await C.licVerify(L.code,L.email);
    if(r.nocrypto)continue;                                          // el navegador no puede comprobar: NO es que el código sea malo, no se quita
    if(!r.ok&&!r.sin){C.state[slot]=null;C.emit()}else if(r.ok&&r.plan!==L.plan){C.state[slot]=null;C.emit()}}};

/* =====================================================================
   Compra de Pro: suscripción de Google Play (dentro de la app instalada desde Play) o código del vendedor (versión web).
   En la app de Play la compra la hace Google con la API de bienes digitales (Digital Goods API); el token de compra se manda al
   servidor (PLAN.verificador), que lo confirma con Google, lo liga al correo y devuelve el MISMO tipo de código firmado que usa la
   versión web. Así hay una sola forma de saber si alguien tiene Pro (C.licInfo) y funciona sin internet y en todos sus dispositivos.
   Cada vez que se abre la app se revisa si la suscripción sigue vigente y el código se renueva solo.
   ===================================================================== */
const BIL={svc:null,det:{},tried:false,last:0,busy:false};
/* la app de Google Play (TWA) abre la página con «android-app://» como origen: se recuerda para que, desde el primer toque, no se ofrezca pagar por otro medio */
try{if(String(document.referrer||'').indexOf('android-app://')===0)localStorage.setItem('cuadre.twa','1')}catch(e){}
const PLAY='https://play.google.com/billing';
C.billing={
  /* ¿hay Google Play? (solo dentro de la app de Play). Lee los precios reales de Play, en la moneda del usuario */
  async init(){
    if(BIL.tried||BIL.svc)return !!BIL.svc;
    try{
      if(typeof window.getDigitalGoodsService!=='function'||typeof window.PaymentRequest!=='function'){BIL.tried=true;return false}        // no es la app de Play: no se vuelve a intentar
      BIL.svc=await window.getDigitalGoodsService(PLAY);
      try{const ds=await BIL.svc.getDetails(Object.keys(PLAN.planes).map(k=>PLAN.planes[k].id));(ds||[]).forEach(d=>{BIL.det[d.itemId]=d})}catch(e){}
      return true;
    }catch(e){BIL.svc=null;return false}
  },
  /* ¿esta es la app de Google Play? Aunque la compra aún no esté activada (sin servidor o antes de que cargue Play), ahí NO se ofrece pagar por otro medio */
  enPlay(){if(BIL.svc)return true;try{return localStorage.getItem('cuadre.twa')==='1'}catch(e){return false}},
  kind(){return BIL.svc&&PLAN.verificador?'play':'codigo'},          // sin servidor que confirme la compra no se ofrece pagar por Play
  /* precio para mostrar: el de Play (con la moneda del usuario) o, si no está, el de PLAN */
  precio(k){const p=PLAN.planes[k],d=BIL.det[p.id];
    if(d&&d.price&&d.price.currency&&d.price.value!=null){try{return new Intl.NumberFormat(undefined,{style:'currency',currency:d.price.currency}).format(+d.price.value)}catch(e){}}
    return p.precio},
  async _post(token,productId){
    const K=C.cloud.info();
    if(!PLAN.verificador)return {ok:false,msg:'La compra con Google Play todavía no está activada en esta versión. Vuelve a intentarlo en unos días.'};
    let rs;const ac=typeof AbortController==='function'?new AbortController():null,to=ac?setTimeout(()=>ac.abort(),20000):0;
    try{rs=await fetch(PLAN.verificador.replace(/\/$/,'')+'/activar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,productId,email:K.email||'',paquete:PLAN.playPaquete}),signal:ac?ac.signal:undefined});clearTimeout(to)}
    catch(e){clearTimeout(to);return {ok:false,red:true,msg:'No pude confirmar la compra por falta de internet. Cuando vuelva, abre esta pantalla y toca «Restaurar mi compra».'}}
    let j={};try{j=await rs.json()}catch(e){}
    if(!rs.ok||!j.code)return {ok:false,msg:j.msg||'No pude confirmar la compra con Google. Si te cobraron, toca «Restaurar mi compra» en unos minutos.'};
    const r=await C.licActivate(j.code);
    {const sl=r.plan==='pc'?C.state.licPc:C.state.lic;if(r.ok&&r.guardada&&sl){sl.via='play';sl.sku=productId;C.emit()}}
    return r;
  },
  /* suscribirse: abre la hoja de pago de Google Play */
  async comprar(k){
    const K=C.cloud.info();
    if(!K.connected||!K.email)return {ok:false,sin:true,msg:'Primero entra con tu cuenta de Google: tu plan se activa para esa cuenta y así lo tienes en todos tus dispositivos.'};
    if(!BIL.svc)return {ok:false,msg:'Las suscripciones se pagan desde la app instalada desde Google Play.'};
    if(!PLAN.verificador)return {ok:false,msg:'La compra con Google Play todavía no está activada en esta versión. No se te cobró nada.'};
    const p=PLAN.planes[k];if(!p)return {ok:false,msg:'Plan desconocido.'};
    if(BIL.busy)return {ok:false,msg:''};BIL.busy=true;
    let res=null;
    try{
      const rq=new PaymentRequest([{supportedMethods:PLAY,data:{sku:p.id}}],{total:{label:'Cuadre '+(p.plan==='pc'?'versión para PC':'Pro '+p.nom),amount:{currency:'USD',value:'0'}}});
      try{res=await rq.show()}catch(e){const n=String(e&&e.name||'');return {ok:false,cancel:true,msg:/^(NotSupportedError|SecurityError)$/.test(n)?'Google Play no pudo abrir el pago en este teléfono.':''}}   // cerrar la hoja de pago es cancelar
      const token=res.details&&res.details.purchaseToken;
      if(!token){try{await res.complete('fail')}catch(e){}return {ok:false,msg:'Google no devolvió la compra. Intenta de nuevo.'}}
      const r=await C._billPost(token,p.id);
      try{await res.complete(r.ok?'success':(r.red?'unknown':'fail'))}catch(e){}
      return r;
    }finally{BIL.busy=false}
  },
  /* revisa lo que el usuario ya tiene en Google Play (otra instalación, renovación o compra que no llegó a confirmarse) */
  async restaurar(){
    const K=C.cloud.info();
    if(!BIL.svc)return {ok:false,msg:'Esto funciona dentro de la app instalada desde Google Play.'};
    if(!K.connected||!K.email)return {ok:false,sin:true,msg:'Primero entra con tu cuenta de Google.'};
    let L;try{L=await BIL.svc.listPurchases()}catch(e){return {ok:false,msg:'No pude consultar Google Play ahora. Intenta de nuevo.'}}

function topBlock(rows,hdr){
  const top={},KEYS=/^(articulo|producto|descripcion|item|material|nombre|codigo|cod|sku|unidad|unidad de medida|u m|medida)$/;
  for(let r=0;r<Math.min(hdr<0?0:hdr,30);r++){const row=rows[r]||[];
    for(let c=0;c<row.length;c++){const t=tx(row[c]);if(!t)continue;
      let key,val;const m=/^([^:]{2,30}):\s*(.*)$/.exec(t);
      if(m&&KEYS.test(nz(m[1]))){key=nz(m[1]);val=m[2].trim()}
      else if(KEYS.test(nz(t))){key=nz(t);val=''}
      else continue;
      if(!val){for(let k=c+1;k<row.length;k++){const t2=tx(row[k]);if(t2){val=t2;c=k;break}}}
      if(!val)continue;
      if(/^(articulo|producto|descripcion|item|material|nombre)$/.test(key)){if(!top.nom)top.nom=val}
      else if(/^(codigo|cod|sku)$/.test(key)){if(!top.cod)top.cod=val}
      else if(!top.u)top.u=val}}
  return top.nom||top.cod?top:null}

function analyzeSheet(s,i){
  let rows=s.rows;

  (s.merges||[]).forEach(mg=>{if(mg.c1===mg.c2&&mg.r2>mg.r1&&mg.r2-mg.r1<1000){const v=(rows[mg.r1]||[])[mg.c1];if(v==null)return;for(let r=mg.r1+1;r<=mg.r2&&r<rows.length;r++){const row=rows[r]||(rows[r]=[]);if(row[mg.c1]==null)row[mg.c1]=v}}});
  const sh={i,name:s.name||('Hoja '+(i+1)),hidden:!!s.hidden,rows,big,hdr:-1,hdrRows:1,cols:[],raw:[],rawS:[],kind:'omitir',tipoDef:'',fechaHint:'',top:null,map:{},sinEnc:false,nameIsProd:false};
  /* 1) renglón de títulos */
  let best=null;
  for(let r=0;r<Math.min(rows.length,40);r++){
    const row=rows[r]||[],ne=row.filter(v=>tx(v)!=='').length;if(ne<2)continue;
    const strs=row.filter(v=>typeof v==='string'&&v.trim()!=='').length;if(strs/ne<0.6)continue;
    const labs=labelsAt(rows,r),keys=labs.map(l=>fieldOf(l.L,l.grp)),set=new Set();let score=0;
    keys.forEach(k=>{if(k&&k[0]!=='x'&&k[0]!=='idx'&&!set.has(k[0])){set.add(k[0]);score+=k[1]>=7?2:1}});
    if(set.size>=2&&(!best||score>best.score))best={r,score,labs,keys}}
  const ncol=rows.slice(0,200).reduce((a,r)=>Math.max(a,(r||[]).length),0);
  if(best){
    sh.hdr=best.r;
    const up=best.r>0?(rows[best.r-1]||[]):[];sh.hdrRows=up.some(v=>GRP.test(nz(tx(v)))&&tx(v))?2:1;
    for(let c=0;c<ncol;c++){const l=best.labs[c]||{L:'',grp:null,disp:''},k=best.keys[c];
      sh.cols.push({c,label:l.disp||'',raw:k&&k[0]!=='x'?k[0]:null,score:k?k[1]:0,hint:k&&k[2]||''})}
  }else{
    sh.sinEnc=true;
    const r0=rows[0]||[],r1=rows[1]||[];
    const h0=r0.filter(v=>tx(v)!=='').length>=2&&r0.every(v=>v==null||typeof v==='string')&&r1.some(v=>typeof v==='number'||numLike(v));
    if(h0)sh.hdr=0;
    for(let c=0;c<ncol;c++)sh.cols.push({c,label:h0?tx(r0[c]):'',raw:null,score:0,hint:''});
  }
  /* 2) la misma clave en dos columnas: gana la más fuerte (a igualdad, la de más a la izquierda) */
  const seen={};
  sh.cols.forEach(col=>{if(!col.raw)return;const p=seen[col.raw];if(!p||col.score>p.score){if(p)p.raw=null;seen[col.raw]=col}else col.raw=null});
  /* 3) muestras */
  const d0=sh.hdr+1,nd=Math.min(rows.length,d0+400);
  sh.cols.forEach(col=>{
    const vals=[];for(let r=d0;r<nd;r++){const v=(rows[r]||[])[col.c];if(tx(v)!==''||isX(v))vals.push(v)}
    col.sample=[];const seenS=new Set();for(const v of vals){const t=cellShow(v);if(t&&!seenS.has(t)){seenS.add(t);col.sample.push(t);if(col.sample.length>=3)break}}
    col.n=vals.length;col.vals=vals;
    col.numR=vals.length?vals.filter(v=>typeof v==='number'||numLike(v)).length/vals.length:0;
    col.datR=vals.length?vals.filter(v=>isX(v)||parseFecha(v,'dmy')||parseFecha(v,'mdy')).length/vals.length:0;
    col.intSeq=vals.length>2&&vals.every((v,k)=>typeof v==='number'&&Number.isInteger(v)&&v>=1&&(k===0||v>vals[k-1]));
  });
  /* 4) refinar por contenido */
  sh.cols.forEach(col=>{

function tipoDefDe(sh){

function sinEncDudoso(sh){
